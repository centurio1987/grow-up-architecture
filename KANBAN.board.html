/* 줄 하나 취소 — 그 줄이 접히며 흐려진 뒤 빠진다(t-quick · ease-in). 마지막 줄이면 트레이째 kb-rise 반대로
   내려간다. 움직임을 못 쓰면 바로 뺀다. 접히는 동안 그 줄의 단추는 잠근다(두 번 눌러 두 번 빠지지 않게). */
function cancelRow(li, q) {
  const last = !result && queue.length === 1;
  const box = last ? $('#tray') : li;
  if (!last && li) li.style.overflow = 'hidden';
  const a = box && anim(box, last
    ? [{transform: 'none', opacity: 1}, {transform: 'translateY(10px)', opacity: 0}]
    : [{opacity: 1, height: li.offsetHeight + 'px'}, {opacity: 0, height: '0px', paddingTop: '0px', paddingBottom: '0px'}],
    tok('--t-quick'), tok('--ease-in'), 'forwards');
  if (!a) return dropOp(q);
  if (li) li.querySelectorAll('button').forEach(b => { b.disabled = true; });
  let done = false;
  const go = () => { if (done) return; done = true; try { a.cancel(); } catch (e) {} dropOp(q); };
  (a.finished || Promise.resolve()).then(go, go);
}
// 「모두 취소」 — 트레이가 내려간 뒤 비운다(마지막 줄 취소와 같은 길).
function clearAll() {
  const done = () => { queue = []; result = null; conflictSeen.clear(); sync(); };
  const a = $('#tray').classList.contains('on') && anim($('#tray'),
    [{transform: 'none', opacity: 1}, {transform: 'translateY(10px)', opacity: 0}], tok('--t-quick'), tok('--ease-in'), 'forwards');
  if (!a) return done();
  let once = false;
  const go = () => { if (once) return; once = true; try { a.cancel(); } catch (e) {} done(); };
  (a.finished || Promise.resolve()).then(go, go);
}
function drawTray() {
  const rows = result ? result.rows
    : queue.map(q => Object.assign({q, st: 'q'}, opRow(q)));
  const on = rows.length > 0 || !!result;
  $('#tray').classList.toggle('on', on);
  // 트레이는 왼쪽 아래에 떠 있다 — 그 아래 깔린 카드도 스크롤로 트레이 위까지 올릴 수 있게 판 아래를 늘린다.
  document.body.classList.toggle('tray-on', on);
  $('#tray').classList.toggle('result', !!result);
  const n = k => rows.filter(r => r.st === k).length;
  if (result) {
    const stop = rows.findIndex(r => r.st === 'fail');
    $('#tray-title').textContent = '저장 결과' + (stop >= 0 ? ` — ${stop + 1}번에서 멈춤` : '');
    $('#tray-sub').textContent = ['in', 'fail', 'unsent', 'skip'].filter(k => n(k))
      .map(k => `${ST_WORD[k].split(' · ')[0]} ${n(k)}`).join(' · ');
  } else {
    $('#tray-title').textContent = `저장 전 ${rows.length}건`;
    $('#tray-sub').textContent = DATA.serve ? '저장하면 순서대로 들어가고, 실패하면 거기서 멈춥니다'
      : '파일로 엶 — 저장하면 명령을 복사합니다';
  }
  // 「반영 대상」은 결과판에서도 남는다 — 들어간 것이 어느 체크아웃에 들어갔는지가 결과의 일부다(검토 트레이와
  // 같은 규약, SKILL 5.8 「두 화면, 한 규약」 · KAN-021 S14).
  $('#tray-target').innerHTML = trayTarget();
  $('#tray-target').hidden = !$('#tray-target').innerHTML;
  $('#tray-general').hidden = !(result && result.general);
  $('#tray-general').textContent = result && result.general ? result.general : '';
  // 충돌 표시는 그 op 가 목록에 남아 있는 동안만 — 빠진 op 의 표시는 지운다.
  const live = new Set(queue.filter(q => q.id).map(cfKey));
  [...conflictSeen.keys()].forEach(k => { if (!live.has(k)) conflictSeen.delete(k); });
  $('#tray-list').innerHTML = rows.map(rowHtml).join('');
  $('#tray-list').querySelectorAll('[data-drop]').forEach(b =>
    b.addEventListener('click', () => { const r = rows[+b.dataset.drop]; if (r) cancelRow(b.closest('li'), r.q); }));
  // 새로 쌓인 줄은 바탕이 한 번 잦아든다(저장 전 줄만 — 결과판의 줄은 새로 쌓인 것이 아니다).
  FX_TRAY.begin();
  [...$('#tray-list').children].forEach((li, i) => {
    if (FX_TRAY.hit('q' + opKey(rows[i].q)) && rows[i].st === 'q') fx(li, 'fx-trace');
  });
  FX_TRAY.end();
  // 파일 모드 — 「명령 복사」가 복사하는 것과 같은 글을 트레이 안에 접어 둔다(복사가 막히면 여기서 고른다).
  const file = !DATA.serve && !result && queue.length > 0;
  $('#tray-cmd').hidden = !file;
  if (file) {
    $('#x1').textContent = oneShot();
    $('#x3').textContent = JSON.stringify(patch(), null, 2);
    $('#x2-label').textContent = `낱개 명령 ${queue.length}줄 — 한 줄씩 붙여 넣어도 같은 결과입니다`;
    $('#x2').textContent = cliLines().join('\n');
  }
  // 바닥 — 저장 전: 모두 취소 · 저장(명령 복사). 결과판: 들어간 것은 되돌리지 않는다 · 다시 보내기 · 접기.
  const unsent = result ? rows.filter(r => r.st === 'unsent').length : 0;
  $('#tray-clear').hidden = !!result;
  $('#tray-save').hidden = !!result;
  $('#tray-save').disabled = saving || !queue.length;
  $('#tray-save').textContent = `${DATA.serve ? '저장' : '명령 복사'} · ${queue.length}건`;
  $('#tray-resend').hidden = !(result && unsent && DATA.serve);
  $('#tray-resend').textContent = `안 보낸 ${unsent}건 다시 보내기`;
  $('#tray-fold').hidden = !result;
  $('#tray-note').textContent = result && n('in') ? `들어간 ${n('in')}건은 되돌리지 않았습니다.` : '';
  trayHeight();
}
// 40rem 아래 트레이는 화면 아래 전체 폭 띠다 — 알림은 그 바로 위에 떠서 「저장 · n건」을 가리지 않는다(CSS 가
// 이 높이를 읽는다). 넓은 화면은 알림이 오른쪽 아래로 비켜 서므로 이 값을 안 쓴다.
function trayHeight() {
  const t = $('#tray');
  document.documentElement.style.setProperty('--tray-h',
    (t.classList.contains('on') ? Math.round(t.getBoundingClientRect().height) : 0) + 'px');
}

const shq = s => "'" + String(s == null ? '' : s).replace(/'/g, `'"'"'`) + "'";
function cliLines() {
  const {py, script} = DATA.cli, root = cliRoot();
  const q = shq;
  return patch().map(o => {
    const b = [py, q(script), '', q(root), '--actor', '유저'];
    if (o.op === 'add') { b[2] = 'add';
      b.push('--col', o.col, '--title', q(o.title));
      if (o.memo) b.push('--memo', q(o.memo));
      BRIEF.forEach(([k]) => { if (o[k]) b.push('--' + k, q(o[k])); });
      if (o.verbatim) b.push('--verbatim', q(o.verbatim));
      // 여기 빠지면 board-apply 로는 서식이 설정되는데 붙여 넣은 명령줄로는 안 된다 —
      // 두 경로가 같은 결과를 내야 한다는 것이 이 화면의 계약이다.
      if (o.request_template) b.push('--request-template', q(o.request_template));
      if (o.parent) b.push('--parent', o.parent);
    } else { b[2] = 'apply'; b.push('--op', o.op, '--id', o.id);
      if (o.op === 'move') b.push('--to', o.to);
      if (o.op === 'edit') b.push('--field', o.field, '--value', q(o.value));
      if (o.op === 'reparent') b.push('--to-parent', q(o.to_parent || ''));
      if (o.cascade) b.push('--cascade');
      if (o.orphan) b.push('--orphan');
      // 한 번에 넣는 길(board-apply)과 같은 충돌 확인을 받게 한다 — 두 길의 결과가 같아야 한다.
      if (o.expect != null) b.push('--expect', q(o.expect));
    }
    return b.join(' ');
  });
}
/* 「명령 복사」가 복사하는 한 덩어리 — patch JSON 을 실은 board-apply 한 번 + 이 화면을 다시
   그리는 줄. 보드 뷰 기본 자리(<보드>/KANBAN.board.html)는 board-apply 가 스스로 다시 그리지만,
   `--out` 으로 다른 자리에 그린 화면은 그 줄이 있어야 새로 선다. */
function redrawLine() {
  const {py, script} = DATA.cli, root = cliRoot();
  const board = String(script).replace(/[^\/]*$/, 'board.py');
  const here = location.protocol === 'file:' ? decodeURIComponent(location.pathname) : '';
  const out = here && here !== root + '/KANBAN.board.html' ? ' --out ' + shq(here) : '';
  return `${py} ${shq(board)} ${shq(root)}${out}`;
}
function oneShot() {
  const {py, script} = DATA.cli, root = cliRoot();
  return `cat <<'PATCH' | ${py} ${shq(script)} board-apply ${shq(root)} --patch - && ${redrawLine()}\n` +
    `${JSON.stringify(patch(), null, 2)}\nPATCH`;
}
function copyCommands() {
  // 파일로 연 화면 — 명령을 붙여 넣고 다시 그린 파일을 이 탭에서 열면, 지금 떠 둔 값 · 자리와 견줘 「방금 바뀜」을
  // 붙인다(저장소를 못 쓰면 표시 없이 그린다).
  saveSeen(seenNow());
  const t = oneShot();
  const done = () => toast('명령을 복사했습니다 — 터미널에 붙여 넣은 뒤 이 화면을 다시 여세요.');
  const fail = () => { $('#tray-cmd').open = true;
    toast('복사가 막혔습니다 — 트레이의 「터미널에 붙여 넣을 명령」을 직접 골라 복사하세요.'); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fail);
    else fail();
  } catch (e) { fail(); }
}

/* ─── 충돌 판 — 아무것도 쓰지 않았다(종료코드 16) ─────────────────────────
   세 값(내가 본 값 · 바꾸려던 값 · 지금 값)이 **모두 다른** 줄만 싣는다. 지금 값이 이미 바꾸려던
   값이면 board-apply 는 충돌이 아니라 「건너뜀」으로 처리한다(시안 맞춤 B2 · SKILL 5.8).
   저장 전 목록과 처음 본 값(expect)은 그대로 남는다 — 지금 값으로 다시 그린 뒤 여전히 필요한
   것만 저장하게 한다. */
const FIELD_OF = {col: '칸', parent: '상위'};
// 판에 싣는 충돌 — 세 값이 모두 다르거나 카드가 없어진 것. 트레이 줄의 「충돌」 표시도 이것만 단다.
const realConflicts = list => (list || []).filter(c => c.now == null ||
  (norm(c.now) !== norm(c.seen) && norm(c.now) !== norm(c.mine)));
function showConflicts(list) {
  const show = (f, v) => v == null ? '(없음)' : v === '' ? (f === 'parent' ? '(루트)' : '(빈 값)')
    : f === 'col' ? (DISP[v] || v) : f === 'parent' ? (labOf(v) || v) : v;
  // 칸 값은 칸 네모 + 이름(시안 BoardConflict) — 색만으로 말하지 않고 이름이 늘 함께 선다.
  const cell = (f, v) => f === 'col' && v && TINT[v] ? colTag(v) : esc(show(f, v));
  const real = realConflicts(list);
  const rows = real.map(c => {
    const name = labOf(c.id) || (canon(c.id) ? lab(canon(c.id)) : c.id);
    const what = c.op === 'archive' ? '보관' : (FIELD_OF[c.field] || FIELD_KO[c.field] || c.field);
    const mine = c.op === 'archive' ? esc('보관') : cell(c.field, c.mine);
    return `<tr><td><b>${mdi(name)}</b></td><td>${esc(what)}</td><td>${cell(c.field, c.seen)}</td>` +
      `<td>${mine}</td><td class="now">${c.now == null ? esc(c.why || '보드에 없음') : cell(c.field, c.now)}</td></tr>`;
  }).join('');
  const who = DATA.token ? '허브' : '서버';
  $('#modal-box').innerHTML = `
    <div class="sheet-head"><p class="label">저장하지 않았습니다 · 아무것도 쓰지 않음</p>
      <h2>이 화면을 연 뒤 다른 곳에서 먼저 바뀐 카드가 있습니다</h2>
      <p class="muted">저장 전 ${queue.length}건은 그대로 남아 있습니다. 지금 값으로 보드를 다시 그린 뒤,
        여전히 필요한 것만 저장하세요.</p></div>
    <div class="sheet-body">
      <table class="tbl" id="x-conflicts"><thead><tr><th>카드</th><th>항목</th><th>내가 본 값</th>
        <th>바꾸려던 값</th><th>지금 값</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="sheet-note">「지금 값」은 ${who}가 돌려준 값입니다. 세 값이 모두 다른 건만 여기 옵니다 — 지금 값이
        이미 바꾸려던 값이면 충돌이 아니라 「건너뜀」이라 저장 결과에 그렇게 적힙니다.</p></div>
    <div class="sheet-foot"><button id="x-clear">저장 전 목록 비우기</button>
      <button class="primary" id="x-close">지금 값으로 다시 그리기 · 저장 전은 남김</button></div>`;
  $('#modal').classList.add('on');
  $('#x-close').addEventListener('click', () => closeModal());
  $('#x-clear').addEventListener('click', () => { queue = []; result = null; conflictSeen.clear(); closeModal(); });
  $('#x-close').focus();
}
// 충돌 판을 닫으면 붙잡아 둔 지금 보드로 다시 그린다 — 어느 길로 닫든(단추 · Esc · 바깥) 같다. 지금 보드도
// 저장된 새 데이터라(다른 곳에서 먼저 바뀐 것) 그린 뒤 「방금 바뀜」을 붙인다.
function closeModal() {
  $('#modal').classList.remove('on');
  let plan = null;
  if (held) { const d = held; held = null; plan = renew(d); }
  sync(); redraw();
  if (plan) arrive(plan);
}
/* 새 데이터로 갈아 끼우기 직전 — 지금 화면의 값과 자리를 떠서 저장소에 적고(다시 그리기 직전), 갈아 끼운 뒤
   견준다. 빠질 카드(새 데이터에 없는 카드)는 사본을 떠 둔다 — 그린 뒤 그 자리에서 접혀 사라진다. */
function renew(d) {
  const old = seenNow();
  saveSeen(old);
  const next = new Set(((d && d.cards) || []).map(c => c.id));
  const leaving = canAnimate() ? grab(id => !isNew(id) && !next.has(id)) : [];
  setData(d);
  const plan = noteChanges(old);
  plan.leaving = leaving;
  return plan;
}

/* ─── 저장 결과판 ──────────────────────────────────────────────────────────
   줄마다 상태는 **응답 값으로** 가른다 — `applied` 앞에서부터 들어감(그 안의 `skipped` 는 건너뜀),
   `failed.op` 가 있으면 그다음 줄이 실패(사유 원문 · 여기서 멈춤), 나머지는 안 보냄. 사유 문장을
   문구로 갈래 짓지 않는다. 들어간 op 는 저장 전 목록에서 빠지고, 실패 · 안 보냄은 남는다. */
function failReason(f) {
  const raw = String((f && (f.detail || f.reason)) || '').trim();
  try { const o = JSON.parse(raw); if (o && (o.reason || o.error)) return String(o.reason || o.error); } catch (e) {}
  return raw || '사유가 오지 않았습니다';
}
function showResult(out, sent) {
  out = out || {};
  sent = sent || queue.slice();
  resultSeq++;
  if (out.conflicts) {
    // 아무것도 안 들어갔다. 지금 보드는 붙잡아 두었다가 판을 닫을 때 다시 그린다. 충돌한 op 는 목록에 남아
    // 처음 본 값을 이어받으므로, 그 줄에 「충돌 — 취소 뒤 다시 옮기기」를 단다(rowHtml).
    result = null; held = out.data || null;
    realConflicts(out.conflicts).forEach(c => {
      const key = c.op === 'edit' ? c.field : (EXPECT_KEY[c.op] || c.field);
      const q = queue.find(x => x.id === c.id && expectKey(x) === key && x.expect != null);
      if (q) conflictSeen.set(cfKey(q), q.expect);
    });
    showConflicts(out.conflicts);
    drawTray();
    return;
  }
  const applied = out.applied || [];
  const f = out.failed;
  const perOp = !!(f && f.op);                  // op 하나가 거부됐다
  const general = !out.ok && !perOp ? failReason(f || out) : '';   // 패치 전체가 못 갔다
  const rows = queue.map(q => {
    const base = Object.assign({q}, opRow(q));   // 이름 · 낱말은 새 데이터가 오기 **전에** 적는다
    const i = sent.indexOf(q);
    if (i < 0 || general) return Object.assign(base, {st: 'unsent'});
    if (i < applied.length) {
      const a = applied[i] || {};
      return Object.assign(base, a.skipped ? {st: 'skip', why: a.note || ''} : {st: 'in'});
    }
    if (perOp && i === applied.length) return Object.assign(base, {st: 'fail', why: failReason(f)});
    return Object.assign(base, {st: 'unsent'});
  });
  queue = rows.filter(r => r.st === 'fail' || r.st === 'unsent').map(r => r.q);
  result = rows.every(r => r.st === 'in') && !general ? null : {rows, general};
  // 저장 뒤 새 데이터 — 다시 그리기 직전에 값과 자리를 떠 두고, 그린 뒤 「방금 바뀜」 · 움직임(arrive).
  const plan = out.data ? renew(out.data) : null;
  if (!result) toast('보드에 반영했습니다.');
  sync(); redraw();
  if (plan) arrive(plan);
}
function unsentOps() { return result ? result.rows.filter(r => r.st === 'unsent').map(r => r.q) : []; }
function beginSave(only) {
  saving = true;
  const b = $('#tray-save'); if (b) b.disabled = true;
  const r = $('#tray-resend'); if (r) r.disabled = true;
  const pick = Array.isArray(only) ? queue.filter(q => only.includes(q)) : queue.slice();
  return pick.length ? pick : queue.slice();
}

async function save(only) {
  if (!DATA.serve || !queue.length) return;
  const ops = beginSave(only);
  try {
    const r = await fetch('apply', {method: 'POST',   /* 화면 주소 기준이다. 옛 서버는 `/`, 허브는 `/b/<레포>/` */
      headers: {'Content-Type': 'application/json', 'X-Kanban-Hub-Token': DATA.token || ''},
      body: JSON.stringify(strip(ops))});
    const out = await r.json();
    saving = false;
    showResult(out, ops);
  } catch (e) {
    saving = false;
    showResult({ok: false, applied: [], pending: ops.length,
                reason: '저장 요청이 서버에 닿지 않았습니다 — ' + e}, ops);
  }
  $('#tray-resend').disabled = false;
}

/* ─── 뷰 전환 · 잡동사니 ───────────────────────────────────────────────── */
function setView(v) {
  const was = view;
  view = v;
  ['board', 'tree', 'rel'].forEach(k => {
    $('#pane-' + k).classList.toggle('on', k === v);
    $('#t-' + k).setAttribute('aria-selected', String(k === v));
  });
  $('#t-menu-t').textContent = $('#t-' + v).textContent;
  setMenu(false);
  // 관계 탭에서는 「지금 볼 것」 띠를 감춘다(KAN-023 S5, 정할 것 1 · 시안 `BoardRelations` · `BoardRelations375`) —
  // 관계 탭의 질문은 「무엇이 무엇에 묶였나」라 첫 화면 질문의 답이 그 앞을 차지할 까닭이 없다. 서랍 윗자리도 다시 잰다.
  $('#waiting').hidden = v === 'rel';
  placeDrawer();
  redraw();
  // 탭 바꿈 — 새 내용이 흐림에서 짙어진다. 미끄러짐은 없다(120ms 는 motion.md 의 값, 토큰 없음).
  if (was !== v) anim($('#pane-' + v), [{opacity: 0}, {opacity: 1}], 120, tok('--ease-out'));
}
function redraw() { if (view === 'tree') drawTree(); else if (view === 'rel') drawRel(); }
let toastT = null;
function toast(msg) {
  trayHeight();
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}

$('#t-board').addEventListener('click', () => setView('board'));
$('#t-tree').addEventListener('click', () => setView('tree'));
$('#t-rel').addEventListener('click', () => setView('rel'));
$('#t-add').addEventListener('click', () => { if (view !== 'board') setView('board'); addCard('backlog'); });
$('#t-theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
});
$('#d-close').addEventListener('click', closeDrawer);
// 40rem 아래 시트 윗줄 — 「‹ 보드」와 닫기는 같은 일이다. 닫으면 연 칸 탭으로 돌아간다(motion.md 「서랍 열기(375)」).
$('#d-back').addEventListener('click', closeDrawer);
$('#d-close2').addEventListener('click', closeDrawer);
$('#t-menu').addEventListener('click', e => { e.stopPropagation(); setMenu(!$('#h-menu').classList.contains('open')); });
$('#t-find').addEventListener('click', () => setFind(!$('#head').classList.contains('finding')));
// 메뉴 밖을 누르면 닫는다. 메뉴 안의 단추는 제 일을 한 뒤 닫는다(테마만 열어 둔다 — 바뀐 것을 그 자리에서 본다).
document.addEventListener('click', e => {
  if (!$('#h-menu').classList.contains('open') || e.target.closest('#t-theme')) return;
  if (!e.target.closest('#h-menu') || e.target.closest('button')) setMenu(false);
});
window.addEventListener('scroll', () => { if (sel) placeDrawer(); }, {passive: true});   // 닫혀 있으면 열 때 잰다
window.addEventListener('resize', placeDrawer);
$('#d-archive').addEventListener('click', askArchive);
$('#d-done').addEventListener('click', toggleDone);
$('#tray-clear').addEventListener('click', clearAll);
$('#tray-save').addEventListener('click', () => DATA.serve ? save() : copyCommands());
$('#tray-resend').addEventListener('click', () => save(unsentOps()));
$('#tray-fold').addEventListener('click', () => { result = null; sync(); });
$('#q').addEventListener('input', e => {
  filter = e.target.value.trim().toLowerCase();
  $('#t-find').classList.toggle('on', !!filter);      // 찾기 줄을 접어도 걸러진 판이라는 것이 보인다
  moving(draw);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#h-menu').classList.contains('open')) { setMenu(false); $('#t-menu').focus(); }
  else if ($('#modal').classList.contains('on')) closeModal();
  else if (adding) addClose();
  else if (sel) closeDrawer();
});

/* 처음 그리기 — 이 탭에 떠 둔 것이 있으면(앞서 연 화면 · 명령 복사 직전) 표시를 되살리고 견준다. 보드
   지문은 함께 적어 두지만 견줌은 **카드 값**으로 한다 — 지문이 같으면 값도 같아 바뀐 것이 0 으로 나오고,
   지문만 같고 값이 다른 판(손으로 고친 응답)에서도 표시가 데이터와 어긋나지 않는다. 없거나 못 읽으면
   표시 없이 그린다. */
const SEEN0 = stRead();
restoreMarks(SEEN0);
setData(DATA);
const PLAN0 = validSeen(SEEN0) ? noteChanges(SEEN0) : null;
sync();
arrive(PLAN0);
/* 주소 해시 `#card=<카드 id>` 로 열면 그 카드 서랍이 열린 채로 뜬다(KAN-023 S5) — 계획 리포트 판 줄의 「보드에서
   이 카드 ›」가 여기로 온다. 보드에 없는 id 는 조용히 둔다(지난 판 리포트가 지워진 카드를 가리킬 수 있다). 같은
   탭에서 해시만 바뀌어도 따른다. */
function openFromHash() {
  const m = /^#card=(.+)$/.exec(location.hash);
  if (!m) return;
  let id;
  try { id = decodeURIComponent(m[1]); } catch (e) { return; }
  if (byId(id) && sel !== id) select(id);
}
openFromHash();
addEventListener('hashchange', openFromHash);

</script>
