         flex-direction: column; gap: 8px; }
.d-sec h3 { font-size: 13px; line-height: 1.4; font-weight: 700; color: var(--fg-muted); }
/* 「지금까지」 — 첫 줄은 스크립트가 조립한 문장, 그 아래 최근 기록 세 줄(두 줄 넘으면 말줄임). 점선 상자는
   「사람이 쓴 글이 아니라 기록에서 조립한 글」이라는 표시다. */
.auto { border: 1.5px dashed var(--line-soft); background: var(--bg); padding: 10px 12px;
         display: flex; flex-direction: column; gap: 6px; }
.so-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 12px;
           color: var(--fg-subtle); }
.so-head b { color: var(--fg-muted); }
.so-lead { font-size: 13.5px; line-height: 1.55; color: var(--fg); }
.so-rows { display: flex; flex-direction: column; gap: 4px; border-top: 1.5px solid var(--line-soft);
           padding-top: 7px; font-size: 13px; }
.so-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; }
.so-row dt { color: var(--fg-subtle); font-size: 12px; padding-top: 1px; font-variant-numeric: tabular-nums; }
.so-row dd { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.so-tag { font-weight: 700; color: var(--fg-muted); }
/* 브리프 — 목적 · 이유 · 목표를 그 자리에서 고친다. 입력칸은 읽는 글처럼 보이고(테 없음) 짚으면 테가 선다.
   저장 전 값이 있는 칸은 점선 테 + 「저장 전」(카드 겉의 그 칸과 같은 모양 — BoardPending 4번 줄). */
.brief { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px 10px; font-size: 13.5px; }
.brief dt { font-weight: 700; color: var(--fg-muted); font-size: 12.5px; padding-top: 3px;
            display: flex; flex-direction: column; gap: 2px; }
.brief dt .pend { font-weight: 500; font-size: 11px; color: var(--fg-muted); }
textarea.inplace { display: block; width: 100%; border: 1.5px solid transparent; background: transparent;
                   padding: 1px 6px; margin: 0 -7px; font-size: 13.5px; line-height: 1.5; resize: none;
                   overflow: hidden; field-sizing: content; min-height: 0; }
textarea.inplace:hover { border-color: var(--line-soft); }
textarea.inplace:focus { border-color: var(--border); background: var(--bg-elevated); }
textarea.inplace::placeholder { color: var(--fg-subtle); }
.drawer .fp, textarea.inplace.fp { border: 1.5px dashed var(--pending-line); }
.d-save { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px;
          color: var(--fg-subtle); }
.d-save button { font-size: 13px; }
.edit-grid { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.edit-grid label { font-size: 12.5px; font-weight: 700; color: var(--fg-muted); }
.edit-grid input, .edit-grid select, .edit-grid textarea { font-size: 13.5px; }
.drawer .note { font-size: 12.5px; color: var(--fg-subtle); line-height: 1.55; }
/* 단계 — 묶음별 목록. 점의 모양이 상태다(끝남 채움 · 지금 빗금 · 아직 빈 칸 · 보류 점선) — 숨은 글이 함께 읽힌다. */
.steps { display: flex; flex-direction: column; }
.steps .batch { font-size: 12px; color: var(--fg-subtle); padding: 6px 0 2px; display: flex; gap: 8px; }
.steps .batch b { color: var(--fg-muted); }
.step { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start;
        font-size: 13px; padding: 2px 0; }
.step .dot { width: 14px; height: 14px; border: 1.5px solid var(--border); margin-top: 3px; }
.step.s-done { color: var(--fg-muted); }
.step.s-done .dot { background: var(--fg); }
.step.s-doing { font-weight: 700; }
.step.s-doing .dot { background: repeating-linear-gradient(45deg, var(--accent) 0 3px, transparent 3px 6px); }
.step.s-hold .dot { border-style: dashed; }
.step .stx { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.step .hold { font-weight: 700; color: var(--fg-muted); }
.steps-all > summary { display: flex; gap: 8px; font-size: 12.5px; }
/* 이어진 카드 — 낱말 라벨(상위 · 하위 · 참조 · 불러온 곳) · 이름(누르면 그 카드 서랍) · 칸 이름표. */
.rels { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.rels li { display: flex; align-items: baseline; gap: 8px; }
.rel-name { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; text-align: left;
            color: var(--fg); flex: 1 1 auto; }
.rel-name:hover { background: none; text-decoration: underline; text-underline-offset: 3px; }
.rels .colmark { flex: none; }
.chip.plain { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; flex: none;
              border: 1.5px solid var(--line-soft); color: var(--fg-muted); font-size: 11.5px; font-weight: 500; }
/* 접힘 — 원문 · 요청서 · 메모 · 전략 · 실행 계획 · 검증 · 겹침 · 기술 정보. 접힌 줄에 무엇이 들었는지를
   적는다(접는 것은 자리를 아끼려는 것이지 숨기려는 게 아니다). 꺾쇠는 테두리로 그린다(글자 기호 없음). */
.drawer details { margin: 0; }
.drawer details > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
                            min-height: 40px; padding: 0 18px; background: none; border: 0;
                            font-family: var(--font-sans); font-size: 14px; font-weight: 600; color: var(--fg); }
.drawer details > summary::-webkit-details-marker { display: none; }
.drawer details > summary::before { content: ""; flex: none; width: 7px; height: 7px; margin-right: 2px;
                                    border-right: 2px solid var(--fg); border-bottom: 2px solid var(--fg);
                                    transform: rotate(-45deg); }
.drawer details[open] > summary::before { transform: rotate(45deg); }
.drawer .sum-meta { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--fg-subtle);
                    text-align: right; }
.drawer-body > details.fold { border-top: 1.5px solid var(--line-soft); }
.fold-body { padding: 0 18px 14px 33px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.fold-body > * { margin: 0; }
.fold-body h2, .fold-body h3, .fold-body h4 { font-size: 14px; margin: .4rem 0 0; border: 0; padding: 0; }
/* 원문 글의 표 · 코드는 제 상자 안에서만 가로로 민다 — 서랍은 밀리지 않는다. */
.fold-body table { display: block; overflow-x: auto; font-size: 13px; margin: 0; }
.fold-body th, .fold-body td { font-size: 13px; padding: .3rem .5rem; overflow-wrap: normal; min-width: 4rem; }
.fold-body pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-size: 12.5px; }
.fold-body ul, .fold-body ol { padding-left: 1.2rem; }
/* 서랍 안 접힘(「다른 칸 고치기」 · 묶음 다 끝남 · 이어진 카드 더 보기)은 들여 쓴다. */
.d-sec details > summary { padding: 0; min-height: 32px; font-size: 13px; }
.d-sec .fold-body { padding: 4px 0 0; }
.tech { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 3px 10px;
        font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); }
.tech dt { color: var(--fg-subtle); }
.d-empty { padding: 12px 18px; font-size: 12.5px; color: var(--fg-subtle); }
/* 보관 — 살아 있는 하위가 있으면 서랍 안 두 단추(시안 BoardOps ③). */
.choice { border: var(--border-width) solid var(--border); background: var(--bg-elevated);
          padding: 10px 12px; margin: 12px 18px 0; display: flex; flex-direction: column; gap: 8px;
          font-size: 13px; }
.choice p { margin: 0; }
.row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .6rem 0; }
.works { list-style: none; padding: 0; }
.works li { display: flex; gap: .5rem; align-items: baseline; padding: .2rem 0;
            border-bottom: 1px dotted var(--border); }
.works code { min-width: 2.4rem; }

/* ─── 서랍이 열린 판 — 1100px 이상: 백로그 · 완료를 52px 띠로 접고, 판은 서랍 왼쪽으로 비켜 선다 ───
   띠는 칸마다 늘 그려 두고(railEl) 여기서만 보인다. 1100px 미만은 아래 「1100px 미만」, 40rem 아래는 맨 아래. */
.col-rail { display: none; }
@media (min-width: 1100px) {
  .drawer-on .stage { padding-right: 508px; }
  .drawer-on .cols { grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) 52px; }
  .drawer-on .col[data-col="backlog"] > :not(.col-rail),
  .drawer-on .col[data-col="done"] > :not(.col-rail) { display: none; }
  .drawer-on .col-rail { display: flex; flex-direction: column; align-items: center; gap: 10px;
                         border-top: 6px solid var(--colc, var(--bg-sunken)); padding-top: 10px; min-height: 12rem; }
  .col-rail .n { font-size: 13px; color: var(--fg-subtle); }
  .col-rail .rn { writing-mode: vertical-rl; font-weight: 700; font-size: 13px; letter-spacing: .04em; }
  .col-rail .rnote { writing-mode: vertical-rl; font-size: 11.5px; color: var(--fg-muted); padding: 6px 0;
                     border: 1.5px solid var(--line-soft); }
}
/* 1100px 미만(예 1024) — 서랍 440px 이 판 위에 겹친다. 판은 흐려지지도 접히지도 않고, 「지금 볼 것」도 그대로다
   (시안 2.1-6 · BoardDrawer1024). 머리는 찾기 칸을 줄여 한 줄에 든다(시안 `bd--compact`). */
@media (min-width: 40.0625rem) and (max-width: 1099.98px) {
  .drawer { width: 440px; }
  .head { gap: 10px; }
  .search { width: 160px; }
}
/* 40rem 아래 — 서랍은 화면 전체 시트이고 통째로 내려 읽는다(BoardDrawer375). 머리 · 띠를 덮는다 — 윗줄
   「‹ 보드 · 카드 상세」가 시트 안에서 늘 위에 붙어 있다. 시트는 옆이 아니라 아래 10px 에서 올라온다(kb-rise 와
   같은 길 — motion.md 「서랍 열기(375)」). */
@media (max-width: 40rem) {
  .drawer { top: 0; width: 100vw; border-left: 0; overflow-y: auto; transform: translateY(10px); }
  .d-sheet { display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 3; min-height: 52px;
             padding: 0 8px 0 4px; border-bottom: var(--border-width) solid var(--border); background: var(--bg); }
  .d-sheet b { font-size: 13.5px; }
  #d-close { display: none; }
  .drawer.on { box-shadow: none; transform: none; }
  .drawer-body { flex: none; overflow: visible; }
  .drawer-head, .d-sec { padding-left: 16px; padding-right: 16px; }
  .drawer details > summary { min-height: 44px; padding: 0 16px; }
  .fold-body { padding: 0 16px 14px 31px; }
  .d-sec details > summary { padding: 0; }
  .d-sec .fold-body { padding: 4px 0 0; }
}

/* ─── 저장 전 트레이 — 왼쪽 아래 띠, 저장 뒤에는 같은 자리가 결과판 ──────────────
   머리는 골드를 쓰지 않는다 — 골드는 「내 차례」 칩 · 진행 중 칸 띠만 말한다(시안 2.1-4). 줄마다
   「취소」 · 아래 「모두 취소」 · 머리 「반영 대상」(검토 화면과 같은 규약). 결과판의 상태 글은
   들어감 `--ok-fg` · 실패 `--danger-fg`(다크에서도 4.5:1, 시안 7절) · 안 보냄 · 건너뜀은 흐린 글. */
.tray { position: fixed; left: 1rem; bottom: .9rem; z-index: 70;
        width: min(35rem, calc(100vw - 2rem)); background: var(--bg-elevated);
        border: var(--border-width) solid var(--border); box-shadow: var(--offset-lg);
        display: none; }
/* 처음 쌓이면 아래 10px 에서 올라온다(kb-rise) — 닫혀 있던(display:none) 트레이가 설 때만 돈다. */
.tray.on { display: block; animation: kb-rise var(--t-move) var(--ease-out) 1 backwards; }
.tray-on .stage { padding-bottom: min(32rem, 60vh); }
.tray-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 10px 12px; }
.tray-head h3 { margin: 0; font-size: 14px; line-height: 1.3; }
.tray-sub { margin: 0; font-size: 12.5px; color: var(--fg-subtle); }
.tray-target { margin: 0; padding: 0 12px 9px; font-size: 12px; color: var(--fg-muted); overflow-wrap: anywhere; }
.tray-target .mono { font-family: var(--font-mono); color: var(--fg); }
.tray-why { margin: 0; padding: 0 12px 9px; font-size: 12.5px; color: var(--danger-fg); overflow-wrap: anywhere; }
.tray ol { margin: 0; padding: 0; list-style: none; max-height: 14rem; overflow-y: auto;
           border-top: 1.5px solid var(--line-soft); }
.tray-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 8px;
            align-items: center; margin: 0; padding: 7px 12px; font-size: 13px;
            border-bottom: 1.5px solid var(--line-soft); }
.tray-row:last-child { border-bottom: 0; }
.tray-row .tn { font-size: 12px; color: var(--fg-subtle); }
.tray-row .tb { min-width: 0; overflow-wrap: anywhere; }
.tray-row .tw { color: var(--fg-muted); }
.tray-row .st { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.tray-row .why { grid-column: 2 / -1; margin: 0; font-size: 12.5px; color: var(--fg); overflow-wrap: anywhere; }
/* 충돌 뒤 남은 줄 — 이 줄은 처음 본 값(expect)을 이어받아 다시 저장해도 같은 충돌이 난다. */
.tray-row .why.cf b { color: var(--danger-fg); }
.tray-row.in .st { color: var(--ok-fg); }
.tray-row.fail { background: color-mix(in srgb, var(--danger) 9%, transparent); }
.tray-row.fail .st { color: var(--danger-fg); font-weight: 700; }
.tray-row.unsent, .tray-row.skip { color: var(--fg-subtle); }
.tray-row.unsent .tw, .tray-row.skip .tw { color: var(--fg-subtle); }
.tray-cmd { margin: 0; padding: 8px 12px; border-top: 1.5px solid var(--line-soft); font-size: 12.5px; }
.tray-cmd summary { font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; }
.tray-cmd pre { margin: 6px 0; padding: 8px 10px; max-height: 12rem; overflow: auto; white-space: pre-wrap;
                word-break: break-all; font-size: 11.5px; background: var(--bg); border: 1.5px solid var(--line-soft); }
.tray-cmd details { margin: 6px 0 0; }
.tray-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px;
             border-top: 1.5px solid var(--line-soft); }
.tray-note { font-size: 12.5px; color: var(--fg-muted); }
.tray-note:empty { display: none; }

/* 충돌 판 — 뒤 흐린 막은 바탕 토큰을 섞어 만든다(리터럴 색은 다크에서 안 바뀐다). */
.modal { position: fixed; inset: 0; z-index: 90; background: color-mix(in srgb, var(--bg) 55%, transparent);
         display: none; align-items: flex-start; justify-content: center; padding: 6.5rem 1.5rem 1.5rem; }
/* 충돌 판 — 뒤 막이 흐려지며 서고 판은 위 8px 에서 내려온다(kb-drop-in, t-move). */
.modal.on { display: flex; animation: kb-fade-in var(--t-move) var(--ease-out) 1 backwards; }
.modal.on .box { animation: kb-drop-in var(--t-move) var(--ease-out) 1 backwards; }
@keyframes kb-drop-in { 0% { transform: translateY(-8px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.modal .box { background: var(--bg-elevated); border: 3px solid var(--border);
              box-shadow: var(--offset-lg); max-width: 47.5rem; width: 100%;
              max-height: 80vh; overflow-y: auto; padding: 0; }
.modal pre { white-space: pre-wrap; word-break: break-all; max-height: 22rem;
             overflow-y: auto; }
.sheet-head { padding: 16px 20px 12px; border-bottom: var(--border-width) solid var(--border);
              display: flex; flex-direction: column; gap: 6px; }
.sheet-head > * { margin: 0; }
.sheet-head h2 { font-size: 19px; line-height: 1.3; border: 0; padding: 0; }
.sheet-head .label { font-size: 12px; font-weight: 700; color: var(--fg-muted); }
.sheet-head .muted { font-size: 13.5px; color: var(--fg-muted); }
.sheet-body { padding: 14px 20px; overflow-x: auto; }
.sheet-note { font-size: 12.5px; color: var(--fg-subtle); margin: 10px 0 0; }
.sheet-foot { padding: 12px 20px; border-top: 1.5px solid var(--line-soft); display: flex; flex-wrap: wrap;
              gap: 8px; justify-content: flex-end; }
.tbl { margin: 0; font-size: 13px; border: 0; background: transparent; }
.tbl th { font-size: 12px; color: var(--fg-muted); padding: 7px 10px; border: 0;
          border-bottom: 1.5px solid var(--border); }
.tbl td { padding: 9px 10px; border: 0; border-bottom: 1.5px solid var(--line-soft); vertical-align: top; }
.tbl td.now { font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%);
         background: var(--ink); color: var(--cream); padding: .5rem 1rem; z-index: 95;
         border: var(--border-width) solid var(--border); font-size: 14px; display: none; }
.toast.on { display: block; }

strong>순서는 비교 쌍이 이웃하도록<\/strong> 잡는다(배치 크기는 2다 — 묶음이 배치 경계와 같지 않다): Factory Method·Abstract Factory / Builder·Singleton / Prototype·Adapter / Decorator·Proxy / Facade·Bridge / Composite·Flyweight / Observer·Mediator / Command·State / Template Method·Chain of Responsibility / Iterator·Memento / Visitor·Interpreter. 비교 쌍이 배치를 넘으면 뒤 배치 워커에게 앞 배치의 확정본을 입력으로 주고, 같은 배치면 배치 끝에 메인이 교차 확인한다.<\/p>\n<h4>배치 2관점 (2026-09-17 .3 S4 회고가 <code>batch_size_works<\/code> = 2 로 확정하고 배치 문서를 만들었다 — 근거: 파일럿 세 편 모두 3라운드 소진. 당시 함께 든 codex 한도 근거는 2026-09-20 외부 검토 제거로 사라졌고, 남은 근거는 세션 토큰 예산이다)<\/h4>\n<ul>\n<li><strong>단일 에이전트(순차)<\/strong> — 배치: <strong>11배치 (2편씩, <code>KANBAN/batches/KAN-001.4-BJT8JD.batch1~11.md<\/code>)<\/strong> / 비고: 세션 예산 절반 지점에서 끊는다 · 비교 쌍이 배치를 넘으면(Builder↔Abstract Factory, Adapter↔Decorator↔Proxy, Mediator↔Facade) 뒤 배치 워커에게 앞 배치의 확정본을 입력으로 준다<\/li>\n<li><strong>오케스트레이션(병렬)<\/strong> — 배치: 11배치, 폭 2 — 외부 모델 호출이 0 이라 옛 한도 제약(편당 codex 6회)은 사라졌다. 남은 제약은 세션 토큰이고, 집필 워커 둘 + 편마다 채점 워커가 한 배치의 예산이다 / 비고: 같은 파일을 두 워커가 만지지 않는다 · 워커는 커밋하지 않고 메인이 work 순서대로 <code>doc-step done<\/code> → 커밋 → 태그 · 비교 쌍은 배치 끝에 교차 확인<\/li>\n<\/ul>\n<h4>집필 중 반복해서 걸리는 자리 (배치1~5 실측)<\/h4>\n<p>편마다 워커 입력에 넣어 미리 막는다. 새로 드러나면 여기 보탠다.<\/p>\n<ul>\n<li><strong>진단 인용<\/strong> — 초기 네 편 중 셋이 1라운드에 걸렸다(진단을 다른 갈래 것으로 인용 · 백틱·파일명 앞머리 · 요약 줄을 오류로 셈). <strong>「어디까지가 원문이고 무엇을 지웠는지 본문에 밝혀라」<\/strong>를 입력에 넣은 뒤로는 안 나온다.<\/li>\n<li><strong>재현 절차의 범위<\/strong> — 수치는 맞는데 <strong>그 수치를 내는 편집 범위<\/strong>를 본문이 좁게 적는다(Bridge 배치5: 「그 줄만 고치면 3·3·5」인데 실측은 1·3·1, 생성자 인자까지 고쳐야 3·3·5). <strong>검산하면 통과하고 절차를 재현해야 걸린다<\/strong> — 집필자는 자기가 고친 범위를 알고 있어 못 본다.<\/li>\n<li><strong>원전 귀속<\/strong> — Facade 배치5 가 「GoF Facade 절 Related Patterns」 근거에 Adapter 를 달았는데 그 절에는 Abstract Factory·Mediator·Singleton 셋뿐이었다. <strong>실행으로 검증할 수 없어 채점자가 원문을 직접 열어야 잡힌다.<\/strong><\/li>\n<li><strong>노트의 원전 인용 항목 수를 「항목 n」으로 받지 않는다.<\/strong> 두 파일에서 같은 유형이 나왔다 — <code>gof-creational-structural.md<\/code> 의 Flyweight <code>collaborations<\/code>(노트 3개 → 원문 불릿 2개, 배치6)와 <code>gof-behavioral.md<\/code> 의 Observer <code>collaborations<\/code>(노트 3개 → 원문 불릿 2개, 배치7). <strong>다만 일괄 오류가 아니다<\/strong> — 같은 파일의 Mediator 절은 원문 Collaborations 문장을 인용한 뒤 <strong>Motivation 의 사건 순서<\/strong>를 따로 번호로 적은 구조라 4개가 맞다(노트가 그 사실을 명시한다). <strong>절마다 구조가 다르므로 인용 전에 그 절의 원문을 열어 확인한다.<\/strong><\/li>\n<li><strong>진단 문자열이 맞아도 「왜 그 진단이 나는가」는 따로 확인 대상이다<\/strong>(배치7 Observer). 그 편이 tsc 가 막는 이유를 「<code>private<\/code> 필드 때문」이라고 적었는데 <strong><code>public<\/code> 으로 바꿔도 진단 세 건이 글자 단위로 같았다.<\/strong> 실제 원인은 구조적 호환 규칙이고 private-출처 규칙은 <strong>다른 진단<\/strong>을 낸다. <strong>원인을 단정했으면 원인을 바꿔가며 재현해 본다.<\/strong><\/li>\n<li><strong>자기 채점은 판정을 놓친다<\/strong> — Bridge 배치5 에서 채점 워커가 응답하지 않아 집필자가 자기 채점했고 PASS 를 냈는데, 독립 채점이 위 「재현 절차의 범위」를 MUST 미흡으로 잡았다. <strong>기계로 재는 것(문체 등급·S1/S2/S3·산문 연속)은 두 채점이 정확히 일치했고 판정만 갈렸다.<\/strong> 채점 워커가 응답하지 않으면 자기 채점으로 넘기지 말고 메인에 보고한다.<\/li>\n<\/ul>\n<h4>채점 루브릭과 이 프로젝트가 어긋난 자리 (남은 편마다 반복된다)<\/h4>\n<p><strong>L0 루브릭은 <code>paths.json<\/code> 의 <code>commands<\/code> 에 <code>comprehension_gate<\/code> 키가 없으면 미흡이라고 적는다.<\/strong> 그런데 이 프로젝트는 spec 1.2.0·1.3.0 에서 이해 게이트를 파이프라인에서 명시적으로 뺐고(2026-09-20 유저 결정), 그 키가 없는 것이 정상이다.<\/p>\n<p>지금까지 열 편은 채점자가 「상시 불일치로 보고만 하고 집계에서 제외」로 처리했다. <strong>다른 채점자가 다르게 판단하면 그 편만 FAIL 이 난다<\/strong> — 루브릭이 그렇게 적혀 있으니 판단의 여지가 있다. 남은 편의 채점 입력에 이 사실을 넣어 판단을 고정한다.<\/p>\n<h4>★ 워커에게 <code>Skill<\/code> 도구로 진입 스킬을 부르게 하지 않는다 (배치7 에서 발견)<\/h4>\n<p><strong><code>Skill(design-pattern-guide, …)<\/code> 은 워크트리가 아니라 주 체크아웃의 스킬을 로드한다.<\/strong> 배치7 Mediator 워커가 보고했고 실측으로 확인했다 — <code>/Users/centurio/grow-up-architecture/.claude/skills/design-pattern-guide/SKILL.md<\/code> 는 <strong>73줄 구 판본<\/strong>(mermaid · 「정보 표(활용성 1~5점)」 시절)이고, 워크트리의 것은 <strong>190줄 신 판본<\/strong>이다. 주 체크아웃이 <code>main<\/code>(b62d572)에 서 있고 이 카드의 작업이 하나도 병합되지 않아서다.<\/p>\n<p>그 워커는 로드된 내용을 <strong>버리고<\/strong> 워크트리 파일을 직접 읽어 정본으로 삼았다. 판단이 옳았지만, <strong>알아채지 못한 워커는 구 판본 절차를 따르게 된다<\/strong> — 구 골격 9섹션·mermaid·활용성 점수표는 명세 1.4.0 과 정면으로 충돌한다.<\/p>\n<p><strong>남은 편의 워커 입력에서 <code>Skill<\/code> 도구 호출 문구를 뺀다.<\/strong> 대신 이렇게 준다 — 「<code>&lt;워크트리 절대경로&gt;/.claude/skills/design-pattern-guide/SKILL.md<\/code> 를 <strong>읽고<\/strong> 절차를 그대로 밟으세요. <code>Skill<\/code> 도구로 부르면 주 체크아웃의 구 판본이 로드되니 쓰지 마세요.」<\/p>\n<p><strong>근본 해결은 병합이다<\/strong> — 루트 카드가 완료돼 이 브랜치가 <code>main<\/code> 에 들어가면 사라진다. 그때까지는 위 우회로 간다. 열여섯 편 동안 이 문제가 한 번도 보고되지 않은 것은 앞 워커들이 파일을 직접 읽었거나 로드분을 워크트리 파일로 덮었기 때문으로 보인다 — <strong>묻지 않으면 드러나지 않는 종류라 남은 배치마다 입력에 명시한다.<\/strong><\/p>\n<h4>★ 정정 — 위 5번(성립 요건과 구현 쟁점 분리)은 <strong>명세보다 좁다<\/strong> (2026-09-29 메인 실측)<\/h4>\n<p><code>spec.json<\/code> 의 <strong>PG27 은 <code>gof-guide<\/code>·<code>analysis-guide<\/code> 두 spec 에서 글자 단위로 같고, 절 화이트리스트가 아니다.<\/strong> 원문이 이렇게 적는다.<\/p>\n<blockquote>그 근거가 원전(GoF 원서의 의도·활용성·구조·참여자·협력·결과·<strong>구현·예제 코드<\/strong>, Fowler Analysis Patterns, 저자 공개 보충 자료 eaaDev·apsupp, DDD 원전 Evans·Vernon)에서 그 조건을 <strong>패턴의 성립 요건으로 적은 자리<\/strong>다. … 원전이 <strong>흔한 규칙·구현 선택지<\/strong>로 적은 것이나 이 가이드 예제의 정책을 <code>[필수]<\/code> 로 올려도 미흡이다.<\/blockquote>\n<p><strong>즉 시험은 「어느 절인가」가 아니라 「원전이 어떤 자격으로 적었는가」다.<\/strong> 「Intent·Applicability·Participants·Collaborations·Consequences 다섯 절에서만」은 <strong>Observer 편(배치7)에서 세워진 프로젝트 관례<\/strong>이고 명세보다 좁다.<\/p>\n<p><strong>분석 패턴 10편은 자격으로 판정했고 그쪽이 명세와 맞는다.<\/strong> 그 편들이 쓴 분류는 <strong>의도문 / 사용 조건 / 요점 선언 / 해법문 / 구현 지침 / 허용(&quot;can&quot;) / 선택지 나열 / 흔한 관례<\/strong> 이고, 근거가 <strong>그림<\/strong>이면 <strong>모델의 전후 대조 / 구조 선언 / 속성 타입 선언 / 다중도 선언 / 연관 선언<\/strong> 으로 한 번 더 갈랐다.<\/p>\n<p><strong>33편에 두 기준이 섞여 돌았다.<\/strong> 좁은 쪽이라 명세 위반을 낳지는 않지만 <strong>틀리는 방향이 둘이다.<\/strong><\/p>\n<ul>\n<li><strong>과잉 강등<\/strong> — GoF 편들이 Implementation·Related Patterns 출처를 자동으로 <code>[선택]<\/code> 으로 내렸는데, 원전이 그것을 <strong>성립 요건으로 적은 자리<\/strong>였다면 명세는 <code>[필수]<\/code> 를 허용한다. Command <code>[선택]<\/code> 6·7 과 Visitor 의 「이중 디스패치」가 그 후보다<\/li>\n<li><strong>못 잡음<\/strong> — 좁은 규칙은 <strong>허용 절 안에 있는 흔한 규칙을 걸러 내지 못한다.<\/strong> Party 편의 식별성이 그 모양이었고(원전에 아예 없었다), Posting Rule 편의 멱등도 「저자가 스스로 한정한 절」에 있었다<\/li>\n<\/ul>\n<p><strong><code>.7<\/code> 넷은 명세의 시험을 쓴다.<\/strong> 「다섯 절」은 <strong>먼저 보는 곳<\/strong>으로 내리고, 허용 절 밖에서 왔으면 <strong>자격을 확인해 판정<\/strong>한다. <strong><code>.7<\/code> 이 이것을 필요로 한다<\/strong> — 그 카드 <code>S3<\/code>(DI, 원전이 Fowler bliki)·<code>S4<\/code>(Null Object, 원전이 Woolf PLoP 논문)가 「PG27 열거 확장이 선행한다」고 적는데, <strong>열거는 문서 목록이고 절 화이트리스트가 아니다.<\/strong><\/p>\n<p>기존 22편의 재판정과 규칙 확정은 <code>.6<\/code> <code>S6<\/code>·<code>S7<\/code> 이 맡는다.<\/p>\n<h4>8. <code>--run<\/code> 이 앞 공백을 먹는다 (배치8 Command 워커)<\/h4>\n<p><code>scripts/check-guides.py:991<\/code> 의 <code>_run()<\/code> 이 캡처한 출력에 <strong><code>.strip()<\/code> 을 건다.<\/strong> 그래서 <strong>첫 출력 줄이 공백으로 시작하면<\/strong> <code>expected-output.txt<\/code> 와 글자 단위로 같아도 <code>--run<\/code> 이 실패한다. Command 워커가 <code>%2d<\/code>(우측 정렬)로 찍었다가 3건 실패를 보고 <code>%-2d<\/code> 로 풀었고, 원인 파악에 시간이 들었다.<\/p>\n<p><strong>남은 배치의 워커 입력에 미리 넣는다.<\/strong> 표 모양으로 정렬해 찍는 예제가 있으면 걸린다. 근본 해결은 <code>_run()<\/code> 이 양끝 개행만 다듬게 고치는 것인데, 그러면 이미 발행된 편의 <code>expected-output.txt<\/code> 들이 재검증 대상이 되므로 <code>.6<\/code> 에서 다룬다.<\/p>\n<h4>9. 근거 괄호가 조건의 문면을 실제로 받치는지 본다 (배치8 State 편)<\/h4>\n<p>5번이 <strong>어느 절에서 왔는가<\/strong>를 보는 규약이라면, 이것은 <strong>그 절이 조건의 문면을 어디까지 받치는가<\/strong>를 보는 것이다. 둘은 다르다.<\/p>\n<p>State 편 최소 조건 3번 <code>[필수]<\/code> 가 「상태 참조에 새 값을 넣는 코드가 <strong>요청을 처리하는 흐름 안에서<\/strong> 실행된다」를 요구하면서 근거로 Intent·Applicability 를 댔는데, 그 두 절이 받치는 것은 「실행 중에 바뀐다」까지다. <strong>흐름 제약은 가이드가 보탠 것인데 근거 괄호는 원전을 가리킨다.<\/strong> 그 결과 같은 편의 비교 절(<code>:296<\/code>)이 「그 코드가 없어도 State」라고 적어 <strong>한 편이 같은 코드를 두 번 반대로 판정<\/strong>하게 됐다(GoF Known Uses 의 그리기 편집기).<\/p>\n<p><strong>쓸 때 물을 것<\/strong>: <code>[필수]<\/code> 조건에서 근거 괄호 안 문장을 지우고 남은 것이 조건의 문면을 전부 덮는가. 안 덮는 부분이 있으면 그것은 가이드의 정책이므로 <code>[선택]<\/code> 으로 내리거나 「먼저 보는 곳」으로 적는다.<\/p>\n<p><strong>검사기는 절 이름까지만 본다<\/strong> — <code>BASIS_SOURCES<\/code>(<code>check-guides.py:165<\/code>)는 원전을 가리키는지만 보고 어느 절인지도, 그 절이 받치는 범위도 안 본다. 절 denylist 추가와 기존 4편 대조는 <code>.6<\/code> <code>S6<\/code>.<\/p>\n<h4>10. ★ 규칙끼리의 모순은 문장 안이 아니라 문장들 사이에 있다 (배치8 State 편)<\/h4>\n<p><strong>9번이 한 편에서 터진 뒤 그 편의 채점자가 자기 절차를 뜯어 낸 결론이다.<\/strong> 남은 24편에 그대로 있는 구멍이라 <strong>워커 입력과 채점자 입력 양쪽에 넣는다.<\/strong><\/p>\n<p>State 편 1라운드 채점은 이 모순을 <strong>못 보고 지나친 것이 아니라 보고 나서 모순이 아니라고 판정했다.<\/strong> 「조건 3번은 대입 위치를, 비교 절은 결정 주체를 묻는 서로 다른 문장」으로 갈라 읽어 양립한다고 결론 냈고 그 독해 자체는 틀리지 않았다. <strong>틀린 것은 거기서 멈춘 것이다.<\/strong> 구멍은 셋이었다.<\/p>\n<ol>\n<li><strong>판정 규칙에 실행 검증을 적용하지 않았다.<\/strong> 코드 주장은 일곱 건을 전부 돌려 줄 번호·건수·출력을 글자 단위로 맞췄으면서, <strong>최소 조건은 사실상 판정 함수인데 한 번도 「돌려」 보지 않았다.<\/strong> 코드에는 적용한 기준을 규칙에는 적용하지 않은 비대칭이다.<\/li>\n<li><strong>E1(모순 없음)에서 물은 질문이 틀렸다.<\/strong> 「양립 가능한 독해가 있는가」(존재 검사)를 물었는데, 물었어야 할 것은 <strong>「같은 입력에 다른 답을 내는 입력이 있는가」<\/strong>(반례 탐색)다. 존재 검사는 거의 언제나 예라고 답한다.<\/li>\n<li><strong>PG27 을 얕게 봤다 — 모순의 뿌리가 여기였다.<\/strong> 「괄호가 가리킨 절이 실제로 그 절인가」는 확인했지만 <strong>「괄호가 조건 문면의 전부를 덮는가」는 묻지 않았다.<\/strong> 조각내 대조했다면 그 자리에서 걸렸다. <strong>E1 보다 PG27 에서 잡는 쪽이 더 이르고 더 기계적이다.<\/strong><\/li>\n<\/ol>\n<p><strong>절차 다섯 — 채점 보고의 고정 항목으로 둔다<\/strong><\/p>\n<ol>\n<li><code>[필수]<\/code> 조건마다 근거 괄호를 <strong>조각 단위로<\/strong> 덮는다. 받치는 문장이 없는 조각은 조건에서 빼거나 <code>(근거: 이 가이드의 정책 — 이유)<\/code> 로 바꾸고 <code>[선택]<\/code> 강등을 검토한다.<\/li>\n<li><strong>시험 사례 목록을 글에서 뽑는다<\/strong> — ① 구현 절 정본 ② 각 <code>빠지면:<\/code> 반례 ③ 비교 절이 댄 모든 사례 ④ <strong>본문이 「이것도 이 패턴이다」라고 인정한 모든 형태(원전 Known Uses 포함)<\/strong> ⑤ selfcheck 코드. <strong>④가 State 에서 터진 칸이다.<\/strong><\/li>\n<li>사례마다 두 경로로 판정해 표로 낸다 — 경로 A = <code>boundary.minimum<\/code> 의 <code>[필수]<\/code> 만, 경로 B = <code>boundary.compare<\/code> 의 구분 기준만. <strong>A ≠ B 가 하나라도 있으면 그 자리가 모순이다.<\/strong><\/li>\n<li><strong>반대 방향도 본다<\/strong> — 「필수 조건을 전부 만족하는데 이 패턴이 아닌 코드」를 일부러 짓고 본문이 그 사실을 밝히는지 확인한다. State 에서 보정 둘이 필요해진 것이 이 단계였다.<\/li>\n<li>그 표를 <strong>채점 보고의 고정 항목<\/strong>으로 둔다. 규칙끼리의 정합성은 <strong>문장들 사이<\/strong>에 있어서 인용으로는 채점되지 않는다.<\/li>\n<\/ol>\n<p><strong>특히 위험한 편<\/strong>: <code>boundary.minimum<\/code> 과 <code>boundary.compare<\/code> 를 둘 다 가진 편은 전부 같은 구멍이 있고, <strong>페어로 묶인 편들<\/strong>(Factory Method ↔ Abstract Factory · Adapter ↔ Decorator ↔ Proxy · Builder ↔ Abstract Factory · Mediator ↔ Facade · Strategy ↔ State)이 특히 위험하다 — 구조가 닮아 최소 조건만으로는 안 갈리는데 <strong>그 사실을 본문이 밝히는지가 편마다 다르다.<\/strong><\/p>\n<p><strong>쓸 때 쓸 수 있는 모범 문형<\/strong>(2라운드 채점자가 L0 E6 의 모범으로 꼽은 것): 조건 끝에 「위 근거 괄호가 받쳐 주는 것은 <strong>…까지<\/strong>입니다」를 달아 근거의 범위를 스스로 선언한다.<\/p>\n<h4>11. 원전 항목 수는 절 이름 <strong>첫 등장<\/strong>으로 자르면 틀린다 (배치11 Interpreter 편)<\/h4>\n<p><strong>세 편에서 같은 모양이 반복됐다<\/strong> — Memento(노트가 2항목을 ①~④로) · Visitor(원문 6항목을 「얻는 것 / 대가」 두 덩이로) · Interpreter(원문 <code>&lt;li&gt;<\/code> 3개를 ①~④로).<\/p>\n<p>Interpreter 편이 <strong>왜 어긋나는지<\/strong>까지 밝혔다. <strong>Consequences 안에 Implementation 으로 가는 상호참조 링크가 있어서<\/strong>, 절 이름 첫 등장으로 자르면 Consequences 3 · Implementation 4 로 나온다. <code>&lt;H2&gt;<\/code> 경계로 자른 참값은 <strong>Consequences 4 · Implementation 3 · Collaborations 3 · Applicability 2 · Motivation 3<\/strong> 이다.<\/p>\n<p><strong>세는 규칙<\/strong>: <code>&lt;H2&gt;<\/code> 같은 <strong>절 경계 태그<\/strong>로 자른다. 절 이름 문자열로 찾지 않는다. 그리고 6번 그대로 — <strong>인용 전에 그 절 원문을 연다.<\/strong><\/p>\n<h4>12. 조건 문면을 고치면 그것을 <strong>쓰는 자리를 전부<\/strong> 따라 고친다 (배치11 Interpreter 편 2R)<\/h4>\n<p>Interpreter 편이 1라운드 지적을 받아 조건 1 문면을 고쳤는데 <strong>그것을 쓰는 네 자리가 안 따라왔다.<\/strong> 증상은 조건표에 <strong>「가름 못 함」 칸이 생긴 것<\/strong>이었다.<\/p>\n<p><strong>결정 불가능한 <code>[필수]<\/code> 는 GG3(analyzer 계약) 위반이다<\/strong> — analyzer 는 <code>[필수]<\/code> 미충족을 「패턴 아님」으로 읽으므로, 가를 수 없는 조건은 계약을 깨뜨린다. 3라운드에 조건 1 을 <strong>코드로 확인되는 것만<\/strong> 남기니 E3·GG3 가 한 번에 닫혔다.<\/p>\n<p><strong>고칠 때 함께 열 것<\/strong>: 최소 조건 절의 <code>빠지면:<\/code> 줄 · 판정 표 그 조건의 모든 칸 · 비교 절이 그 조건을 가리키는 문장 · 교차 판정 표 · 「먼저 보는 곳」 하위 항목 · <strong>기억법 줄<\/strong> · <strong>요약 도식<\/strong>.<\/p>\n<p><strong>뒤 둘은 나중에 보탠 것이고, 보탠 이유가 있다.<\/strong> Knowledge Level 편(2026-09-29)의 2R FAIL 이 <strong>1R 에서 고친 수치가 요약 도식에 그대로 남은 것<\/strong>이었고, <strong>Accountability 편은 이 유형 하나로만 2R·3R 을 다 썼다<\/strong> — 마지막 3R MUST 1건이 <strong>기억법 한 줄<\/strong>이 두 라운드의 조임을 안 따라온 것이었다. 그대로 두면 그 글이 두 라운드에 걸쳐 「이 패턴이 아니다」로 세운 반례 둘을 <strong>기억법이 「패턴이다」로 인증<\/strong>한다. <strong>기억법과 요약 도식은 조건을 압축해 되풀이하는 자리라 조건이 바뀌면 반드시 어긋나는데, 본문에서 멀리 떨어져 있어 눈에 안 띈다.<\/strong> 조건 하나를 고쳤으면 그 조건 번호를 <strong>파일 전체에서 grep<\/strong> 하고, 번호 없이 말로 되풀이하는 자리(기억법·도식·개요)도 함께 연다. State 편이 흐름 제약을 뺄 때 여덟 자리를 전수로 훑은 것이 그 모양이다.<\/p>\n<h4>13. 채점자에게 <strong>앞 라운드 사본 보존<\/strong>을 요구한다 (배치11 Visitor 편)<\/h4>\n<p>Visitor 편은 <strong>수정률을 확인하지 못했다<\/strong> — 채점자가 앞 라운드 사본을 남기지 않아 <code>--diff<\/code> 를 못 돌렸다. 대체값(산문 자수 증감)만 남았다.<\/p>\n<p>수정률은 「고치다가 글을 다시 쓴 것은 아닌가」를 보는 지표라 라운드마다 필요하다. <strong>채점자 입력에 「각 라운드 시작 시점 사본을 자기 scratchpad 에 남기고, 최종 보고에 <code>--diff<\/code> 결과를 싣는다」를 넣는다.<\/strong><\/p>\n<h4>14. ★ <code>[필수]<\/code> 근거는 「어느 절인가」가 아니라 <strong>「원전이 어떤 자격으로 적었는가」<\/strong>로 판정한다 (2026-09-29 유저 결정)<\/h4>\n<p><strong>이 항목이 5번과 그 정정 블록을 대신하는 정본이다.<\/strong> 명세 PG27 의 시험을 그대로 편 것이고, <strong>분석 패턴 10편이 실제로 쓴 분류<\/strong>다. 유저가 「카드 규약으로 둔다」를 골랐다 — 명세(<code>spec.json<\/code>)를 고치면 <code>resolve_hash<\/code> 가 바뀌어 <strong>발행본 33편의 게이트 기록이 전부 「낡은 PASS」로 떨어지므로<\/strong>(<code>check-guides.py:1420<\/code> 실측) 명세 변경은 37편이 다 선 뒤로 미뤘다.<\/p>\n<p><strong>글로 적힌 근거의 자격 — 일곱<\/strong><\/p>\n<p>| 자격 | <code>[필수]<\/code> 가능 | 표식 | | --- | --- | --- | | <strong>의도문<\/strong>(Intent) | ○ | 「이 패턴은 …하는 것이다」 | | <strong>사용 조건<\/strong>(Applicability / When to use it) | ○ | 「…할 때 쓴다」 | | <strong>요점 선언<\/strong> | ○ | 「요점은 …이다」 · 「You have X when …」 | | <strong>해법문<\/strong>(Evans 류) | ○ | 「…하라」가 패턴의 정의인 자리 | | <strong>구현 지침<\/strong>(Implementation / Making it work) | <strong>자격을 본다<\/strong> | 성립 요건으로 적었으면 ○, <strong>구현 선택지로 적었으면 ✗<\/strong> | | <strong>허용<\/strong>(&quot;can&quot; · &quot;allows me&quot; · &quot;may&quot;) | ✗ | 「…할 수도 있다」 → <code>[선택]<\/code> | | <strong>선택지 나열<\/strong> · <strong>흔한 관례<\/strong>(&quot;common convention&quot; · &quot;the most common way … but a simpler alternative&quot;) | ✗ | → <code>[선택]<\/code> |<\/p>\n<p><strong>근거가 그림이면 한 번 더 가른다 — 다섯<\/strong><\/p>\n<p><strong>모델의 전후 대조<\/strong>(앞 절이 속성으로 둔 것을 뒤 절이 연관으로 바꾸고 속성을 지운다) · <strong>구조 선언<\/strong> · <strong>속성 타입 선언<\/strong> · <strong>다중도 선언<\/strong> · <strong>연관 선언<\/strong>. Measurement 편이 이 분류를 세웠고 Observation 편이 그대로 썼다.<\/p>\n<p><strong>실측된 실패 넷 — 좁은 규칙이 못 잡은 것과 과하게 잡은 것<\/strong><\/p>\n<ul>\n<li><strong>허용 절 안의 흔한 규칙<\/strong>(좁은 규칙이 <strong>못 잡는다<\/strong>) — Party 편의 식별성은 <strong>원전에 아예 없었다<\/strong>(<code>accountability.pdf<\/code>·<code>apchap2.pdf<\/code> 두 파일에 identity·identifier·unique <strong>각각 0건<\/strong>). Posting Rule 편의 멱등은 <strong>저자가 「이 예제에서는」이라 스스로 한정한 절<\/strong>에 있었고 단언이 붙은 클래스가 규칙이 아니라 <strong>사건<\/strong>이었다<\/li>\n<li><strong>구현 절 안의 성립 요건<\/strong>(좁은 규칙이 <strong>과하게 잡는다<\/strong>) — Command <code>[선택]<\/code> 6·7 과 Visitor 의 「이중 디스패치」가 후보다. <code>.6<\/code> <code>S6<\/code> 이 재판정한다<\/li>\n<li><strong>두 조건이 붙어 있는 후보<\/strong> — Party·Range 에서 각각 났다. 근거가 <strong>서로 다른 그림<\/strong>이면 갈라야 한다는 신호다<\/li>\n<li><strong>노트가 항목을 어느 절에 두었는지가 표기를 가르는 신호다<\/strong> — Party 편의 식별성이 「DDD 매핑 후보」 절에 있었던 것이 옳았다<\/li>\n<\/ul>\n<p><strong>교차 검사 하나를 반드시 한다 — 조건을 세울 때 발행본을 판정해 본다.<\/strong> Knowledge Level 편이 노트의 <code>[필수]<\/code> 후보를 <code>[선택]<\/code> 으로 내린 <strong>결정적 근거<\/strong>가 「<code>[필수]<\/code> 로 올리면 <strong>발행된 Posting Rule 편이 이 패턴에서 탈락한다<\/strong>」였다. Observation 편은 대상이 다섯이었다.<\/p>\n<p><strong>원전 열거는 문서 목록이지 절 화이트리스트가 아니다.<\/strong> <code>check-guides.py:166<\/code> 의 <code>BASIS_SOURCES<\/code> 가 그 목록이고, 2026-09-29 에 <code>.7<\/code> 의 Null Object 를 위해 <strong><code>Woolf<\/code>·<code>PLoP<\/code> 를 더했다<\/strong>(Fowler bliki 는 <code>Fowler<\/code>·<code>martinfowler<\/code> 가 이미 받는다). <strong>그 파일은 resolve 번들 밖이라 고쳐도 해시가 안 바뀐다<\/strong> — 확인했다.<\/p>\n<p><strong>★ PG27 의 GoF 절 열거는 닫힌 목록이 아니다<\/strong> (2026-09-29 <code>.6<\/code> <code>S6<\/code> 재판정에서 확정). 명세 괄호 안이 「GoF 원서의 의도·활용성·구조·참여자·협력·결과·구현·예제 코드, Fowler Analysis Patterns, 저자 공개 보충 자료 eaaDev·apsupp, DDD 원전 Evans·Vernon」인데, 같은 괄호에 <strong>문서<\/strong>(Analysis Patterns · eaaDev · Evans)와 <strong>절 이름<\/strong>이 섞여 있다 — <strong>열거의 축은 「어떤 자료를 원전으로 인정하는가」이고 GoF 항목만 절까지 예시로 편 것<\/strong>이다. 근거 셋이 이 읽기를 받친다.<\/p>\n<ul>\n<li><strong>검사기가 절을 아예 안 본다.<\/strong> <code>check-guides.py<\/code> 의 <code>BASIS_SOURCES<\/code> 는 <strong>출처 토큰 목록<\/strong>이고, 절 이름이 나오는 자리는 PG30(자립성)의 위치 지시자 차단용이라 <code>[필수]<\/code> 근거를 거르지 않는다(워커가 소스로 확인)<\/li>\n<li><strong>열거 안의 「예제 코드」는 절이 아니다<\/strong> — 자료의 종류다. 닫힌 절 목록이라면 섞일 수 없다<\/li>\n<li><strong>시험이 「성립 요건으로 적은 자리」이지 「그 절에 있는가」가 아니다.<\/strong> 같은 문장이 그 뒤에 이어진다<\/li>\n<\/ul>\n<p><strong>실제로 걸린 자리<\/strong>: Facade 조건 4(업무 규칙을 새로 정의하지 않음)는 원전에서 그 문장이 <strong>Related Patterns 에만<\/strong> 있다 — 「a facade <strong>merely<\/strong> abstracts … <strong>it doesn&#x27;t define new functionality<\/strong>」. 여섯 절을 전수로 훑어도 허용 절에 같은 주장이 없고, 오히려 Collaborations 는 반대 방향의 허용을 단다(「facade <strong>may have to do work of its own<\/strong> to translate its interface」). <strong>자격은 요점 선언이라 통과하고, 절은 Related Patterns 뿐이다.<\/strong> 닫힌 목록으로 읽으면 이 조건이 갈 곳이 없어진다.<\/p>\n<p><strong>명세 문면에는 이 말이 없다<\/strong> — 유저가 2026-09-29 에 「명세는 37편이 다 선 뒤에 고친다」로 정했으므로 그때 못 박는다. 그때까지는 이 항목이 정본이다.<\/p>\n<h4>15. ★ 조건이 참이 되는 방식이 둘이다 — 잴 대상이 있어서인가, 없어서인가 (2026-09-30 실측)<\/h4>\n<p>「~하는 코드가 없습니다」 꼴 조건은 <strong>그 코드가 놓일 자리 자체가 없으면<\/strong> 위반 사례가 없다는 이유로 참이 된다. 사람은 「판정 보류」로 읽지만 <code>[필수]<\/code> 충족만 세는 기계는 <strong>충족<\/strong>으로 읽는다.<\/p>\n<p>조건을 쓴 뒤 반드시 물어라 — <strong>이 조건을 어길 수 있는 코드를 이 패턴의 참여자에 넣을 수 있는가.<\/strong> 못 넣으면 그 조건은 남의 패턴을 하나도 막지 못한다.<\/p>\n<p><strong>실측 둘<\/strong>: 정통 Abstract Factory 의 구체 팩토리에는 제품을 쓰는 상위 로직이 아예 없어 Factory Method 조건 3·5번이 잴 것 없이 통과했다. 정통 팩토리는 부분 연산이 0개라 Builder 조건 2번(「부분 연산은 제품을 돌려주지 않는다」)이 같은 방식으로 통과했다. 둘 다 컴파일·실행되는 TypeScript 로 확인했다.<\/p>\n<p>Factory Method 편 비교 절은 이 자리를 이미 짚어 뒀다 — 「3번은 이 자리에서 잴 것이 없습니다」. <strong>짚어 두는 것으로는 안 막힌다<\/strong>는 것이 이번 실측이다.<\/p>\n<h4>16. ★ 참여자를 가리키는 말에는 「코드에서 그것이 누구인가」를 함께 적는다 (2026-09-30 실측)<\/h4>\n<p>조건은 「Adaptee」·「동료」·「서브시스템」처럼 <strong>참여자 이름<\/strong>으로 쓰인다. 그것이 코드의 어느 클래스인지 정하는 방법을 안 적으면, 가운데 클래스가 이웃을 여럿 들 때 <strong>조건마다 편한 이웃을 골라 대어<\/strong> 서로 배타적인 조건 둘을 동시에 만족시킨다.<\/p>\n<p><strong>실측 둘<\/strong>: <code>inner: Component<\/code>(Decorator 2번용)와 <code>legacy: Adaptee<\/code>(Adapter 3번용)를 함께 든 래퍼 하나가 Adapter <code>[필수]<\/code> 넷과 Decorator <code>[필수]<\/code> 다섯을 모두 통과했다. 가운데 객체의 이웃을 「가운데를 아는 쪽」과 「모르는 쪽」 두 집합으로 쪼갠 코드가 Mediator <code>[필수]<\/code> 넷과 Facade <code>[필수]<\/code> 넷을 모두 통과했다 — Facade 3번(「서브시스템이 Facade 를 모른다」)과 Mediator 2번(「동료가 중재자를 안다」)은 <strong>정면으로 반대인데도<\/strong> 각각 한쪽 집합만 보고 참이 됐다.<\/p>\n<p>그러니 조건에 <strong>집합 한정사를 박아라<\/strong> — 「든 이웃 <strong>전부<\/strong>가」 / 「<strong>하나라도<\/strong> 들면 빠진다」. 한정사 없는 조건은 쪼개기 한 번으로 뚫린다.<\/p>\n<h4>17. ★ 타입 이름을 찾는 조건은 그 타입이 구현한 인터페이스로 뚫린다 (2026-09-30 실측)<\/h4>\n<p>「서브시스템의 필드·인자 어디에도 Facade 타입이 없다」처럼 <strong>타입 이름<\/strong>을 찾는 조건은, 가운데 클래스가 인터페이스를 하나 구현하고 이웃이 <strong>그 인터페이스를<\/strong> 들면 구체 클래스 이름이 코드 어디에도 안 나와 통과한다.<\/p>\n<p><strong>이 우회로는 우리가 직접 열어 둔 것이다<\/strong> — Mediator <code>[선택]<\/code> 5번이 추상 중재자를, Facade <code>[선택]<\/code> 7번이 추상 Facade 를 허용한다. 정당한 설계가 곧 우회로다.<\/p>\n<p>조건을 쓸 때 <strong>「그 클래스 또는 그것이 구현·상속한 타입」<\/strong> 으로 적어라. 이름 하나만 적으면 그 이름을 안 쓰는 길이 항상 있다. 14번의 자격 판정, 이 항목, 그리고 앞선 Visitor 의 연산 이름 사례가 같은 뿌리다 — <strong>이름은 바꿀 수 있고 구조는 못 바꾼다.<\/strong><\/p>\n<h4>이 셋을 어디가 강제하는가<\/h4>\n<p>세 항목 모두 <code>design-pattern-analyzer<\/code> 스킬의 계약에 박았다(2026-09-30). 3단계에 참여자 고정·공허한 참·선언 대 대상·이름 대 타입 계층 규칙을, 5단계에 「경쟁 후보 대조」 절차와 <strong>동시 통과가 확인된 여덟 쌍의 표<\/strong>를 뒀다. 집필 쪽에서는 이 항목들이 <code>.7<\/code> 의 4편(Specification · Temporal Property · Dependency Injection · Null Object)에 적용된다 — 그 넷은 기존 33편과 구조가 겹치는 자리가 많아 조건을 세울 때 <strong>발행본을 판정해 보는 절차<\/strong>(위 항목)와 함께 쓴다.<\/p>", "htmlPlan": "<ul>\n<li>[x] <code>S1<\/code> Factory Method 재집필 — 완료 기준: <code>resolve --frozen<\/code> 통과 → authoring-write PASS(라운드 ≤ 3 · 사실 주장은 채점이 실행·원문 대조로 검증) → <code>check-guides --all --compile<\/code> 0 → <code>gate-results.jsonl<\/code> 1줄<\/li>\n<li>[x] <code>S2<\/code> Abstract Factory 재집필 — 완료 기준: <code>resolve --frozen<\/ 것은 맞다. 다만 <strong>Interpreter 편이 그 사실을 자기 본문에 밝혀 두어<\/strong> 독자가 빈 곳에 착지하지 않고, Composite 편에 새 비교 대상을 세우면 그 편의 판정 자리가 하나 늘어 재채점이 붙는다<\/li>\n<\/ul>\n<p><strong>안 함으로 닫은 것 — C 셋<\/strong> (<strong>판정 기준이 바뀌어 판올림 + 재채점<\/strong>이 붙는다. 연쇄 합 16 파일)<\/p>\n<ul>\n<li><strong>Adapter·Decorator·Proxy 에 「갈림 0」 신설<\/strong> — 연쇄 <strong>11<\/strong>(셋 중 최대). 「갈림 0」을 앞에 세우면 <strong>세 편의 비교 체계 번호가 전부 한 칸씩 밀리고<\/strong>, Proxy 편이 본문에서 「구분 기준은 <strong>갈림 2<\/strong> 입니다」처럼 번호를 부르므로 그 문장들이 다 따라 움직인다. <strong>세 편을 한 커밋에 올리고 셋을 재채점해야 한다.<\/strong> 그리고 이것은 채점 지적이 아니라 <strong>Composite 워커의 제안<\/strong>이다<\/li>\n<li><strong>Template Method 조건 4 의 회색 지우기<\/strong> — 연쇄 3. 「단계 호출의 인자를 만드는 것은 세지 않는다」를 넣으면 <strong>경로 A 의 판정이 바뀌고<\/strong>(편의 오버로드가 TM 에서 빠진다) 최소 조건 문면이 바뀌므로 <strong>analyzer 계약(PG1)도 따라간다<\/strong><\/li>\n<li><strong>Accountability <code>[선택]<\/code> 9(한 계통 안에서 상위가 하나) 신설<\/strong> — 연쇄 2(셋 중 최소). <code>[선택]<\/code> 이라 「패턴이다/아니다」는 안 뒤집히지만 <strong>최소 조건 절에 항목이 늘어 analyzer 가 읽는 계약 문자열이 바뀐다.<\/strong> 원전이 이것을 <code>Hierarchic Accountability Type<\/code>(그림 2.11)이라는 <strong>별도 선택 제약<\/strong>으로 세우므로 <strong>없는 것이 틀린 것은 아니다<\/strong><\/li>\n<\/ul>\n<p><strong>★ C 셋은 「다음 판본」 자리다.<\/strong> 셋 다 발행을 막지 않고, 셋 다 <strong>재채점을 부른다.<\/strong> 그리고 명세 변경(37편이 다 선 뒤)과 함께 하면 <strong>재검증이 한 번으로 묶인다<\/strong> — 지금 하면 그때 또 한다.<\/p>\n<p><strong>판단·메모로 닫은 것 — D 여섯<\/strong><\/p>\n<ul>\n<li><strong>Factory Method 조건 1·5 가 같은 <code>Consequences<\/code> 를 가리킴<\/strong> — 보는 자리가 달라 PG27 위반이 아니다. 고칠 것 없음<\/li>\n<li><strong>Command <code>:369<\/code> ②의 이유 부분 이동<\/strong> — 집필자가 의도적으로 미적용했고 채점자도 「그대로 둬도 미흡이 아니다」라고 했다<\/li>\n<li><strong>Visitor ↔ Interpreter 거울상<\/strong> — 고칠 것이 아니라 <strong>다음에 둘 중 하나를 여는 사람이 읽을 메모<\/strong>다. <code>interpreter :336·349·357<\/code> ↔ <code>visitor :249·299·312<\/code><\/li>\n<li><strong>개요에 「곤란한 모양 N개」로 수를 못 박지 않는다<\/strong> — 가리키는 자리가 명세인데 유저 결정으로 <strong>명세는 37편 뒤로 미뤘다.<\/strong> 지금은 <code>.4<\/code> 카드 「반복해서 걸리는 자리」가 그 자리다<\/li>\n<li><strong><code>check-guides.py<\/code> 에 「근거 절 ↔ 참고 자료」 대조 검사<\/strong> — <strong><code>S7<\/code> 이 <code>check_basis_refs<\/code> 로 이미 넣었다<\/strong>(33편 실측 후 넣어 헛걸림 0, 주입 테스트로 검출 확인)<\/li>\n<li><strong><code>referenceRange<\/code>·그림 4.21 을 어느 편이 맡을지<\/strong> — <strong>판단: <code>referenceRange<\/code> 는 Measurement 편<\/strong>이 맡는다(그 편이 이미 FHIR Observation 요소를 훑는 자리를 갖고, Range 편은 값 쪽 관심이라 FHIR 사례 목록을 새로 열어야 한다). <strong>그림 4.21 은 어느 편도 안 받는다<\/strong> — 그 그림은 항목 연결이 <strong>하위 종류로 내려가 있어<\/strong> Observation 편 <code>[필수]<\/code>(「항목 연결이 상위 층에 붙는다」)와 <strong>반대 배치<\/strong>라 한 행으로 안 끝난다. <strong>원전 안에서 그림마다 다르다는 사실<\/strong>을 리서치 노트에 적어 두는 것으로 닫는다<\/li>\n<\/ul>\n<p><strong>옛 목록(참고용 — 위 처분의 근거가 항목마다 적혀 있다)<\/strong> 채점이 「미흡은 아니지만 다음 판본에서」로 단 제안과, 집필 중에 나왔지만 그 편의 버전을 올릴 만큼은 아니었던 것을 여기서 한 번에 닫는다. <strong>편마다 patch 를 쌓지 않는 이유<\/strong>는 한 구절 때문에 버전을 올리면 인덱스 포인터·게이트 기록·HTML 지문이 전부 따라가야 해서 이득보다 churn 이 크기 때문이다. 완료 기준: 아래 목록이 전부 반영되거나 「안 함」으로 사유와 함께 닫히고, 반영분은 해당 편의 새 버전으로 발행돼 <code>--pointers --gates --derived<\/code> 가 통과한다.<\/p>\n<ul>\n<li><strong>Factory Method v1.0.0<\/strong>(배치1 채점 비차단 메모 2건) — ① 최소 조건 1번과 5번이 같은 <code>Consequences<\/code> 를 가리킨다(보는 자리가 달라 PG27 위반은 아님) ② <code>Calendar<\/code>·<code>NumberFormat<\/code> 오인 사례 자리에 Javadoc 링크를 달면 근거가 단단해진다<\/li>\n<li><strong>Bridge v1.0.0<\/strong>(배치5 채점 비차단 제안 1건) — 시나리오 2 의 3단계가 12개 단계 중 「왜」가 가장 얇다. PG5 판정 자체는 충족이다<\/li>\n<li><strong>Adapter·Decorator·Proxy v1.0.0<\/strong>(배치6 Composite 워커 제안) — 그 셋의 「갈림 1·2·3」 앞에 <strong>갈림 0<\/strong>(그 참조가 하나인가 여럿을 담는 자리인가, 선언된 타입으로)을 넣을지. Composite 편이 셋을 실제로 적용해 <strong>Composite 가 갈림 1·2·3 어디서도 안 갈린다<\/strong>는 것을 확인하고 자기 편에 갈림 0 을 세웠다. 셋은 「감싼 대상 하나」를 전제로 도는 체계라 갈림 0 이 그 전제를 앞에서 세워 주는 모양이 된다. <strong>세 편을 동시에 고쳐야 하므로 여기서 한 번에 한다<\/strong><\/li>\n<li><strong><code>PATTERNS.md<\/code> 비교 페어 설명 재검토<\/strong>(배치5 Facade 워커 관찰) — 표의 한 줄 요약이 <strong>방향<\/strong>을 말하지 않아 60행 페어 「Mediator ↔ Facade: 동료 간 중재 vs 서브시스템 단순 진입점」이 지고 있는 구분을 표 혼자서는 못 나른다. 표의 요약은 「그 패턴이 무엇인가」를 말하고 구분은 페어 목록이 지는 역할 분담이라 그대로 뒀으나, <strong>Mediator 편이 발행된 뒤 두 줄을 나란히 놓고 다시 본다<\/strong><\/li>\n<li><strong>Strategy v1.1.0 <code>:341<\/code> 동기화<\/strong>(배치8 State 워커 관찰) — State 편의 대조 도식이 「<strong>대개<\/strong> 요청 처리 흐름 안 / 밖에서 온 선택일 수도 있음」 두 줄이 됐는데 Strategy 편 <code>:341<\/code> 은 「요청 처리 흐름 안」 한 줄이다. State 쪽이 더 정확해진 것이라 Strategy 편 미흡은 아니고, 「대개」를 붙이면 페어가 완전히 맞는다<\/li>\n<li><strong>Command v1.0.0 <code>참고 자료<\/code><\/strong>(배치8 Command 채점자 관찰) — 원전 Implementation 쟁점을 셋만 적었다(똑똑함·되돌리기와 다시 하기·오차 누적). 원전은 넷이고 빠진 것은 C++ 템플릿인데, 본문이 그 쟁점을 인용하지 않으므로 PG25 위반은 아니다<\/li>\n<li><strong>Command v1.0.0 <code>:369<\/code> ②<\/strong>(배치8 Command 채점자 제안, 집필자가 의도적으로 미적용) — ② 의 이유 부분을 <code>:368<\/code> 끝으로 옮기면 제약과 반례가 한자리에 모인다. 채점자도 「지금 그대로 둬도 미흡이 아니다」라고 했고 PASS 난 바이트를 취향 문제로 건드리지 않았다<\/li>\n<li><strong>Strategy v1.1.0 <code>:367<\/code> 정정<\/strong>(배치9 Template Method 워커) — 「Template Method 는 상위 클래스의 <code>final<\/code> 메서드가 순서를 정합니다」로 적혀 있는데, Template Method 편은 재정의 금지를 <strong><code>[선택]<\/code> 5번<\/strong>으로 내렸다. 원전에서 그 말은 <strong>Implementation(C++ 접근 제어)<\/strong> 자리에만 있고 Intent·Participants·Collaborations 어디에도 없으며, <code>InputStream.read(b,off,len)<\/code> 은 문서가 재정의를 <strong>권장<\/strong>한다. 실측으로도 TypeScript 에 <code>final<\/code> 수정자가 없고 Rust trait 에 제공 메서드 고정 수단이 없어 <strong>필수로 올리면 두 언어의 모든 Template Method 가 탈락한다.<\/strong> 다만 <code>:367<\/code> 은 <strong>자기 편 예제 코드를 묘사한 문장<\/strong>이라 사실로는 참이다 — <strong>「(이 예제에서는)」 한마디만 넣으면<\/strong> 축이 완전히 맞는다<\/li>\n<li><strong>Template Method v1.0.0 조건 4 의 회색 지우기<\/strong>(배치9 집필자·채점자 공동, 게이트 미차단) — 편의 오버로드(<code>final int read(byte[] b) { return read(b, 0, b.length); }<\/code>)가 조건 4 의 「내려보내지 않은 계산」에 걸리는지 둘 다 단정하지 못했다. <code>b.length<\/code> 를 계산으로 읽으면 경로 A 가 TM 을 내는데 원전 기준으로는 골격이 아니다. <strong>조건 4 의 「계산」에 「단계 호출의 인자를 만드는 것은 세지 않는다」 한 구절을 넣으면 지워진다<\/strong><\/li>\n<li><strong>Iterator ↔ Memento 상호 링크<\/strong>(배치10, 두 워커가 각각 보고) — 두 편이 서로를 본문에서 가리키는데 <strong>파일 링크는 어느 쪽도 걸지 않았다.<\/strong> 병렬로 쓰여서 상대 판본이 움직이는 중이었고, 링크를 걸면 <code>--pointers<\/code> 가 낡은 링크로 잡을 위험이 있었다. 둘 다 발행됐으니 <strong>여기서 한 번에 맞춘다<\/strong> — Iterator 편 개요의 Memento 언급과 Memento 편 개요·비교 절·참고 자료의 Iterator 언급. 이것이 <code>S4<\/code>(참고 문서 <code>serves<\/code>)와 같은 이유로 여기 모이는 항목이다<\/li>\n<li><strong>리서치 노트의 원전 인용에 절 이름을 붙인다<\/strong>(배치10 Iterator 워커) — 「순회자를 만드는 연산은 팩토리 메서드의 예」가 <strong>Motivation 절<\/strong>인데 노트도 Factory Method 편 <code>:1041<\/code> 도 절 이름 없이 적었다. Motivation 은 <code>[필수]<\/code> 근거 허용 다섯 절 밖이라 <strong>절 이름을 모르고 인용하면 <code>[필수]<\/code> 로 잘못 올린다.<\/strong> Factory Method 편은 그것을 <code>[필수]<\/code> 근거로 쓰지 않아 위반은 아니다(확인함). <code>S6<\/code>·<code>S7<\/code> 과 같은 뿌리이므로 그쪽과 묶어 처리한다<\/li>\n<li><strong>Visitor v1.0.0 — 가장 약한 고리 보강<\/strong>(배치11 채점자 관찰, 미흡 아님) — 조건 1번의 「한 방문 연산 안에서 다시 구체 타입을 가르는 코드가 없습니다」는 <strong>원전 명시가 아니라 Participants 에서의 유도<\/strong>다. <code>빠지면:<\/code> 줄이 반례로 받쳐 PG27 위반은 아니지만 근거 조각 대조에서 <strong>이 편의 가장 약한 고리<\/strong>로 꼽혔다. 다음 판본에서 근거를 더 대거나 「받쳐 주는 것은 …까지」 선언을 붙인다<\/li>\n<li><strong>Visitor v1.0.0 — 비교 절에 Fold 추가 검토<\/strong>(배치11 채점자 제안) — 순회하며 새 자료구조를 짓는 변형이 비교 대상에 없어 그 쌍을 가릴 자리가 없다. 리서치 노트가 rust-unofficial 을 근거로 이 쌍을 든다. 같은 맥락에서 <strong><code>FileVisitor<\/code> 문단에 ESLint <code>create()<\/code> 반환 객체와 serde <code>de::Visitor<\/code> 를 한 줄씩 얹으면 「이름만 <code>Visitor<\/code>」를 가리는 힘이 세진다<\/strong>(둘 다 이 편이 교차 판정 표에서 「아님」으로 판정했으나 본문에는 안 실었다)<\/li>\n<li><strong>Composite v1.0.0 — Interpreter 를 받는 자리 신설<\/strong>(배치11 Interpreter 워커) — AST 가 Composite 사례라는 것은 <strong>원전 Interpreter 절 Related Patterns<\/strong> 근거가 있어 Interpreter 편이 실었는데, <strong><code>composite-guide_v1.0.0.md<\/code> 는 Interpreter 를 0회 언급한다<\/strong>(집필자·메인이 각각 셈). 지금은 <strong>편면 문장<\/strong>이다. Composite 편의 비교 절이나 「함께 쓰는 패턴」에 한 자리를 내면 맞물린다. 구분 기준은 Interpreter 편이 이미 세웠다 — <strong>「문법이 글로 적혀 있는가」<\/strong>(그 편 <code>[선택]<\/code> 5번)<\/li>\n<li><strong>★ Visitor ↔ Interpreter 는 거울상으로 맞물려 있다 — 한쪽을 고칠 때 다른 쪽을 같이 연다<\/strong>(배치11, 유지보수 메모) — <code>interpreter-guide_v1.0.0.md<\/code> 336·349·357행 ↔ <code>visitor-guide_v1.0.0.md<\/code> 249·299·312행. Visitor 편이 구분 기준을 단정하지 않고 Interpreter 편 소관으로 남겼고(「판정은 두 번 일어난다」), Interpreter 편이 표 행에 「앞은 <code>[선택]<\/code> 5번이, 뒤는 <code>[선택]<\/code> 6번이 본다」로 받았다. <strong>Interpreter 편은 Visitor 편의 내부 번호를 인용하지 않아<\/strong> 한쪽이 번호를 바꿔도 안 깨지지만, <strong>문면을 고치면 다른 쪽이 가리키는 뜻이 어긋난다.<\/strong> 이 항목은 고칠 것이 아니라 <strong>다음에 둘 중 하나를 여는 사람이 읽을 메모<\/strong>다<\/li>\n<li><strong>★ 개요에 「곤란한 모양 N개」로 수를 못 박지 않는다<\/strong>(배치2 Party 편, 채점자·집필자 공동 판단) — 사람·부서와 함께 <strong>장비·창고까지<\/strong> 한 이름에 담은 자산 관리 모델이 Party 의 <code>[필수]<\/code> 셋을 <strong>전부 통과한다.<\/strong> 가르는 도구는 개념 정리의 「Party 는 이 모델에서 &#x27;행위 주체&#x27;라고 부를 수 있는 것 <strong>전부<\/strong>」 한 줄뿐이고 <strong>그 제약이 <code>[필수]<\/code> 문면에 없다<\/strong>(= analyzer 계약 밖, <code>S8<\/code> 과 같은 뿌리). <strong>MUST 로 올리지 않은 것이 옳다<\/strong> — 「필수를 통과하고도 곤란한 모양」은 <strong>필요조건 모음의 성질상 열린 집합<\/strong>이라, 그 수가 세 라운드 연속 어긋났다(하나 → 둘 → 둘). 고치는 길은 조건을 더 붙이는 쪽이 아니라 <strong>개요에서 수를 안 적는 쪽<\/strong>이다. 명세(<code>analysis-guide<\/code>·<code>gof-guide<\/code> 공통)나 voice 에 권고로 올릴 자리다<\/li>\n<li><strong><code>ddd-tactical-terms<\/code> 참고 문서의 <code>serves<\/code> 에 <code>party<\/code> 추가<\/strong>(배치2 Party 워커) — <code>S4<\/code> 의 미반영분에 함께 넣는다. 배치2 시점 <code>serves: [account, quantity]<\/code> 이고 Party 편이 그 문서를 링크한다<\/li>\n<li><strong>Accountability v1.0.0 — 「한 계통 안에서 상위가 하나」 전제를 조건으로 세우기<\/strong>(배치3 채점자 SHOULD 1, 3R 에서 닫지 않음) — 시나리오 1 의 5단계 · 개요 도식 · 조건 4 · 구현 <code>parentName<\/code> <strong>넷이 그 전제를 깔고 있는데 조건 어디에도 없다.<\/strong> <strong>원전은 그것을 <code>Hierarchic Accountability Type<\/code>(그림 2.11)이라는 별도 선택 제약으로 따로 세운다<\/strong> — 곧 <strong>기본형에서는 보장되지 않는 성질<\/strong>이라 없는 것이 틀린 것은 아니다. 권고안은 <strong><code>[선택]<\/code> 조건 9 로 올리는 것<\/strong>이고, 그러면 반대 방향 구성 ⑤(공동 책임 관계 — 조건은 옳게 「패턴이다」라 답하는데 글의 나머지가 그 모델을 못 받는 자리)도 함께 닫힌다<\/li>\n<li><strong>Measurement v1.0.0 — «dynamic» 완충 수준을 참고 문서에 맞추기<\/strong>(배치4 집필자 판단) — 참고 문서 <code>observation-model-ref_v1.0.1.md:136<\/code> 은 「<strong>이 문서는<\/strong> 그 표기를 … 뜻<strong>으로 읽었습니다<\/strong>」로 자기 해석임을 밝히는데 그 편 <code>[선택]<\/code> 7 은 「…<strong>으로 그립니다<\/strong>」로 그림의 선언처럼 적었다. UML 관례상 무리한 읽기는 아니지만 <strong>같은 계열 두 문서가 완충을 다르게 잡았다.<\/strong> 집필자가 「제 쪽을 참고 문서 수준으로 낮추는 편이 맞다」고 판단했고, <strong>게이트 PASS 뒤 본문을 더 고치면 발행본이 채점된 산출물과 달라지므로<\/strong> 그때 손대지 않았다<\/li>\n<li><strong>Measurement v1.0.0 — 조건 근거 괄호에 연산 목록 한 구절<\/strong>(배치4 채점자, 미흡 아닌 「덜 적힌 경우」) — 조건의 자기 선언이 「받쳐 주는 것은 값 자리가 수치와 단위를 함께 든 Quantity 다까지」인데, 조건 문면의 절반인 「<strong>더하거나 비교하는 것이 뜻이 있는 크기<\/strong>」 조각은 <strong>그림 3.2 가 Quantity 칸에 <code>+ - * / = &gt; &lt;<\/code> 를 적어 둔 것<\/strong>이 받친다. <strong>근거가 없는 것이 아니라 근거 괄호가 연산 목록을 빠뜨려 덜 적힌 것<\/strong>이라 강등 대상이 아니다<\/li>\n<li><strong>Range v1.0.0 — 비교 절에 두 행 추가<\/strong>(배치4, 교차 판정의 남은 자리 둘) — ① <strong>자정을 넘는 주기 구간<\/strong>(야간 근무 <code>22:00~06:00<\/code> — <code>includes(23:00)=true<\/code>, <code>includes(12:00)=false<\/code>)이 조건 넷을 통과하는데 본문에 밝혀져 있지 않다(집필자가 186행을 「그것입니다」 → 「<strong>그 가운데 하나예요<\/strong>」로 낮춰 더 있다는 것은 인정했다) ② <strong>끝점 타입에 순서가 없는 값<\/strong>(우편번호)은 경로 B 에 해당 행이 없어 침묵한다. 둘 다 게이트를 막지 않는다<\/li>\n<li><strong>참고 문서 <code>observation-model-ref_v1.0.1.md:156<\/code> 에 한 구절<\/strong>(배치4 Range 워커 관찰, 어긋남 아님) — <code>:156<\/code>·<code>:163<\/code> 만 떼어 읽으면 「Range 의 끝점은 Quantity 다」로 읽힌다. <code>:124<\/code> 가 앞에서 일반 규칙(끝점은 크기 비교가 되는 값)을 밝혀 문서 안에서는 해소되지만, <strong><code>:156<\/code> 에 「이 문서의 그림에서는」 한 구절을 넣는 쪽이 안전하다<\/strong><\/li>\n<li><strong>Measurement ↔ Range — FHIR <code>referenceRange<\/code> 를 어느 편이 맡을지<\/strong>(배치4, 양쪽이 서로를 안 가리킨 자리) — Measurement 편이 FHIR Observation 요소 중 <strong><code>referenceRange<\/code>(low/high SimpleQuantity, age Range)<\/strong> 를 <strong>일부러 안 실었다<\/strong>(Range 편 판본이 움직이는 중이었다). 리서치 노트 Measurement 절이 그 요소를 들고 Range 와 맞물리는 자리다. <strong>둘 다 발행됐으니 여기서 정한다<\/strong><\/li>\n<li><strong>★ <code>check-guides.py<\/code> 에 「근거 절 ↔ 참고 자료」 대조 검사 추가<\/strong>(배치5 Observation 채점자 제안 — <code>S6<\/code>·<code>S7<\/code> 과 같은 뿌리이므로 그쪽과 묶어 처리한다) — <code>grep -o &quot;(근거: [^)]*)&quot; | grep -o &quot;§[0-9.]*&quot; | sort -u<\/code> 로 본문이 실제로 대는 절을 뽑아 <strong><code>## 참고 자료<\/code> 절 목록과 대조<\/strong>하면, 배치5 의 1R MU "htmlStrategy": "<h4>KAN-001-YXTC2C 요청서 — 전체 가이드 재집필<\/h4>\n<h5>요청<\/h5>\n<ul>\n<li>현재 가이드의 구성이 충분한지 조사해 봐라. 추가할 패턴이 더 있다면 찾고 내용을 조사해라<\/li>\n<li>항목에 대해 조사를 진행해라<\/li>\n<li>authoring-kit를 적용하고, &quot;~/code_test&quot;의 집필 가이드를 계승해라.<\/li>\n<li>가이드 구성은 아래와 같다.<\/li>\n<li>패턴의 핵심을 직관적으로 이해할 수 있는 개요<\/li>\n<li>패턴의 상세 설명.<\/li>\n<li>등장하는 개념들을 빠짐없이 소개하고 정의한다.<\/li>\n<li>설명에 절차가 포함 된다면, 각 절차를 빠짐없이 설명한다. 필요하다면 왜 그렇게 하는지 이유를 포함한다.<\/li>\n<li>패턴은 여러 방식을 통해 구현될 수 있다. 따라서, 패턴의 경계, 불변식이 있다면, 설명하고, 비슷한 패턴이나 오해할 수 있는 안티패턴과 비교하여 차이점 위주로 설명<\/li>\n<li>실제 구현 예시를 통한 설명<\/li>\n<li>분석 패턴의 경우, 반드시 DDD 원칙을 준수해야 한다. 또한, 오해가 없도록, 구체적인 배경을 전제해야 한다. 예를 들어, transaction과 account 패턴을 설명할 때 entry는 transaction이 가지고 있을 수도 있고, account가 가질 수도 있으며 홀로 존재할 수도 있고, 혹은 별도 entity로 존재하나 account entity에 그에 대한 VO를 가지고 있을 수도 있다. 그래서 정확한 상황 설정이 중요하다.<\/li>\n<\/ul>\n<h4>왜 이 접근인가<\/h4>\n<p>33편은 같은 9섹션 템플릿으로 균질하지만 요청서 4요소 중 셋(개념 전수 정의 · 절차 전수 · 경계/불변식/차이 비교)을 담을 절이 없고, 분석 패턴 10편은 aggregate 경계를 정의하지 않은 채 경계를 암시하는 코드를 싣는다(<code>account-pattern.md<\/code>의 <code>Account { List&lt;Entry&gt; }<\/code>, <code>transaction-pattern.md<\/code>의 <code>e.account.post()<\/code>, <code>posting-rule-pattern.md<\/code>의 Account 객체 인자). 그래서 보강이 아니라 <strong>골격 교체<\/strong>이고, 규칙 정본을 SKILL.md 산문에서 authoring-kit spec으로 옮겨 33편이 같은 게이트를 지나게 한다. 순서는 code_test ORD-006 선례대로 <strong>규약 → 파일럿 3편 → 회고 → 확장 30편<\/strong>이다. 명세는 산출물로 검증되기 전엔 추정이라, 30편을 틀린 명세로 쓰는 것이 가장 큰 낭비다.<\/p>\n<p>계승 대상(<code>~/code_test<\/code>)의 규율: &quot;집필 규칙의 정본은 플러그인이다. 규칙을 스킬 문서에 다시 쓰지 않는다. 플러그인 없으면 명확히 실패한다.&quot; 글 종류마다 spec을 분리하고, 진입 스킬은 사전 확인 → 리서치 → <code>authoring-write<\/code> 위임 → 품질 게이트 → 발행만 한다(이해 게이트는 2026-09-20 유저 결정으로 빠졌다 — 판정이 실행마다 흔들려 통과를 막던 자리였고, 그 자리는 기계 검사와 품질 루브릭이 대신한다).<\/p>\n<h4>결정 11건<\/h4>\n<ul>\n<li><strong>1. spec 2개 — <code>gof-guide<\/code> + <code>analysis-guide<\/code><\/strong> — 근거 · 버린 대안: 분석 패턴 전용 MUST(DDD 준수 + 배경 전제)를 한 spec에 넣으면 GoF 쪽에서 IF-APPLICABLE로 약화되고 워커가 &quot;정당한 생략&quot;을 스스로 판단한다. 최소 조건의 판정 기준도 다르다(코드 구조 vs 개념적 책임 분리). 공통 절 산문은 두 <code>spec.md<\/code>에 <code>shared:pattern-guide-common<\/code> 여는 주석과 <code>/shared<\/code> 닫는 주석으로 두 벌 두고 <code>check-guides --spec-shared<\/code>가 마커 존재·파일당 1쌍·내용 동일을 검사한다. 버림: spec 1개+조건부 절, spec 3개<\/li>\n<li><strong>2. 새 골격 — 아래 「새 골격」 목록<\/strong> — 근거 · 버린 대안: 요청서 4요소를 <code>##<\/code>로, 세부를 <code>###<\/code>로. 절 제목은 제목만 읽고 내용을 알 수 있게<\/li>\n<li><strong>3. analyzer 계약 유지 — <code>디자인 패턴을 충족하는 최소 조건<\/code> 헤딩 문자열 유지, 레벨만 <code>###<\/code><\/strong> — 근거 · 버린 대안: analyzer SKILL.md의 경로(&quot;프로젝트 루트&quot;)·헤딩 레벨·&quot;첫 3개 필수&quot; 규칙을 <code>[필수]/[선택]<\/code> 표기로 교체하고 회귀 4건으로 검증<\/li>\n<li><strong>4. 같은 경로에 덮어쓴다, 기존 문서는 리서치 입력<\/strong> — 근거 · 버린 대안: 파일명이 analyzer·인덱스의 키. 루트 워크트리에 격리돼 main에 혼재 노출 없음. 문장 복사는 안 함(voice가 바뀌므로 재작성)<\/li>\n<li><strong>5. consideration 2편은 심화 트랙 유지 + 회계 배경 확정안의 출처<\/strong> — 근거 · 버린 대안: 두 문서는 서로 모순(문서1: Account가 <code>List&lt;AccountLedger&gt;<\/code> 소유 / 문서2: Entry 별도 aggregate + id 참조). .1 S4에서 배경 확정안 1건 — bounded context · aggregate 경계와 일관성 요구(균형 · 중복 전기 방지 · 취소/정정 · 동시 처리 · 파생 balance 지연 허용) · root/entity/VO 배정 · 참조 방식 — 을 만들어 회계 3편이 인용. 권고 초안: 복식부기, Transaction = root, Entry = 그 안의 불변 child, Account = id 참조 + 파생 balance. 유저가 .1 보고에서 확정<\/li>\n<li><strong>6. voice <code>ppangtolab-teacher<\/code> 그대로<\/strong> — 근거 · 버린 대안: 요청이 code_test 계승. 단정체 → 존댓말 전환은 33편 톤 변경이므로 파일럿 .3 S2(Account) 완료 시 유저 승인 게이트<\/li>\n<li><strong>7. stale 정리 포함<\/strong> — 근거 · 버린 대안: SKILL.md 2종·<code>.agents<\/code> → .2, PATTERNS.md(GoF 링크 23/23 깨짐)·README·DDD README·루트 참조 문서·4언어 하니스 처분 → .6<\/li>\n<li><strong>8. 추가 패턴 후보는 .1이 보고, 유저가 고르면 .7 신설<\/strong> — 근거 · 버린 대안: GoF 계열(Null Object·Specification 등)과 분석 계열(Fowler 나머지 장·PoEAA Money 등) 둘 다 후보. DDD 전술 용어 기준선 1편 신설 여부도 같은 보고에<\/li>\n<li><strong>9. 집필 work = 가이드 1편, 착수마다 <code>resolve --frozen<\/code> 통과 전제<\/strong> — 근거 · 버린 대안: code_test 실측(1세션 1가이드). 게이트 결과는 <code>pattern-guide/gate-results.jsonl<\/code>에 work마다 1줄(file · spec · 버전 · resolve 해시 · 라운드 · 외부 검토 · 날짜). <code>check-guides --gates<\/code>가 33건 존재 · verdict PASS · resolve 해시 = 현재 lock을 검사(낡은 PASS 검출)<\/li>\n<li><strong>10. 예시 코드: Java · TypeScript · Rust 세 언어, 블록마다 컴파일 검사(유저 결정). md는 나열, HTML 버전은 탭으로 묶는다<\/strong> — 근거 · 버린 대안: 컴파일은 하한이지 정확성 검증이 아니다 — 옳음은 예시 코드 실행 대조와 품질 게이트 채점이 진다(실행 검증은 유저 결정으로 범위 밖). HTML은 md의 파생물이고 .3(파일럿 3편)·.6(33편)에서만 그린다<\/li>\n<li><strong>11. 기존 절 넷의 처분(유저 결정) — 「어떨 때 사용하나」→ 새 <code>## 사용 목적<\/code> 절, 「장점과 단점, 한계점」→ 비교 절로 흡수, 「정보 표」→ 삭제(활용성 별점은 근거 없는 수치), 「Class Diagram」→ 개념 정의 직후로 이동<\/strong> — 근거 · 버린 대안: 「사용 목적」은 ds-guide의 <code>when.clue<\/code>(&quot;언제 이걸 꺼내야 하는가&quot;)를 계승<\/li>\n<\/ul>\n<h4>새 골격 (<code>gof-guide<\/code>)<\/h4>\n<ul>\n<li><strong>title<\/strong> — heading: <code># {패턴} — {직관을 담은 부제}<\/code> / 필수: ✓<\/li>\n<li><strong>overview<\/strong> — heading: <code>## 한눈에 보는 개요<\/code> / 필수: ✓ / 요청서 대응: 요소1. 문제→해결의 직관 + 그림 1. 분류·함께 쓰는 패턴 한 줄<\/li>\n<li><strong>detail.terms<\/strong> — heading: <code>### 등장하는 개념과 정의<\/code> / 필수: ✓ / 요청서 대응: 요소2. participants 전부 정의, 직후 mermaid classDiagram<\/li>\n<li><strong>detail.procedure<\/strong> — heading: <code>### 동작 절차<\/code> / 필수: ✓ / 요청서 대응: 요소2. collaborations를 단계별로, 각 단계에 &quot;왜&quot;<\/li>\n<li><strong>purpose<\/strong> — heading: <code>## 사용 목적<\/code> / 필수: ✓ / 요청서 대응: 어떤 문제·단서가 보일 때 꺼내는가, 쓰지 말아야 할 경우<\/li>\n<li><strong>boundary.minimum<\/strong> — heading: <code>### 디자인 패턴을 충족하는 최소 조건<\/code> / 필수: ✓ / 요청서 대응: 요소3. analyzer 계약 헤딩. 불변식은 여기 조건으로. 각 조건 <code>[필수]<\/code>/<code>[선택]<\/code><\/li>\n<li><strong>boundary.compare<\/strong> — heading: <code>### 비슷한 패턴·안티패턴과의 차이<\/code> / 필수: ✓ / 요청서 대응: 요소3. 대상 2개 이상, 차이점 위주, 오인 코드(<code>no-compile<\/code> 표식), 무엇을 얻고 무엇을 포기하는가<\/li>\n<li><strong>example.context<\/strong> — heading: <code>### 상황 설정<\/code> / 필수: ✓ / 요청서 대응: 요소4. 도메인·요구 전제<\/li>\n<li><strong>example.impl<\/strong> — heading: <code>### 구현<\/code> / 필수: ✓ / 요청서 대응: 요소4. 코드 블록 3개 고정 순서 <code>java<\/code> → <code>typescript<\/code> → <code>rust<\/code>, 각각 자기완결<\/li>\n<li><strong>example.realworld<\/strong> — heading: <code>### 실제 라이브러리에서<\/code> / 필수: 조건부 / 요청서 대응: 출처 확인된 사용처가 있을 때만<\/li>\n<li><strong>selfcheck<\/strong> — heading: <code>## 스스로 점검하기<\/code> / 필수: ✓ / 요청서 대응: voice 계승<\/li>\n<li><strong>refs<\/strong> — heading: <code>## 참고 자료<\/code> / 필수: ✓ / 요청서 대응: L0 evidence<\/li>\n<\/ul>\n<p>컨테이너 <code>##<\/code>: <code>## 패턴 자세히 들여다보기<\/code>(detail) · <code>## 패턴의 경계<\/code>(boundary) · <code>## 구현 예시<\/code>(example). <code>##<\/code> 순서: 개요 → 자세히 → 사용 목적 → 경계 → 구현 예시 → 스스로 점검하기 → 참고 자료.<\/p>\n<p><strong><code>analysis-guide<\/code> 차이<\/strong>: <code>detail.terms<\/code>는 분석 층위 개념만 · <code>boundary.minimum<\/code> 판정 기준 = 개념적 책임 분리 + 모델 불변식 · <code>example.context<\/code>는 MUST 표(bounded context / 불변식의 위치 / root·entity·VO 배정 / 타 aggregate 참조 방식) — 값 객체 계열에서 공회전하는지 파일럿 Quantity로 실측 · <code>example.impl<\/code>은 표와 1:1, aggregate 간 객체 참조 0 · <code>### 상황이 달라지면<\/code>(조건부) — 요청서가 든 Entry 4가지 소속이 이 표의 행이 된다.<\/p>\n<p><strong>코드 검사 계약(<code>check-guides --compile<\/code>)<\/strong>: 대상은 <code>### 구현<\/code> 아래 펜스 세 개뿐. 다른 절의 펜스는 검사하지 않고 오인 코드는 펜스 첫 줄에 <code>java no-compile<\/code> 정보 문자열을 단다. 도구·버전 고정 — <code>javac<\/code>(JDK 21), <code>typescript/node_modules/.bin/tsc --noEmit -p typescript/tsconfig.json<\/code>(<code>npx<\/code> 안 씀), <code>rustc --edition &lt;rust/Cargo.toml의 edition&gt;<\/code>(임시 <code>main.rs<\/code> 래핑, 외부 crate 금지). 검사기가 세 도구 버전을 확인해 출력에 적고 하나라도 없으면 비영 종료(<code>make doctor<\/code>는 무엇이 없어도 0이라 게이트가 못 된다).<\/p>\n<p><strong>HTML 버전<\/strong>: <code>scripts/render-guides.py<\/code>가 md 하나를 <strong>같은 폴더의 <code>&lt;slug&gt;-guide_v&lt;semver&gt;.html<\/code><\/strong> 로 낸다(2026-09-20 유저 결정 — 가이드 한 편이 폴더 하나이고 md·html·코드·도식이 함께 산다). <code>### 구현<\/code>의 세 언어 펜스를 탭 위젯 하나로(<code>role=&quot;tablist&quot;/&quot;tab&quot;/&quot;tabpanel&quot;<\/code>, 키보드 좌우 — 2026-09-27 유저 승인), 상대 링크는 같은 트리의 <code>.md<\/code> → <code>.html<\/code>. <strong>도식은 mermaid 가 아니라 <code>viz/<\/code> 체계다<\/strong>(2026-09-20 유저 결정 — <code>diagrams/*.tsx<\/code> 를 Playwright 실제 마운트로 굽고 PNG 를 data URI 로 박는다. <code>mmdc<\/code>·로컬 Chrome 경로는 걷어냈다). 외부 요청 0건. 소스 지문 입력 = md + 렌더러 + CSS + 탭 JS 전부, <code>check-guides --derived<\/code>가 낡음 판정.<\/p>\n<h4>하위 카드 7장과 순서<\/h4>\n<p>.1 리서치와 후보 조사 → .2 authoring-kit 정착 → .3 파일럿 3편과 회고 → .4 GoF 22편 → .5 분석 패턴 8편 → .6 인덱스·stale 정리·최종 검증 → <strong>.7 추가 패턴 4편<\/strong>. 엄격 순차. 루트 배치 3건(batch1 = .1~.3, batch2 = .4~.6, batch3 = .7). <code>.7<\/code> 은 <code>.1<\/code> 검토 1번 항목이 승인한 자리(인덱스 정리 뒤)에 2026-09-27 신설했다 — 채택된 추가 패턴 넷이고, 넣으면 가이드가 33편에서 37편이 된다. 하위 .4·.5·.6의 배치 문서는 .3 S4 회고가 <code>batch_size_works<\/code>를 2로 확정한 뒤(2026-09-17) 만들었다.<\/p>\n<h4>수행안 두 가지의 규모<\/h4>\n<p>하위 카드별 work 수와 배치 수다. 원천은 각 하위 카드 실행 문서의 「실행 계획」·「전략」 절이고, 여기 합계를 둔다 — 계획 리포트는 루트 카드 문서만 읽기 때문이다. 배치 크기는 .3 S4 회고가 실측으로 확정한 work 2개 기준이다(.1~.3은 확정 전 크기로 이미 수행했다). 근거는 파일럿 세 편이 모두 3라운드를 소진한 것이다. 당시 함께 든 codex 한도 근거는 2026-09-20 외부 검토 제거로 사라졌고, 남은 제약은 세션 토큰 예산이다.<\/p>\n<ul>\n<li><strong>.1 리서치와 후보 조사<\/strong> — work: 4 / 단일 에이전트(순차) 배치: 1 / 오케스트레이션(병렬) 배치 · 폭: 1 · 폭 4<\/li>\n<li><strong>.2 authoring-kit 정착<\/strong> — work: 6 / 단일 에이전트(순차) 배치: 2 / 오케스트레이션(병렬) 배치 · 폭: 2 · 배치1 순차, 배치2 폭 3<\/li>\n<li><strong>.3 파일럿 3편과 회고<\/strong> — work: 4 / 단일 에이전트(순차) 배치: 2 / 오케스트레이션(병렬) 배치 · 폭: 2 · 순차(실측이 목적)<\/li>\n<li><strong>.4 GoF 22편 재집필<\/strong> — work: 22 / 단일 에이전트(순차) 배치: 11 / 오케스트레이션(병렬) 배치 · 폭: 11 · 폭 2<\/li>\n<li><strong>.5 분석 패턴 8편 재집필<\/strong> — work: 9 / 단일 에이전트(순차) 배치: 5 / 오케스트레이션(병렬) 배치 · 폭: 5 · 폭 2<\/li>\n<li><strong>.6 인덱스·stale 정리·최종 검증<\/strong> — work: 3 / 단일 에이전트(순차) 배치: 2 / 오케스트레이션(병렬) 배치 · 폭: 2 · 순차<\/li>\n<li><strong>합계<\/strong> — work: <strong>48<\/strong> / 단일 에이전트(순차) 배치: <strong>23<\/strong> / 오케스트레이션(병렬) 배치 · 폭: <strong>23<\/strong><\/li>\n<\/ul>\n<ul>\n<li>병렬 폭은 하위 카드 <strong>안<\/strong>에서만 쓴다. 하위 카드 사이는 .1 → .6 엄격 순차다(.2의 분석 spec에 .1의 회계 확정안이 들어가고, .3은 .2의 파이프라인 위에서만, .4·.5는 .3이 고친 spec 1.1로 쓴다).<\/li>\n<li>가이드 1편은 외부 모델 CLI 를 부르지 않는다(2026-09-20 정성 게이트·외부 검토 제거). 비용은 집필·채점 워커의 토큰과 컴파일·실행 시간뿐이다.<\/li>\n<li>가이드 1편의 예시 코드는 Java · TypeScript · Rust 세 블록이라 옛 가이드(Java 1블록)보다 코드가 3배다. 크기 3이 무거우면 회고가 2로 내린다.<\/li>\n<li>오케스트레이션에서 워커는 커밋하지 않는다. 메인이 work 순서대로 <code>doc-step done<\/code> → 커밋 → 태그를 남기고, 같은 파일을 두 워커가 만지지 않으며, 비교 쌍은 배치 끝에 메인이 교차 확인한다.<\/li>\n<\/ul>\n<h4>선행 조건 (착수 전)<\/h4>\n<ol>\n<li>플러그인 프로젝트 스코프 설치(<code>claude plugin install authoring-kit@centurio87-plugins --scope project<\/code>) — 계획 리포트 집필에도 필요.<\/li>\n<li>orca 브랜치 접두사 none — <code>orca worktree create<\/code> 반환의 <code>branch == refs/heads/KAN-001-YXTC2C<\/code> 확인.<\/li>\n<li>외부 CLI(codex · agy) 의존 없음 — 파이프라인이 부르지 않는다. 필요한 것은 세 언어 툴체인(JDK 21 · 로컬 tsc · rustc)과 도식 렌더용 Playwright 다.<\/li>\n<li>전역 principles 레포(my-claude-env)의 미커밋 변경 확인 — <code>lock<\/code> revision 안정성.<\/li>\n<li>voice <code>used_by.projects<\/code>에 이 프로젝트 추가 — 전역 파일이라 카드 밖, 유저가 한다.<\/li>\n<\/ol>\n<h4>리스크<\/h4>\n<ul>\n<li><strong>정성 게이트는 통과 조건이 아니다<\/strong>(2026-09-20 유저 결정) — code_test 의 이해 게이트는 판정 문구가 수치 대조·실행값에 걸려 있는데, 패턴 가이드용으로 옮기며 그 자리를 &quot;설명이 얇은가&quot; 같은 정성 판단으로 바꿨다. 같은 파일·같은 모델에서도 판정이 흔들려(회고 3.1) 게이트 구실을 못 했다. 대응: 파이프라인에서 제거하고 통과는 기계 검사로만 가른다. 외부 검토는 &quot;실행됐는가&quot;만 게이트가 보고, 응답 내용은 집필 라운드의 입력이다.<\/li>\n<li><strong>외부 모델 비평은 쓰지 않는다<\/strong>(2026-09-20 유저 결정) — 계승 원본도 경로 바인딩과 축 파일이 없어 실행하지 않는다. 사실 주장 검증은 품질 게이트 채점이 실행·원문 대조로 진다.<\/li>\n<li><strong>voice <code>max_prose_run=2<\/code>가 GoF 설명에 도식 강제<\/strong> — 대응: mermaid·코드·표가 끊는 것으로 세어지는지 파일럿에서 확인<\/li>\n<li><strong>33편 × 3라운드 = 세션 다수<\/strong> — 대응: <code>resume<\/code> 규율 + 배치 종료 3종(doc-step done·태그·커밋) 강제<\/li>\n<li><strong>파일럿 회고가 spec을 크게 바꿈<\/strong> — 대응: .3 S4 완료 기준에 파일럿 3편 <code>--frozen<\/code> 재통과 + 재검사<\/li>\n<li><strong>세 언어 툴체인이 워크트리 환경에 없음<\/strong> — 대응: <code>check-guides --compile<\/code>이 버전을 직접 확인하고 없으면 비영 종료<\/li>\n<li><strong>Rust 스니펫이 단독 컴파일 안 됨<\/strong> — 대응: spec 원칙: 세 블록 전부 자기완결. 검사기가 임시 crate에 래핑. 외부 crate 금지<\/li>\n<li><strong>편당 코드 3배로 work 무게 증가 → 배치 크기 2<\/strong> — 대응: 파일럿 .3 S4에서 <code>batch_size_works<\/code> 실측 확정<\/li>\n<\/ul>", "htmlPlan": " \n<p><strong>어려운 셋의 집필 전 확인은 첫 편보다 먼저 한다(S2).<\/strong> 2026-11-16 <code>KAN-002.2<\/code> 검토에서 유저가 정했다. 각 편 직전에 확인하면 명세가 그 셋에 맞지 않는다는 사실을 아홉 편을 낸 뒤에 알게 되고, 그때 명세를 고치면 아홉 편을 다시 판올림해야 한다. 확인은 편마다 한 언어(TypeScript)로 시험 코드를 써서 세 가지를 본다. 핵심 동작이 사건 순서만으로 결정적으로 재현되는가, 시나리오 셋(기본 · 부하 · 장애, SD9)을 만들 수 있는가, 펜스 하나가 300줄 안에 드는가(SD28)다. 파일럿 1 첫 초안에서 Rust 가 TypeScript 보다 67줄 길었으므로(343 · 276줄, 회고 123행) TypeScript 가 233줄을 넘으면 Rust 로도 잰다. 시험 코드와 결과는 <code>pattern-guide/research/system-design-precheck-&lt;쓰는 날&gt;.md<\/code> 와 같은 이름의 폴더에 커밋해, 다른 세션이 이어받아도 같은 결과를 보게 한다.<\/p>\n<p><strong>확인을 통과하지 못한 편이 나오면 멈추고 묻는다.<\/strong> 그 문제를 사례 목록의 같은 계열 2차 후보로 바꿀지 명세(구현 코드 규약)를 고칠지는 확인 결과에 달린 선택이라, 2026-11-16 에 미리 정하지 않았다. 그때 확인 결과를 근거로 두 길을 함께 든다.<\/p>\n<p><strong>명세는 첫 편 전에 한 번만 고친다(S3).<\/strong> 명세를 고치면 해석 해시가 바뀌어 발행한 편의 게이트 PASS 가 모두 낡고(<code>check-guides --gates<\/code> 의 「낡은 PASS」), 판본을 올리면 머리말 <code>spec_version<\/code> 이 다른 최신본이 오류가 된다(<code>scripts/check-guides.py:1157<\/code>). 지금은 두 파일럿만 판올림하면 되지만, 12편을 쓴 뒤에는 열네 편이다. S3 에서 고칠 것은 원칙 표의 SD26 칸과 S2 결과가 요구하는 것이다. SD26 칸(<code>spec.md:366<\/code>)은 아직 「결정성 네 규칙」이고 본문(<code>spec.md:199<\/code>)과 <code>spec.json<\/code> 은 다섯 규칙이다. 집필 워커가 읽는 해석 결과에 표와 본문이 함께 실리므로, 그대로 두면 워커가 두 수를 함께 읽는다. 고치면 두 파일럿을 v1.1.1 로 내고 앞 판을 <code>legacy<\/code> 로 바꾼 뒤 게이트를 다시 거친다. 고칠 것이 없으면 S3 은 보류로 둔다. S3 뒤로는 명세를 고정하고(정할 것 2), 쓰다가 나온 명세 문제는 S28 노트에 근거와 함께 쌓는다.<\/p>\n<p><strong>진입 스킬을 먼저 손본다(S1).<\/strong> 고칠 곳은 둘이다. 하나는 플러그인 판이다. <code>.claude/skills/design-pattern-guide/SKILL.md:63<\/code> 은 <code>CLAUDE_PLUGIN_ROOT<\/code> 가 있으면 그 판을 먼저 쓴다. 그래서 0.4.2 플러그인 환경에서는 0.4.2 만 보는 다섯 항목 때문에 lock 검사에서 멈춘다(<code>KAN-002.2<\/code> 검토 5번). lock 에 적힌 판(0.3.0)을 쓰게 고친다. 다른 하나는 인덱스다. 같은 스킬 40행이 「이 계열의 인덱스는 카드 <code>KAN-002.3<\/code> 에서 세운다」며 등록을 막아 두었다. 이 계열의 인덱스를 <code>pattern-guide/system-design-guide/README.md<\/code> 로 새로 세워 두 파일럿을 싣고, <code>.claude/authoring/paths.json<\/code> 의 <code>dirs.index<\/code> 목록에 더한다. 그리고 각 편이 발행하면서 제 줄을 넣게 스킬을 고친다. 분석 패턴 계열도 GoF 인덱스(<code>PATTERNS.md<\/code>)와 따로 제 README 를 인덱스로 둔다.<\/p>\n<p><strong>한 편은 work 둘이다.<\/strong> 리서치 노트와 집필 · 발행이다. 노트는 사례 목록 그 행의 출처에서 시작해, 파일럿 노트와 같은 절 구성(요구 · 규모 추정 · 개념도와 기술 · 시나리오 · 대안 · 실제 사례 · 구현 메모 · 미해결 질문 · 원문 대조 · 출처)으로 <code>pattern-guide/research/system-design-&lt;슬러그&gt;-&lt;쓰는 날&gt;.md<\/code> 에 쓴다. 파일럿 때는 원문 대조를 집필 단계에서 따로 했고, 그 대조에서 빈틈 셋(V2 의 18M · 80M 충돌, C3 21% 의 뜻, C8 의 90초가 두 뜻)이 늦게 나왔다. 그래서 원문 대조표를 노트 work 의 완료 기준에 넣는다. 집필 · 발행은 <code>design-pattern-guide<\/code> 스킬 절차(사전 확인 → 집필 위임 → 기계 검사 · 품질 게이트 → 발행 · 게이트 기록 · 인덱스)를 그대로 쓴다. 슬러그는 노트 work 에서 정하고, 실행 계획에는 가칭을 적었다.<\/p>\n<p><strong>마지막은 정리다(S28).<\/strong> 12편의 펜스 줄 수, 게이트 라운드, S3 뒤 쌓은 명세 문제를 한 노트에 모은다. 명세 개정은 이 카드에서 하지 않고, 그 노트가 다음 개정의 입력이 된다. 카드 이유 칸이 말한 「후속 53건이 따를 예시」가 이 12편과 그 노트다.<\/p>\n<h4>수행안<\/h4>\n<p>| 수행안 | 대가 | 위험 | | --- | --- | --- | | <strong>추천<\/strong> 한 세션으로(단일 에이전트) — 묶음 열다섯을 차례로 한다 | 집필 전 확인 셋과 각 편의 리서치 노트를 나란히 하지 못한다 | 세션 한도에 걸리면 묶음 경계에서 이어 간다. 묶음마다 태그가 있어 그 자리에서 재개된다 | | 나눠 맡기기(오케스트레이션) — 묶음 1 에서 집필 전 확인 셋을 서브에이전트 셋에 나눠 주고, 묶음 3~14 에서는 다음 편의 리서치 노트를 서브에이전트가 앞서 쓴다 | 동시에 실행하는 양의 합이 묶음 크기 규칙(세션 예산의 절반) 안에 들도록 폭을 맞춰야 하고, 서브에이전트가 쓴 노트를 메인이 원문과 다시 대조한다 | 같은 대조를 두 번 한다. 앞서 쓴 노트는 바로 앞 편에서 막힌 자리를 담지 못한다. 파일럿 때 노트 대조 빈틈 셋이 나온 단계가 이것이다 |<\/p>\n<h4>정할 것<\/h4>\n<p>| 정할 것 | 추천 | 다른 길 | | --- | --- | --- | | 1. SD26 표 칸 — 원칙 표의 「결정성 네 규칙」을 S3 에서 고치는가 | <strong>추천<\/strong> S3 에서 고친다. 첫 편 전이면 판올림할 편이 두 파일럿뿐이고, 집필 워커가 읽는 해석 결과에서 표와 본문의 수가 갈리지 않는다 | 고치지 않는다. 채점은 원칙 본문(다섯 규칙)으로 하므로 판정은 그대로지만, 12편 내내 워커가 두 수를 함께 읽고, 뒤에 고치면 열네 편을 판올림한다 | | 2. 집필 중 명세 — S3 뒤 12편을 쓰는 동안 명세를 고치는가 | <strong>추천<\/strong> 고치지 않는다. 쓰다가 나온 명세 문제는 S28 노트에 근거와 함께 쌓고, 개정은 이 카드 뒤에 한다. 필수 원칙 때문에 그 편을 쓸 수 없을 때만 멈추고 묻는다 | 나올 때마다 고친다. n번째 편에서 고치면 그때까지 낸 n-1편과 두 파일럿을 판올림하고 게이트를 다시 거친다 |<\/p>\n<h4>버린 대안<\/h4>\n<p>| 대안 | 버린 이유 | | --- | --- | | 12편을 하위 카드 셋(넷씩)으로 나눠 중간 검토를 받는다 | 형식은 승인받은 두 파일럿이 정했고 명세는 S3 뒤 고정하므로, 중간 검토가 뒤 편에 줄 수 있는 것이 편마다 따로인 구조 선택뿐이다. 하위 카드마다 계획 리포트와 검토가 하나씩 늘어난다 | | 리서치 노트 열둘을 먼저 다 쓰고 집필한다 | 노트와 집필 사이가 길어진다. AI-02 처럼 근거가 빨리 바뀌는 편은 대조 날짜가 낡고, 앞 편에서 막힌 자리를 뒤 노트에 되먹일 수 없다 | | 집필 전 확인을 각 편 직전에 한다 | 2026-11-16 검토에서 유저가 고르지 않았다. 명세가 그 셋에 맞지 않는다는 사실을 아홉 편 뒤에 안다 | | SD26 칸만 고치고 파일럿은 그대로 둔다 | 명세를 고치면 해석 해시가 바뀌어 두 편의 게이트 PASS 가 낡고, 판본을 올리면 두 편이 <code>spec_version<\/code> 검사에 걸린다 | | 이 계열을 GoF 인덱스(<code>PATTERNS.md<\/code>)에 더한다 | GoF 인덱스는 분류와 비교 페어 구조가 뜻을 담고 있어(진입 스킬 155행) 문제 단위 글이 들어갈 자리가 없다 |<\/p>\n<h4>만약<\/h4>\n<p>| 만약 | 그러면 | 대응 | | --- | --- | --- | | 집필 전 확인에서 한 편이 통과하지 못한다 | 그 편을 쓸 수 없다 | S2 에서 멈추고, 확인 결과를 근거로 「같은 계열 2차 후보로 바꾼다」와 「명세(구현 코드 규약)를 고친다」를 함께 들고 묻는다 | | 게이트 3라운드에도 MUST 가 남는다 | 그 편을 발행하지 못한다 | 멈추고 사람에게 넘긴다(자동 통과 없음). 게이트 기록에 FAIL 줄을 남긴다 | | 노트의 출처가 열리지 않거나 원문과 다르다 | 그 수치를 본문에 쓸 수 없다 | 노트에 「확인 안 함」이나 정정을 적고 본문에서 뺀다. 요구 절의 핵심 수치면 다른 출처를 찾고, 없으면 묻는다 | | 쓰다가 명세 문제가 나온다 | 그 편이 규칙과 어긋난다 | 정할 것 2 의 답을 따른다. 추천대로면 S28 노트에 쌓고 계속하고, 필수 원칙 때문에 쓸 수 없을 때만 멈추고 묻는다 | | 펜스 하나가 300줄을 넘는다 | SD28(권장)에 걸린다 | 출력과 대역의 군더더기를 먼저 줄이고, 그래도 넘으면 재현하는 시나리오를 줄인다(명세 구현 규약 7) | | 워크트리에 TypeScript 컴파일러가 없다 | <code>--compile<\/code> 이 <code>typescript/node_modules/.bin/tsc<\/code> 없음으로 실패한다 | <code>KAN-002.2<\/code> 때처럼 main 체크아웃의 <code>typescript/node_modules<\/code> 를 잇고, 커밋 전에 걷는다 |<\/p>", "htmlPlan": "<ul>\n<li>[ ] <code>S1<\/code> 진입 스킬과 인덱스 — <code>design-pattern-guide<\/code> 스킬이 lock 에 적힌 플러그인 판을 쓰게 고치고(63행), 이 계열의 인덱스 <code>pattern-guide/system-design-guide/README.md<\/code> 를 세워 두 파일럿을 싣고, <code>paths.json<\/code> 의 <code>dirs.index<\/code> 에 더하고, 스킬의 「인덱스 등록을 하지 않는다」(40행)를 「발행할 때 이 인덱스에 제 줄을 넣는다」로 바꾼다. 완료 기준: <code>CLAUDE_PLUGIN_ROOT<\/code> 를 0.4.2 경로로 주고 스킬의 <code>PLUGIN<\/code> 줄을 실행해도 0.3.0 경로가 나오고, <code>check-guides --all<\/code> 과 <code>--pointers<\/code> 가 0 오류다<\/li>\n<li>[ ] <code>S2<\/code> 집필 전 확인 셋 — SY-01 · MD-01 · AI-02 의 시험 코드를 TypeScript 로 쓰고(233줄을 넘으면 Rust 로도), 편마다 결정적 재현 · 시나리오 셋 · 300줄 안을 확인해 <code>pattern-guide/research/system-design-precheck-&lt;쓰는 날&gt;.md<\/code> 와 같은 이름의 폴더에 남긴다. 완료 기준: 세 편마다 세 물음의 답이 시험 코드의 실행 출력과 줄 수로 적혀 있고, 시험 코드를 두 번 실행한 출력이 같고, <code>check-guides --all<\/code> 이 S1 직후와 같다. 통과하지 못한 편이 있으면 여기서 멈추고 묻는다<\/li>\n<li>[ ] <code>S3<\/code> 명세 개정과 파일럿 판올림 — 원칙 표 SD26 칸(정할 것 1)과 S2 결과가 요구하는 것을 <code>spec.md<\/code> · <code>spec.json<\/code> · 캔버스 · 변경 기록에 넣고 lock 을 갱신한 뒤, 두 파일럿을 새 판으로 내고 앞 판을 <code>legacy<\/code> 로 바꾼다. 고칠 것이 없으면 보류로 둔다. 완료 기준: <code>authoring.py validate --all<\/code> 통과, <code>lock<\/code> 0, <code>resolve --frozen<\/code> 0, <code>check-guides --all --compile --run<\/code> 과 <code>--gates --pointers --derived<\/code> 0 오류, 인덱스가 두 파일럿의 새 판을 가리킨다<\/li>\n<li>[ ] <code>S4<\/code> IN-01 API 처리율 제한 리서치 노트(가칭 <code>api-rate-limiting<\/code>) — 사례 목록 IN-01 행의 출처에서 시작해 파일럿 노트와 같은 절 구성으로 쓴다. 완료 기준: 명세 절마다 쓸 근거가 노트 절로 대응하고, 본문에 실을 수치마다 출처 · 계산 · 가정 구분이 있고, 원문 대조표(대조 날짜 · 같은 글 안의 다른 값 · 주장의 대상 · 동사의 강도)가 있다<\/li>\n<li>[ ] <code>S5<\/code> IN-01 API 처리율 제한 집필 · 발행 — <code>design-pattern-guide<\/code> 스킬 절차로 쓰고 발행해 인덱스에 싣는다. 완료 기준: <code>check-guides --all --compile --run<\/code> 0 오류, 품질 게이트 PASS(3라운드 이내), <code>gate-results.jsonl<\/code> 에 PASS 줄, <code>--gates --pointers --derived<\/code> 0 오류, 인덱스에 이 편 줄<\/li>\n<li>[ ] <code>S6<\/code> CT-05 결제 · 송금 중복 방지 리서치 노트(가칭 <code>payment-idempotency<\/code>) — 사례 목록 CT-05 행의 출처에서 시작해 파일럿 노트와 같은 절 구성으로 쓴다. 완료 기준: S4 와 같다<\/li>\n<li>[ ] <code>S7<\/code> CT-05 결제 · 송금 중복 방지 집필 · 발행 — <code>design-pattern-guide<\/code> 스킬 절차로 쓰고 발행해 인덱스에 싣는다. 완료 기준: S5 와 같다<\/li>\n<li>[ ] <code>S8<\/code> CT-03 티켓 예매와 좌석 선점 리서치 노트(가칭 <code>ticket-seat-hold<\/code>) — 사례 목록 CT-03 행의 출처에서 시작해 파일럿 노트와 같은 절 구성으로 쓴다. 완료 기준: S4 와 같다<\/li>\n<li>[ ] <code>S9<\/code> CT-03 티켓 예매와 좌석 선점 집필 · 발행 — <code>design-pattern-guide<\/code> 스킬 절차로 쓰고 발행해 인덱스에 싣는다. 완료 기준: S5 와 같다<\/li>\n<li>[ ] <code>S10<\/code> RT-03 대형 그룹 채팅 리서치 노트(가칭 <code>large-group-chat<\/code>) — 사례 목록 RT-03 행의 출처에서 시작해 파일럿 노트와 같은 절 구성으로 쓴다. 완료 기준: S4 와 같다<\/li>\n<li>[ ] <code>S11<\/code> RT-03 대형 그룹 채팅 집필 · 발행 — <code>design-pattern-guide<\/code> 스킬 절차로 쓰고 발행해 인덱스에 싣는다. 완료 기준: S5 와 같다<\/li>\n<li>[ ] <code>S12<\/code> AG-03 광고 클릭 집계 리서치 노트(가칭 <         fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"></path></svg></button></div>
    <h2 id="d-title"></h2>
    <p class="d-long" id="d-long"></p>
    <div class="d-prog" id="d-prog"></div>
    <div class="d-links"><span class="d-reports" id="d-reports"></span><span class="spacer"></span>
      <button id="d-done" hidden>완료로 옮기기</button><button id="d-archive">보관</button></div>

  <div class="tray-head"><h3 id="tray-title"></h3><span class="tray-sub" id="tray-sub"></span></div>

      <p class="tray-sub">patch JSON — <code>kanban.py board-apply &lt;보드&gt; --patch &lt;파일&gt;</code> 로 넣습니다</p>
