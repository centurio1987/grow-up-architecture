<title>grow-up-architecture 칸반 보드</title>
<style>
/* manage-kanban 계획 리포트 스타일 — Neobrutalism_Editorial_01 (editorial brutalism)
 *
 * 출처: bbangto-ui/packages/style-guide-catalog/src/neobrutalismEditorial.tsx
 *   라이트 = foundations(semantic) · 다크 = midnightFoundations(makeColorway)
 *
 * **왜 사본인가.** @centurio1987/bbangto-ui-visualization 은 React 컴포넌트 + 빌드가
 * 필요하고 사설 레지스트리(npm.pkg.github.com)에 있다. 리포트는 빌드 없이 열리는 단일
 * HTML 이고 CSP 로 외부 로드가 막히므로, 패키지를 런타임에 쓸 수 없다. 그래서 토큰 값만
 * 옮겼다.
 *
 * **토큰은 두 칸이다.** `:root` 맨 앞 「원본 사본(대조 대상)」 12줄은 위 .tsx 의 NEO
 * 원시값을 그대로 옮긴 것이고, 그 아래 「로컬 역할 토큰(대조 밖)」은 이 스킬이 정한
 * 이름이다(바탕 · 글 · 띠와 칩의 색 · 「방금 바뀜」 · 상태 글자색 · 별칭 · 그림자 · 움직임).
 * 원시값은 다크에서도 안 바뀌므로, 테마를 따라 뒤집혀야 하는 자리는 로컬 이름을 쓴다
 * (원시값은 타이틀 블록의 잉크 글처럼 일부러 고정하는 자리에만). 로컬 이름은 원본 원시값
 * 이름과 겹치지 않게 짓는다.
 *
 * **drift 는 이 주석이 아니라 테스트가 막는다** — scripts/test_report.py 의 t_drift 가 위
 * .tsx 를 파싱해 「원본 사본」 12줄과 대조하고(원본이 없는 머신에서는 skip), 두 칸이 갈려
 * 있는지와 로컬 이름이 원시값 이름을 다시 쓰지 않는지도 본다.
 */

:root {
  /* ─── 원본 사본(대조 대상) — NEO 원시값 12개 ────────────────────────────────
   * t_drift 가 이 12줄을 원본과 한 줄씩 대조한다. 값은 원본에서만 바꾼다. */
  --ink: #1C1B17;
  --ink-hover: #2A2823;
  --cream: #FAF2DD;
  --paper: #FFFCF2;
  --cream-sunken: #F3E8C9;
  --gold: #E9C766;
  --green: #C2D3B4;
  --pink: #ECC3C8;
  --muted: #4A463C;
  --subtle: #6E6A5E;
  --faint: #9A9483;
  --border-width: 2px;

  /* ─── 로컬 역할 토큰(대조 밖) — 여기부터 이 스킬이 정한 이름 ──────────────────
   * 원본에 없는 이름이라 t_drift 가 값을 대조하지 않는다. 다크 전환은 이 칸의 이름을
   * 아래 두 다크 블록에서 다시 정의해서 돈다. */
  --bg: var(--cream);
  --bg-elevated: var(--paper);
  --bg-sunken: var(--cream-sunken);
  --fg: var(--ink);
  --fg-muted: var(--muted);
  --fg-subtle: var(--subtle);
  --border: var(--ink);
  /* 상자 안 가는 칸막이(1.5px). 2px 잉크선은 상자 바깥 테두리에만 남긴다. 바탕과의 대비가
   * 1.56(다크 1.30)이라 **장식 전용**이다 — 상태나 누를 자리의 유일한 경계로 쓰지 않는다
   * (그 자리는 `--border` 2px 이나 글자가 진다). */
  --line-soft: #D9CCA6;
  /* ─── 색의 역할 — 「자리」와 「상태」를 한 색이 겸하지 않는다 ─────────────────
   * 장치가 둘이다. **왼쪽 5px 띠**는 「이 자리는 무엇인가」를 말하고, **칩(.tag·
   * 레일 칸)**은 「이것은 어떤 상태인가」를 말한다. 같은 값이 두 장치에 쓰이는 것은
   * 괜찮지만, 한 장치 안에서 두 뜻을 겸하면 훑는 눈이 갈라내지 못한다.
   *
   *   --accent   (골드) **「사람 차례」 하나만 말한다.** 칩: 「내 차례」(별칭 `--you`) ·
   *                        띠: 진행 중 칸 · 「정할 것」 자리 · 인용·주석 · 검토 항목의 근거
   *                        띠(보기 · 정할 것 · 배경) / 그 밖: 타이틀 블록. 갈래 상자의 추천은
   *                        골드가 아니라 칩 + 2px 잉크 테다. 포커스 테와 그림자는 골드가
   *                        아니다(아래 `--focus` · `--offset`)
   *   --accent-2 (그린) 띠: **조작 자리 전용**. 질감이 모드를 말한다 —
   *                        단색=serve(누르면 정본에 씀) · 45° 해칭=정적(패치로 나감)
   *   --accent-3 (핑크) 띠: **승계 전용**. 상태 칩 `tag-hold` 와 레일 칸 `st-noted` 가
   *                        같은 값을 쓰지만 그쪽은 띠가 아니라 칩이라 안 겹친다
   *   --bg-sunken       th · 미정 칩 · 승계 블록 바탕 · **접힌 조각 바탕**(「여기 더
   *                        있다」의 단일 신호) · 결정 헤더 아래 모노 줄
   *   --danger/--ok/--warn  반려 / 승인 / 경고. 상태 전용이라 띠로 안 쓴다. 칩 · 레일
   *                        바탕에만 쓰고, 글자 · 테로 쓸 때는 `--danger-fg` · `--ok-fg`
   *   --changed 셋     「방금 바뀜」. 상태가 아니라 **사건**이라 상태 색 다섯과 골드를
   *                        빌리지 않고 파랑을 쓴다(빨강/그린을 못 가르는 눈에도 밝기로 갈림)
   *   --focus    (잉크) 포커스 테 3px 실선. 골드에서 옮겼다 — 골드 바탕(타이틀 · 눌린
   *                        단추) 위에서도 보이고, 골드가 「사람 차례」 하나만 말하게 된다
   *   --offset · --offset-lg (잉크) 그림자 = **「지금 조작하는 자리」**. 큰 것은 타이틀 ·
   *                        트레이 · 모달 · 결정 헤더, 작은 것(3px)은
   *                        카드 · 항목 · KPI 같은 낱개 상자
   *
   * **테마마다 값이 다른 토큰은 세 블록에 함께 선다.** 「저장 전」(아직 정본이 아님)은
   * 여전히 색이 아니라 2px 점선 + `outline-offset` 으로 말한다 — 색을 쓰면 훑는 눈이 그것을
   * 상태로 읽는다. 점선의 색 이름은 별칭 `--pending-line` 이라 새 색이 아니다. 새로 생긴
   * 색(칸막이 · 「방금 바뀜」 · 상태 글자색)은 테마마다 값이 다르면 이 블록과 아래 두 다크
   * 블록에 모두 적는다 — 한 곳이라도 빠지면 다크 전환(토큰 재정의)이 그 자리만 안
   * 뒤집는다. test_report.py 의 t_ux_css 가 세 블록을 맞대 본다. */
  --accent: var(--gold);
  --accent-2: var(--green);
  --accent-3: var(--pink);
  --danger: #C0392B;
  --ok: #5C7A4A;
  --warn: #B8860B;
  /* 「방금 바뀜」 — 칩 바탕(글자는 잉크, 두 테마 같은 값) · 바뀐 것의 테 · 바탕이 한 번
   * 잦아드는 첫 색(kb-trace). 첫 색 위의 글(본문 · muted · subtle)이 4.5:1 을 넘는다. */
  --changed: #A9C6EA;
  --changed-line: #2D5E9E;
  --changed-wash: #E4EDF8;
  /* 상태 글자 · 상태 테 — 「실패」 글 · 거부 테 · 「들어감」 글. 다크에서 `--danger` ·
   * `--ok` 를 글자로 쓰면 4.5:1 에 못 미쳐 따로 둔다. */
  --danger-fg: #C0392B;
  --ok-fg: #5C7A4A;
  /* 역할 별칭 — 새 규칙은 이 이름을 쓴다. **이 블록 안의 이름만 가리킨다** — report.py 의
   * `_load_svg_palette` 가 이 블록의 var() 를 풀어 차트 색을 만들므로, 밖의 이름을
   * 가리키면 import 에서 KeyError 가 난다. 다크 값은 가리키는 쪽이 바뀌면 따라온다. */
  --you: var(--accent);
  --focus: var(--fg);
  --pending-line: var(--fg-subtle);
  /* 그림자 — 잉크(`--border`)라 다크에서 함께 뒤집힌다. */
  --offset: 3px 3px 0 var(--border);
  --offset-lg: 5px 5px 0 var(--ink);
  /* 움직임 — 시간과 곡선. 테마와 상관없다. 사건마다 무엇을 쓰는지는 시안 motion.md.
   * 규칙에 숫자를 박지 않고 이 이름만 쓴다. 닫힘은 열림 시간의 0.75배로 ease-in. */
  --t-press: 90ms;
  --t-quick: 160ms;
  --t-move: 240ms;
  --t-count: 420ms;
  --t-trace: 1600ms;
  --t-arrive: 900ms;   /* 「다음 미해결」 · 레일로 간 항목의 잉크 링 한 번(motion.md 검토 표) */
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-in: cubic-bezier(.5, 0, .75, 0);
  --ease-move: cubic-bezier(.65, 0, .35, 1);
  --ease-snap: cubic-bezier(.3, 1.35, .5, 1);

  /* 결정 헤더의 높이. sticky 가 둘(결정 헤더 · 항목 헤더줄)이라 이 값이 세 자리에서
   * 함께 움직인다 — 항목 헤더줄의 `top`, 앵커의 `scroll-margin-top`, 그리고 둘의 층 순서.
   * 한 자리만 고치면 레일을 눌러 간 항목이 헤더 밑에 숨거나 헤더줄이 겹친다. 레일이 한 줄일 때
   * 1280 실측 58px(KAN-021 S9) — 칸이 많아 레일이 두 줄이 되면 항목 헤더줄은 결정 헤더 밑으로 들어간다
   * (층은 결정 헤더가 위라 가려질 뿐 겹쳐 읽히지 않는다). */
  --dh-h: 3.6rem;

  --font-sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
}

/* 다크는 잉크/크림을 뒤집는다(midnight colorway). 시스템 기본은 media query 가,
 * 명시적 선택은 [data-theme] 가 이긴다 — 둘 다 정의해야 토글이 양방향으로 먹는다.
 * 두 블록은 같은 이름 · 같은 값이다(t_ux_css 가 맞대 본다). 테마마다 값이 다른 로컬
 * 토큰(칸막이 · 「방금 바뀜」 테와 첫 색 · 상태 글자색)도 여기 함께 적는다. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1B17;
    --bg-elevated: #2A2823;
    --bg-sunken: #141310;
    --fg: #FAF2DD;
    --fg-muted: #C9C2AE;
    --fg-subtle: #9A9483;
    --border: #FAF2DD;
    --line-soft: #3D3A32;
    --changed-line: #9DBEE6;
    --changed-wash: #1E2A3C;
    --danger-fg: #EE7A6A;
    --ok-fg: #9CC08A;
    --offset: 3px 3px 0 var(--border);
    --offset-lg: 5px 5px 0 var(--border);
  }
}
:root[data-theme="dark"] {
  --bg: #1C1B17;
  --bg-elevated: #2A2823;
  --bg-sunken: #141310;
  --fg: #FAF2DD;
  --fg-muted: #C9C2AE;
  --fg-subtle: #9A9483;
  --border: #FAF2DD;
  --line-soft: #3D3A32;
  --changed-line: #9DBEE6;
  --changed-wash: #1E2A3C;
  --danger-fg: #EE7A6A;
  --ok-fg: #9CC08A;
  --offset: 3px 3px 0 var(--border);
  --offset-lg: 5px 5px 0 var(--border);
}

body {
  margin: 0;
  padding: 2.5rem 1.25rem 5rem;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.75;
}

.wrap { max-width: 62rem; margin: 0 auto; }

/* 각진 모서리 · 2px 잉크선 · 하드 오프셋. 이 셋이 모티프의 전부다. */
.card, .kpi, table, pre, .chart {
  background: var(--bg-elevated);
  border: var(--border-width) solid var(--border);
  border-radius: 0;
}
.card { padding: 1.25rem 1.5rem; margin: 1.5rem 0; box-shadow: var(--offset); }

h1, h2, h3 { font-weight: 700; margin: 2rem 0 .75rem; }
h1 { font-size: 38px; line-height: 1.05; letter-spacing: -.01em; margin-top: 0; }
h2 { font-size: 30px; line-height: 1.1; letter-spacing: -.01em;
     border-bottom: var(--border-width) solid var(--border); padding-bottom: .35rem; }
h3 { font-size: 20px; line-height: 1.3; }

.meta { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em;
        font-weight: 600; text-transform: uppercase; color: var(--fg-subtle); }
/* 경로를 싣는 메타 줄(「생성 근거」)은 대문자로 바꾸지 않는다 — `.kanban/…` 이 `.KANBAN/…` 으로 보이면 없는
   경로다(KAN-021 S19 대조, 시안 2.4-3 「모노는 경로에만」). */
.meta.src { text-transform: none; letter-spacing: 0; }

.title-block { border: var(--border-width) solid var(--border); background: var(--accent);
               color: var(--ink); padding: 1.5rem; box-shadow: var(--offset-lg); }
.title-block h1, .title-block .meta { color: var(--ink); }
/* 타이틀 머리줄 — 왼쪽은 문서가 무엇인가, 오른쪽은 이 화면이 무엇을 할 수 있는가(모드
   지문). 두 모드에서 **같은 자리**에 서야 「지금 어느 쪽인가」를 자리로 알 수 있다. */
.tb-row { display: flex; justify-content: space-between; gap: .5rem 1rem;
          align-items: baseline; flex-wrap: wrap; margin-bottom: .5rem; }
/* 줄 자체가 아래 간격을 지므로 안의 문단은 여백을 안 갖는다 — 안 그러면 좁은 화면에서
   지문이 아래로 접힐 때 h1 과 맞붙는다(375px 실측). */
.tb-row > .meta { margin: 0; }

.kpis { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0; }
.kpi { flex: 1 1 9rem; padding: .9rem 1rem; box-shadow: var(--offset); }
.kpi b { display: block; font-size: 30px; line-height: 1.1; }

table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
th, td { border: 1px solid var(--border); padding: .5rem .7rem; text-align: left;
         vertical-align: top; font-size: 15px; }
th { background: var(--bg-sunken); font-weight: 700; }

/* 넓은 것은 페이지가 아니라 자기 안에서 가로 스크롤한다. */
.scroll { overflow-x: auto; }
/* 공백 없이 이어진 긴 코드 조각은 꺾는다. 안 꺾으면 좁은 화면에서 문서 폭을 민다 — 이 카드의
   검토서 검증 절이 375px 에서 560px 까지 밀었다(KAN-014 S8 실측). 표의 최소 폭은 안 건드리는
   값이라 표는 지금처럼 `.scroll` 안에서 민다. */
li, p, figcaption { overflow-wrap: break-word; }
pre { padding: .8rem 1rem; font-family: var(--font-mono); font-size: 13px; overflow-x: auto; }
code { font-family: var(--font-mono); font-size: .9em; }

.chart { padding: 1rem; margin: 1rem 0; }
.chart svg { display: block; width: 100%; height: auto; }

/* 칩 글은 본문 글꼴이다 — 모노는 기술 정보 · 명령 · 경로에만(시안 2.4-3). 모노면 「남은 항목 없음」의 빈칸이
   글자 폭만큼 벌어진다(KAN-021 S19 대조). */
.tag { display: inline-block; border: var(--border-width) solid var(--border);
       padding: 0 .4rem; font-family: var(--font-sans); font-size: 12px; font-weight: 600; }
.tag-done { background: var(--ok); color: var(--cream); }
.tag-doing { background: var(--accent); color: var(--ink); }
.tag-todo { background: var(--bg-sunken); color: var(--fg-muted); }
/* 「추가 의견」 상태. `--accent-3` 을 쓰지만 **칩이라 승계 띠와 안 겹친다** — 띠로서의
   핑크는 승계 전용이고, 이 자리는 장치가 다르다(위 역할 주석). */
.tag-hold { background: var(--accent-3); color: var(--ink); }
.tag-warn { background: var(--warn); color: var(--ink); }
.tag-danger { background: var(--danger); color: var(--cream); }
/* 승계 칩은 판정 태그(승인·반려·미정)와 **다른 종류의 사실**이다 — 판정은 이 문서가
 * 내린 상태이고 승계는 어디서 왔는가다. 위 여섯 중 하나를 빌려 쓰면 훑는 눈이 그것을
 * 상태로 읽으므로, 어느 것과도 안 겹치게 잉크와 바탕을 뒤집는다. 토큰을 뒤집는 것이라
 * 다크에서도 그대로 선다(리터럴을 박으면 그 자리만 안 뒤집힌다). */
.tag-inh { background: var(--fg); color: var(--bg); }

.note, blockquote { border-left: 5px solid var(--accent); padding-left: 1rem;
                    color: var(--fg-muted); margin: 1rem 0; }
ol, ul { padding-left: 1.4rem; }
li { margin: .25rem 0; }

/* ─── 승계 — 넘어온 의견임이 접기 밖에서 보여야 한다 ──────────────────────────
 * 승계 사실은 `inherit` 값으로 이미 있었는데, 화면에는 상세(접기) 안의 텍스트 한 줄로만
 * 있었다. 그래서 훑는 사람은 이 의견이 남의 검토서에서 넘어온 것인지 모른 채 판정한다 —
 * 값을 가르는 것과 화면에서 드러나는 것은 다른 일이고, 이 블록이 뒤엣것이다.
 *
 * 왼쪽 띠는 이 스타일이 이미 쓰는 모티프다(.note·blockquote 가 accent, 검토 화면의 조작
 * 자리가 accent-2). 승계는 남은 accent-3 을 쓴다 — 셋이 한 항목 안에 같이 서므로 자리마다
 * 색이 달라야 "여기는 무엇을 하는 자리인가"가 색으로 읽힌다. **띠로서의 accent-3 은 승계
 * 전용**이고, 항목이 거터 밴드로 바뀐 뒤로 이 띠는 `.jd-band-inh > .jd-body` 가 진다.
 *
 * 검토 화면 전용 CSS(report.py 의 REVIEW_CSS)가 아니라 여기 두는 이유: 그쪽은 **판정을
 * 내릴 수 있는 문서**에만 실린다. 승계된 검토서(판정이 다른 문서로 넘어간 쪽)도 자기가
 * 물려받은 의견을 그대로 들고 있어서, 거기 두면 그 화면에서만 띠가 통째로 빠진다. */
.inh { border-left: 5px solid var(--accent-3); background: var(--bg-sunken);
       padding: .5rem .75rem; margin: .5rem 0 .7rem; }
/* 머리의 승계 알림은 문서 전체의 사실이라 절 사이 간격과 카드 여백을 그대로 쓴다. */
.card.inh { padding: 1rem 1.25rem; margin: 1.5rem 0; }
.inh-row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: baseline;
           margin: .2rem 0; }
/* 라벨 폭을 맞춘다 — 줄이 여럿인데 값의 시작이 들쭉날쭉하면 무엇이 무엇의 값인지가
   눈으로 안 붙는다. */
.inh-row > .meta:first-child { margin: 0; min-width: 4.5rem; }
.inh-val { flex: 1 1 16rem; color: var(--fg-muted); }
/* 계보는 좁은 화면에서 페이지를 밀 수 있다. 가로 스크롤 대신 접어 내린다 — 홉이 낱개
   조각이라 줄이 바뀌어도 읽는 순서가 안 깨진다. */
.inh-chain { display: flex; flex-wrap: wrap; gap: .35rem; align-items: baseline; }
.inh-arrow { color: var(--fg-subtle); }

/* ─── 검토 윗부분 — 윗줄 · 한 줄 제목 · 부제(KAN-021 S9, 시안 Review · ReviewExpand) ─────────
 * 골드 제목 블록(.title-block)은 계획 리포트 옛 렌더만 쓴다. 검토는 그 자리에 두 줄을 둔다 —
 * 윗줄(「보드 ›」 경로 · 모드 점 + 글 · 쓰는 사람 · 「이 화면 쓰는 법」)과 한 줄 짧은 제목 + 작은
 * 부제(긴 제목 · 검토 요청 날짜 · 항목 수 · 칸 · 문서 상태). 1280×900 첫 화면에 1번 항목 머리가
 * 들어오게 하려는 것이다(시안 2.2-1).
 *
 * **여기(REPORT_STYLE)에 두는 이유**는 결정 헤더와 같다 — 승계됨 · 닫힌 마지막 화면에는 REVIEW_CSS
 * 가 안 실리는데, 윗줄과 제목은 그 화면에도 선다. 조작 요소(쓰는 사람 고르기)만 REVIEW_CSS 가 진다. */
body:has(.rv-top) { padding-top: .75rem; }
/* 「다음 미해결」 · 레일로 뛰는 길을 보인다(motion.md). 움직임 줄이기면 아래 줄이기 블록이 끈다. */
html:has(#rv-list) { scroll-behavior: smooth; }
.rv-top { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem 1rem;
          padding: .2rem 0 .45rem; border-bottom: 1.5px solid var(--line-soft);
          font-size: 13px; line-height: 1.4; }
.crumbs { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .4rem;
          min-width: 0; margin-right: auto; color: var(--fg-muted); }
.crumbs > * { min-width: 0; overflow-wrap: anywhere; }
.crumbs a { color: var(--fg-muted); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.crumbs a:hover { color: var(--fg); }
.crumbs b { color: var(--fg); }
/* 모드 — 점 + 글. 색만으로 말하지 않는다(파일 모드는 빈 점선 점, 닫힌 화면은 빈 실선 점).
   보드 머리와 같은 규칙이라 보드(BOARD_STYLE.css)는 이것을 그대로 쓴다. */
.mode { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
        color: var(--fg-muted); white-space: nowrap; }
.mode-dot { width: 9px; height: 9px; border: 1.5px solid var(--border); background: var(--ok); }
.mode.file .mode-dot { background: transparent; border-style: dashed; }
.mode.closed .mode-dot { background: transparent; }
/* 「이 화면 쓰는 법」 — 안내 네 줄과 CLI 세 줄. 윗줄 오른쪽 단추 아래에 겹쳐 열린다(ReviewExpand). */
.howto { position: relative; margin: 0; min-width: 0; max-width: 100%; }
.rv-top .howto > summary { display: inline-flex; align-items: center; gap: .3rem; min-height: 30px;
                           padding: 0 .55rem; background: transparent; border: 2px solid transparent;
                           font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
.rv-top .howto > summary:hover, .rv-top .howto[open] > summary { background: var(--bg-sunken); }
.rv-top .howto > summary::before { content: none; }
.rv-top .howto > summary::after { content: "\25BE"; font-size: 11px; color: var(--fg-subtle); }
.rv-top .howto[open] > summary::after { content: "\25B4"; }
.howto-body { position: absolute; right: 0; top: calc(100% + .4rem); z-index: 60;
              width: min(34rem, calc(100vw - 2.5rem)); padding: .85rem 1rem;
              background: var(--bg-elevated); border: var(--border-width) solid var(--border);
              box-shadow: var(--offset-lg); font-size: 13px; line-height: 1.55; color: var(--fg); }
.howto[open] > .howto-body { animation: kb-howto-in var(--t-quick) var(--ease-out) 1; }
.howto-label { margin: 0 0 .3rem; font-size: 12.5px; font-weight: 700; color: var(--fg-muted); }
.howto-list { margin: 0 0 .7rem; padding-left: 1.1rem; }
.howto-list > li { margin: .2rem 0; }
/* 명령은 판 안에서 줄을 바꿔 다 보인다 — 옆으로 밀면 카드 id 와 옵션이 판 밖에 숨는다. */
.howto-body pre { margin: 0; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.rv-title { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .5rem 1rem; margin: .65rem 0 0; }
.rv-title-text { flex: 1 1 20rem; min-width: 0; }
.rv-title h1 { margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: -.015em;
               overflow-wrap: anywhere; }
.rv-long { margin: .15rem 0 0; font-size: 14px; line-height: 1.45; color: var(--fg-muted); }
.rv-sub { margin: .1rem 0 0; font-size: 13px; line-height: 1.45; color: var(--fg-subtle); }
/* 부제 끝 「무엇을 바꿨고 무엇으로 확인했나 ↓」 — 맨 아래 근거 칸으로 가는 앵커(KAN-021 S11, 시안 Review). */
.rv-sub a { color: var(--fg-muted); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.rv-sub a:hover { color: var(--fg); }
/* 계획 리포트로 가는 단추 — 조용한 테 단추. 조작이 아니라 길이라 그림자를 안 준다. */
.rv-btn { display: inline-flex; align-items: center; min-height: 30px; padding: 0 .7rem;
          border: var(--border-width) solid var(--border); background: var(--bg-elevated);
          color: var(--fg); font-size: 13px; font-weight: 600; line-height: 1.2;
          text-decoration: none; white-space: nowrap; }
.rv-btn:hover { background: var(--bg-sunken); }
@keyframes kb-howto-in { 0% { opacity: 0; transform: translateY(-4px); } 100% { opacity: 1; transform: none; } }
/* 40rem 아래 「⋯」 메뉴(KAN-023 S1, 시안 `Review375`) — 넓은 화면에서는 감싸개가 투명하고(`display: contents`) 단추 · 사본이
   없어 윗줄 모양이 그대로다. 체크박스는 화면에서 감추되 키보드로는 닿게 둔다(포커스 테는 라벨이 진다). */
.rv-more { display: contents; }
.rv-more-t { position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none; }
.rv-more-b, .rv-plan-m { display: none; }

/* ─── 결정 헤더 — 판정에 필요한 것만 무게를 갖는다 ───────────────────────────
 * KPI 6~7칸이 같은 무게로 한 줄에 서던 자리다. 변경 파일 수와 수렴이 동급으로 보이면
 * 훑는 눈이 「지금 무엇을 정해야 하는가」를 못 찾는다(의뢰서 §6-1·§6-4). 헤더에 남는 것은
 * 셋뿐이다 — 수렴(「n / m 승인 · 반려 k」) · 항목 레일 · 다음 미해결. 문서 판정과 승계 수는 제목
 * 아래 부제로 갔고(KAN-021 S9 · S11), 나머지 사실(변경 파일·추가/삭제·커밋·태그)은 맨 아래 「무엇을
 * 바꿨고 무엇으로 확인했나」 칸 셋으로 내려간다(S11 — 헤더 밑 모노 한 줄 `.dh-meta` 를 갈음했다).
 * 사실을 지우는 것이 아니라 무게를 가르는 것이다.
 *
 * **REVIEW_CSS(report.py)가 아니라 여기 두는 이유**: 그쪽은 판정을 내릴 수 있는 문서에만
 * 실린다. 판정이 다른 문서로 넘어간 `승계됨` 검토서도 자기 항목과 수렴을 그대로 들고
 * 있어서, 거기 두면 그 화면에서만 헤더와 레일이 통째로 빠진다(의뢰서 §5-10). */
.dh { position: sticky; top: 0; z-index: 40;
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
      gap: .6rem 1.4rem; align-items: center; margin: .7rem 0 0; padding: .6rem .9rem;
      background: var(--bg-elevated); border: var(--border-width) solid var(--border);
      box-shadow: var(--offset-lg); }
.dh-cv { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .6rem; }
/* 숫자는 본문 글꼴의 고른 폭 숫자다(KAN-023 S4, 시안 `.conv__n`) — 모노 글꼴은 빗금 앞뒤가 넓어 「2 / 3」이 흩어졌다. */
.dh-cv b { font-family: var(--font-sans); font-variant-numeric: tabular-nums; font-size: 30px; line-height: 1;
           font-weight: 700; white-space: nowrap; }
/* 분모의 슬래시만 죽인다 — 「5 / 7」에서 눈이 잡아야 하는 것은 5 와 7 이다. */
.dh-cv b i { font-style: normal; color: var(--fg-subtle); }
.dh-sub { font-size: 12.5px; line-height: 1.4; color: var(--fg-muted); white-space: nowrap; }
.dh-rail { min-width: 0; }
.dh-act { display: grid; gap: .45rem; justify-items: end; }
/* 「다음 미해결」은 **앵커**다. 스크롤 위치 추적이나 목록 필터가 아니라 `#item-N` 으로
   뛰는 링크라, 이 화면의 `fetch` 자리를 하나도 안 늘린다(의뢰서 §5-2). 테두리까지 폭에 넣는다 —
   좁은 화면에서 `width: 100%` 를 받으면 안쪽 여백과 테두리만큼 헤더 상자 밖으로 넘쳤다(375 실측). */
.dh-next { box-sizing: border-box; border: var(--border-width) solid var(--border);
           background: var(--accent-2); color: var(--ink); box-shadow: var(--offset);
           text-decoration: none; padding: .4rem .85rem; font-weight: 700; font-size: 15px;
           line-height: 1.2; white-space: nowrap; }

/* ─── 항목 레일 — 칸 하나가 항목 하나 ────────────────────────────────────────
 * 수렴을 숫자로만 말하면 「아직 안 닫힌 항목으로 가는 길」이 화면에 없다(의뢰서 §6-1).
 * 항목 8개에 판정 12건이 붙은 문서에서 실제로 그랬다. 칸 안에 「n · 상태」 글을 적는다 —
 * 색만으로 상태를 말하지 않는다(시안 4절). 칸이 많으면 다음 줄로 넘어간다.
 *
 * 색은 `review-data` 가 항목마다 실어 보낸 `state` 를 **칠하기만** 한다. 도출 규칙을
 * 여기서 다시 쓰면 화면이 보드·validate 와 다른 말을 한다(SKILL.md 5.8 마지막 줄). */
.rail { display: flex; flex-wrap: wrap; gap: .4rem; }
.rail-c { flex: 1 1 5.5rem; min-width: 0; max-width: 12rem; height: 34px; box-sizing: border-box;
          display: block; padding: 0 .55rem;
          border: var(--border-width) solid var(--border);
          background: var(--bg-elevated); color: var(--fg); text-decoration: none;
          font-size: 12.5px; font-weight: 700; line-height: 30px; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; }
.rail-c b { font-family: var(--font-mono); font-size: 13px; }
/* 상태 5색 — 레일 칸이 쓴다. 기하는 `.rail-c` 가 지고 색만 여기서 준다. 항목 번호 칸은 KAN-023 S2(시안 `Review`)부터
   무색이고 항목 상태는 칩이 말한다 — 레일과 항목이 같은 항목을 다른 색으로 말할 일이 없다. */
.st-approved { background: var(--ok); color: var(--cream); }
.st-rejected { background: var(--danger); color: var(--cream); }
.st-noted    { background: var(--accent-3); color: var(--ink); }
.st-open     { background: var(--bg-sunken); color: var(--fg); }
/* 철회는 분모에서 빠진다 — 빈 판 + 취소선이라 색 다섯 중 어느 것도 안 쓴다. */
.st-retired  { background: var(--bg-elevated); color: var(--fg-subtle);
               text-decoration: line-through; }
/* 헤더의 「다음 미해결」이 가리키는 칸 — 칸 밑 4px 잉크 밑줄(시안 Review). 오프셋 그림자는 그
   칸을 「조작 중인 상자」로 읽히게 해서 버렸다. **스크롤 위치를 좇지 않는다** — 레일은 앵커
   장치라 그 자리를 안 늘린다. 그래서 「지금」을 버튼과 같은 칸으로 두고, 둘이 늘 같은 항목을
   가리키게 한다. */
.rail-cur { box-shadow: inset 0 -4px 0 var(--fg); }
/* 도착 — 「다음 미해결」 · 레일로 간 항목에 잉크 링이 한 번 퍼졌다 사라진다(공용 `kb-arrive`).
   CSS(`:target`)만이라 스크립트가 없는 정적 · 승계됨 문서에서도 돈다. 그 칸 밑 4px 막대는 항목마다
   선택자가 달라 렌더러가 문서마다 적는다(report.py `arrive_css`). 다른 항목에 도착했으면 「다음
   미해결」 칸의 밑줄은 내린다 — 「지금 여기」는 한 칸이다. 움직임 줄이기면 링은 꺼지고 막대만 남는다. */
#rv-list > li:target { animation: kb-arrive var(--t-arrive) var(--ease-out) 1; }
body:has(#rv-list > li:target) .rail-cur { box-shadow: none; }

/* ─── 접기 — 「여기 더 있다」의 단일 신호는 --bg-sunken 하나다 ───────────────
 * 접힌 조각의 바탕을 하나로 고정하면 훑는 눈이 그 색만 배우면 된다. 여는 줄에 개수를
 * 적는 것은 §4.5-2 의 「접기 안에만 있으면 없는 것과 같다」를 접힌 채로 지키기 위해서다.
 * 0건이면 애초에 안 그린다(§4.5-1) — 그 판단은 렌더러가 한다. */
details { margin: .7rem 0; }
details > summary { cursor: pointer; list-style: none;
                    background: var(--bg-sunken);
                    border: var(--border-width) solid var(--border);
                    padding: .4rem .8rem; font-family: var(--font-mono);
                    font-size: 13px; font-weight: 600; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "\25B8\00a0"; }
details[open] > summary::before { content: "\25BE\00a0"; }
.fold-n { float: right; color: var(--fg-subtle); font-weight: 400; }

/* h2 오른쪽에 집계를 다는 자리. 아래 잉크선은 h2 규칙이 그대로 준다. */
.h2-row { display: flex; justify-content: space-between; align-items: baseline;
          gap: 1rem; flex-wrap: wrap; }


/* ─── 항목 하나 — 띠마다 이름을 달고, 이름 칸 오른쪽 5px 가 그 자리의 색이다 ─────────
 * 옛 판은 승계 블록 · 상세 접기 · 판정 이력 · 의견 · 조작줄이 세로로 쌓이기만 했고,
 * 위계는 들여쓰기와 왼쪽 띠 색으로만 있었다. 스크롤하면 지금 보는 것이 누구의 무엇인지가
 * 흐려진다(의뢰서 §6-2). 왼쪽 76px 칸에 띠 이름을 달면 그 위계가 **읽히는 이름**을 갖는다.
 *
 * **띠 순서는 승계 → 보기 → 정할 것 → 판정 → 의견 → 배경이다**(KAN-021 S10, 시안 4절). 보기는
 * 있을 때만 맨 위(그림 240px 안팎), 판정 띠가 판정 단추 · 「추가 의견 달기」 · 짧은 판정 이력을
 * 함께 진다(따로 있던 「조작」 띠를 합쳤다). 배경은 판정 이력이 없으면 펼치고 생기면 접는다.
 *
 * 이름 칸은 본문 열 **밖**이다(grid 2열). 음수 마진으로 밀면 `pre`·표의 본문 폭이 그만큼
 * 줄어 좁은 열에서 가로 스크롤이 하나 더 생긴다 — §5-7 과 싸우는 자리다. 띠 사이는 가는
 * 칸막이(1.5px `--line-soft`)이고 2px 잉크선은 항목 상자 바깥과 머리 아래에만 남는다(S1 규칙).
 *
 * 색 규약은 그대로다 — 승계=핑크 · 근거(보기 · 정할 것 · 배경)=골드 · 조작(판정 띠)=그린. 판정
 * 이력만 서는 판정 띠(승계됨 · 닫힌 화면)와 의견 띠는 색이 없다(`--bandc` 없음 = 투명). 시안은
 * 의견 띠에 핑크를 썼지만 핑크 띠는 승계 전용이라 옮기지 않았다(위 역할 주석). */
#rv-list { list-style: none; padding-left: 0; display: grid; gap: .9rem; margin: .75rem 0 1rem; }
/* 앵커로 도착한 항목이 붙은 결정 헤더 밑에 숨지 않게 — 도착 링(5px)까지 보이도록 조금 더 띄운다. */
#rv-list > li { margin: 0; scroll-margin-top: calc(var(--dh-h) + .6rem); }
/* 항목 상자에는 그림자가 없다 — 그림자는 지금 조작하는 자리(결정 헤더 · 트레이 · 판)에만(시안 Main 1 「그림자는
   지금 조작하는 자리에만」, KAN-021 S19 대조). 항목 사이는 테와 간격이 가른다. */
.jd { background: var(--bg-elevated); border: var(--border-width) solid var(--border); }
/* 띠 이름 · 항목 안 메타는 본문 글꼴이다 — 모노 대문자는 기술 정보 · 명령 · 경로에만(시안 2.4-3). */
.jd .meta { font-family: var(--font-sans); font-size: 12.5px; letter-spacing: 0; text-transform: none;
            font-weight: 500; }
/* 헤더줄은 항목 안에서 sticky — 긴 항목을 스크롤해도 「누구의 무엇」이 위에 남는다.
   결정 헤더 바로 밑에 서고 그보다 낮은 층이라 겹칠 때 헤더가 이긴다. */
.jd-head { display: grid; grid-template-columns: auto auto auto minmax(0, 1fr) auto;
           gap: .3rem .5rem; align-items: center; padding: .55rem .8rem;
           background: var(--bg-elevated);
           border-bottom: var(--border-width) solid var(--border);
           position: sticky; top: var(--dh-h); z-index: 20; }
/* 머리 배치(KAN-023 S2, 시안 `Review`) — 번호 칸 | 제목, 그 아래 상태 칩(+ 「방금 바뀜」 꼬리표), 그 아래 인용 · 오른쪽 위 「의견 n」.
   마크업은 납작하게 둔다(번호 · 제목 · 칩 · 수 · 인용 차례) — 화면 스크립트가 `.jd-head > .tag` 뒤에 꼬리표를 붙이고,
   시험이 머리를 첫 `</div>` 까지로 자른다. 자리는 격자 칸으로만 옮긴다. */
.jd-head > .jd-num { grid-column: 1; grid-row: 1 / span 2; align-self: start; }
.jd-head > .jd-title { grid-column: 2 / 5; grid-row: 1; }
.jd-head > .tag { grid-column: 2; grid-row: 2; justify-self: start; }
.jd-head > .jd-ctag { grid-column: 3; grid-row: 2; justify-self: start; }
.jd-head > .meta { grid-column: 5; grid-row: 1; align-self: start; }
.jd-head > .jd-quote { grid-column: 2 / -1; grid-row: 3; }
/* 번호 칸은 무색이다 — 상태는 칩과 레일 칸이 말한다(시안 `Review` · `.item__n`). */
.jd-num { width: 26px; height: 26px; display: grid; place-items: center;
          border: var(--border-width) solid var(--border); background: var(--bg);
          font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
.jd-title { font-size: 17px; font-weight: 700; line-height: 1.35; }
.jd-head .meta { margin: 0; white-space: nowrap; }
/* 머리 인용 — 반려 · 추가 의견 항목에 최신 추가 의견의 첫 문장을 원문 그대로(지어낸 요약이 아님).
   주제 열부터 오른쪽 끝까지 한 줄을 쓴다. 누가 · 언제는 옅은 글로 뒤에 붙는다. */
.jd-quote { grid-column: 2 / -1; margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--fg); }
.jd-quote q { quotes: "\300C" "\300D"; font-weight: 600; }
.jd-who { font-size: 12px; color: var(--fg-subtle); }
.jd-band { display: grid; grid-template-columns: 76px minmax(0, 1fr);
           border-top: 1.5px solid var(--line-soft); }
/* 헤더줄(또는 접힘 줄)이 이미 아래 잉크선을 그렸다 — 첫 띠가 칸막이를 또 그리면 두 겹이 된다. */
.jd-head + .jd-band, summary + .jd-band { border-top: 0; }
.jd-g { padding: .75rem 0 .75rem .85rem; font-size: 12px; font-weight: 700; line-height: 1.4;
        color: var(--fg-muted); border-right: 5px solid var(--bandc, transparent); }
.jd-body { min-width: 0; padding: .7rem 1rem .75rem; }
.jd-body > :first-child { margin-top: 0; }
.jd-body > :last-child { margin-bottom: 0; }
.jd-band-inh { --bandc: var(--accent-3); }
.jd-band-ctx { --bandc: var(--accent); }
/* 판정 띠에 조작이 있을 때(판정할 수 있는 문서)만 그린 띠다. 정적 모드의 질감은 REVIEW_CSS 가 준다. */
.jd-band-ops { --bandc: var(--accent-2); }
.jd-band .inh { border-left: 0; margin: 0; }
/* 「정할 것」 — 무엇을 고르는가 한 줄을 조금 크게, 그 아래 갈래 상자. */
.jd-band-dec .jd-body > p { margin: 0 0 .5rem; font-size: 15px; font-weight: 600; line-height: 1.5; }
/* 갈래 상자(KAN-021 S10) — 선택지 표의 행 하나가 상자 하나. 첫 열은 제목, 나머지 열은 머리글을 이름으로
   단 dt/dd. 추천은 「추천」 칩 + 굵은 테(2px 잉크)이고 나머지는 가는 칸막이 테다. 폭이 모자라면 저절로
   다음 줄로 내려가고, 40rem 아래에서는 한 열로 쌓는다(아래 좁은 화면 규칙 — 스크립트 없이).
   **여기(REPORT_STYLE)에 두는 이유**는 정할 것이 `승계됨` 문서에도 보이기 때문이다 — REVIEW_CSS 는
   판정을 내릴 수 있는 문서에만 실리므로 거기 두면 그 화면에서만 상자가 통째로 무너진다(§5-10). */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(13rem, 100%), 1fr));
        gap: .6rem; margin: .1rem 0 0; }
.opt { min-width: 0; display: flex; flex-direction: column; gap: .35rem; padding: .6rem .75rem;
       border: 1.5px solid var(--line-soft); background: var(--bg); }
.opt-rec { border: var(--border-width) solid var(--border); background: var(--bg-elevated); }
.opt-t { margin: 0; font-size: 14px; font-weight: 700; line-height: 1.45; overflow-wrap: anywhere; }
.opt-chip { margin-right: .15rem; font-family: var(--font-sans); font-weight: 600; background: transparent;
            color: var(--fg-muted); }
.opt dl { display: grid; grid-template-columns: fit-content(6.5em) minmax(0, 1fr); gap: .2rem .6rem;
          margin: 0; font-size: 13px; line-height: 1.5; }
.opt dt { color: var(--fg-subtle); font-weight: 600; }
.opt dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
/* 「배경」 — 판정 이력이 없으면 펼치고 생기면 접는 띠(`<details>`). 여는 줄이 이름 칸과 같은 두 열이고,
   머리 문단(없으면 첫 사실) · 「사실 n줄 · 원문 m곳」 · 접은 까닭을 적는다. 머리 문단은 펼치면 바로 아래
   본문에 있으므로 펼친 동안 숨긴다. 전역 접기 모양(가라앉은 바탕 · 모노 · 테)은 여기서 끈다 — 띠는 접힘
   단추가 아니라 항목의 한 칸이다. */
details.jd-band-bg { display: block; margin: 0; }
.jd-band-bg > summary { display: grid; grid-template-columns: 76px minmax(0, 1fr); min-height: 44px;
                        padding: 0; background: none; border: 0; font-family: var(--font-sans);
                        font-size: 13.5px; font-weight: 500; }
/* 전역 표식(▸ · ▾)을 끈다. 펼친 쪽 전역 규칙(`details[open] > summary::before`)이 특이도가 더 높아
   `[open]` 까지 함께 적는다 — 안 적으면 펼칠 때만 표식이 grid 칸 하나를 차지해 여는 줄이 무너진다. */
.jd-band-bg > summary::before, .jd-band-bg[open] > summary::before { content: none; }
.jd-band-bg > summary:hover { background: var(--bg-sunken); }
.jd-sum { display: flex; align-items: center; gap: .5rem; min-width: 0; padding: .35rem 1rem; }
.jd-sum::before { content: "\25B8"; flex: none; font-size: 11px; color: var(--fg-subtle); }
.jd-band-bg[open] .jd-sum::before { content: "\25BE"; }
.jd-sum-lead { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jd-band-bg[open] .jd-sum-lead { display: none; }
.jd-sum-n { flex: none; font-size: 12.5px; color: var(--fg-subtle); }
.jd-band-bg > .jd-body { padding: 0 1rem .85rem calc(76px + 1rem); }
/* 「배경」의 사실 목록 — 사실 하나가 한 칸이다. 칸 사이 가는 선은 사실의 경계를 눈으로 가르는
   자리다(줄글에서 사라지던 것). */
.jd-facts { list-style: none; margin: 0; padding: 0; }
.jd-facts > li { padding: .4rem 0; border-top: 1px solid var(--bg-sunken); font-size: 14.5px; line-height: 1.6; }
.jd-facts > li:first-child { border-top: 0; padding-top: 0; }
.jd-facts > li::before { content: "·"; font-weight: 700; margin-right: .45rem; color: var(--fg-subtle); }
/* 출처는 배경 끝의 「원문 자리 n곳」 접힘 하나에 모인다 — 사실을 먼저 훑고 근거는 확인할 때만 연다. */
details.jd-srcs { margin: .55rem 0 0; }
.jd-srcs > summary { display: inline-block; padding: .15rem .1rem; background: none; border: 0;
                     font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--fg-muted); }
.jd-src { display: block; padding: .1rem 0 .1rem 1.1rem; font-family: var(--font-mono);
          font-size: 12px; color: var(--fg-subtle); overflow-wrap: anywhere; }
/* 보기가 「없음」이라 띠를 안 그린 항목 — 그 이유 한 줄은 배경 끝에 남는다(지우지 않는다). */
.jd-view-none { margin: .6rem 0 0; font-size: 13px; color: var(--fg-muted); }
/* 「쓸 수 있다는 사실까지가 인터페이스」(§4.5-3) — 0건 자리는 비우지 않고 점선으로 낸다.
   점선을 쓰는 것은 이 자리가 상태가 아니라 **빈 자리**이기 때문이다. */
/* 「보기」 — 항목 맨 위, 있을 때만. 토큰은 새로 안 만든다. 결과물 비교는 나란히 놓되, 폭이 모자라면
   `auto-fit` 이 저절로 세로로 쌓으므로 좁은 화면 규칙을 따로 두지 않는다. */
.jd-view-kind { margin: 0 0 .5rem; font-size: 14px; }
.jd-figs { display: grid; gap: .6rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
.jd-figs-cmp { grid-template-columns: repeat(auto-fit, minmax(min(14rem, 100%), 1fr)); }
.jd-fig { margin: 0; min-width: 0; border: var(--border-width) solid var(--border);
          background: var(--bg); }
/* 그림은 높이 240px 안팎(정할 것 3) — 세로 스크린샷을 폭에 맞추면 항목이 끝없이 길어지고 판정 단추가
   첫 화면 밖으로 밀린다. 비율은 지키고(`contain`), 원본은 그림을 누르면 열린다. */
.jd-fig img, .jd-fig video { display: block; width: 100%; height: auto; max-height: 240px;
                             object-fit: contain; overflow: hidden; }
.jd-fig figcaption { padding: .4rem .6rem; font-size: 13.5px; background: var(--bg-elevated);
                     border-top: var(--border-width) solid var(--border); }
.jd-empty { border: 2px dashed var(--fg-subtle); color: var(--fg-subtle);
            padding: .45rem .7rem; margin: 0; font-size: 14px; }
/* 판정 띠의 짧은 판정 이력 — 「판정 이력 · 1회차 반려 유저 · 11-12」 한 줄(시안 4절). 왕복은 다 싣는다.
   조작이 위에 있으면 가는 칸막이로 가른다. 빈 이력은 점선 상자가 아니라 같은 줄의 글이다. */
.jd-hist { display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem .8rem; margin: 0;
           font-size: 12.5px; line-height: 1.6; color: var(--fg-muted); }
.rv-ops + .jd-hist { margin-top: .6rem; padding-top: .45rem; border-top: 1.5px solid var(--line-soft); }
.jd-hist-l { font-weight: 700; }
.jd-hist .jd-empty { border: 0; padding: 0; font-size: inherit; }
.jd-vs, .jd-ns { list-style: none; margin: 0; padding: 0; }
.jd-vs { display: flex; flex-wrap: wrap; gap: .15rem .9rem; }
.jd-vs > li { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .4rem; margin: 0; }
.jd-vs > li > .meta { font-size: inherit; color: var(--fg-muted); }
.jd-vs > li > .meta:first-child { font-weight: 700; color: var(--fg); }
.jd-vs .tag { font-size: 11.5px; }
.jd-vtext { color: var(--fg); }
.jd-vs > li .meta, .jd-ns > li .meta { margin: 0; }
.jd-ns { display: grid; gap: .3rem; }
.jd-ns > li { margin: 0; border-left: 5px solid var(--accent); padding: .2rem 0 .2rem .7rem;
              font-size: 14.5px; line-height: 1.6; }
/* 이전 의견 접힘(KAN-023 S3, 시안 `Review` 의견 띠) — 펴 둔 최신 의견 아래 작은 글 한 줄(「이전 의견 n개 · 누가 · 언제」).
   펴면 지난 의견이 오래된 순으로 조금 작게 들여 선다. 띠 안의 접힘이라 전역 접기의 바탕 · 테는 끈다. */
.jd-ns-old { margin: .35rem 0 0; }
.jd-ns-old > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 0 .5rem; min-height: 30px; padding: 0;
                       background: none; border: 0; font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
.jd-ns-old > summary > .meta { margin: 0; font-weight: 400; color: var(--fg-muted); }
.jd-ns-prev { margin-top: .3rem; padding-left: 17px; }
.jd-ns-prev > li { font-size: 13px; }

/* ─── 닫힌 항목은 한 줄로 접힌다 ──────────────────────────────────────────────
 * §4.5-1 의 「0건이면 안 그린다」를 「**닫혔으면 안 펼친다**」로 연장한 것이다. 판정이 난
 * 항목은 다시 읽을 자리가 아니라 「이건 끝났다」만 확인하는 자리라, 번호·주제·상태·판정
 * 수 한 줄이면 그 확인이 끝난다. 항목 8 · 판정 12 짜리 문서가 한 판에 들어오는 것이
 * 이 규칙의 값이다(의뢰서 §6-1).
 *
 * **접되 지우지 않는다** — 펴면 열린 항목과 한 글자도 다르지 않은 내용이 나온다.
 * 줄 바탕은 열린 항목 머리와 같은 흰 바탕이다(KAN-023 S4, 시안 `ReviewSaved` 닫힌 항목) — 전역 접기의 가라앉은 바탕을 덮는다. */
.jd-fold > summary { display: grid;
                     grid-template-columns: auto auto auto minmax(0, 1fr) auto auto;
                     gap: .5rem; align-items: center; font-family: var(--font-sans);
                     font-size: 15px; font-weight: 400; border: 0; background: var(--bg-elevated);
                     border-bottom: var(--border-width) solid var(--border); }
/* 전역 접기 표식(▸)을 여기서는 끈다 — grid 컨테이너 안의 `::before` 는 칸 하나를 차지해
   네 칸짜리 줄을 통째로 밀어낸다. 대신 오른쪽 끝의 「펴기/접기」가 같은 말을 한다. */
.jd-fold > summary::before, .jd-fold[open] > summary::before { content: none; }
/* 닫힌 줄 배치(KAN-023 S2, 시안 `Review` · `.item--closed`) — 번호 · 칩 · (꼬리표) · 제목 · 「누가 · 언제」 · 펴기. 머리와 같은
   마크업(번호 · 제목 · 칩 · 수)을 격자 칸으로 다시 놓는다. 제목은 한 줄로 줄인다. 줄은 1 로 못 박는다 — 칸만 주면
   격자가 마크업 차례(제목 4 칸 뒤에 칩 2 칸)대로 놓다가 앞 칸으로 돌아가려고 줄을 내려, 칩이 둘째 줄로 갔다. */
.jd-fold > summary > * { grid-row: 1; }
.jd-fold > summary > .jd-num { grid-column: 1; }
.jd-fold > summary > .tag { grid-column: 2; }
.jd-fold > summary > .jd-ctag { grid-column: 3; }
.jd-fold > summary > .jd-title { grid-column: 4; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
                                 font-size: 14.5px; color: var(--fg-muted); }
.jd-fold > summary > .meta { grid-column: 5; }
.jd-fold > summary > .jd-tog { grid-column: 6; }
.jd-tog::after { content: "펴기"; }
.jd-fold[open] .jd-tog::after { content: "접기"; }
/* 접힌 항목은 정말 한 줄이다 — 전역 `details` 바깥 여백(.7rem)이 머리 위아래에 빈 띠를 남기고, 머리 밑줄이 항목 테와
   겹쳐 두 줄로 보였다(KAN-021 S19 대조, 시안 Review · ReviewSaved). 펴면 머리 밑줄이 몸과 가른다. */
.jd-fold { margin: 0; }
.jd-fold:not([open]) > summary { border-bottom: 0; }

/* ─── 검토 아랫부분 — 닫은 뒤 판 · 문서 판정 판 · 근거 칸 셋(KAN-021 S11, 시안 Review · ReviewSaved ·
 * ReviewClosed · ReviewFileDoc) ───────────────────────────────────────────────────────────
 * **여기(REPORT_STYLE)에 두는 이유**는 결정 헤더와 같다. 「문서가 승인되었습니다」 판과 「이 검토 화면을
 * 닫았습니다」 판은 닫힌 마지막 화면에 서고, 근거 칸 셋은 승계됨 문서에도 선다 — 그 두 화면에는 REVIEW_CSS
 * 가 안 실린다. 판 안의 조작(「문서 전체 승인」 단추)과 「전체 반려」 줄 · 새 항목 폼은 판정할 수 있는 문서에만
 * 있으므로 REVIEW_CSS 가 진다. */
/* 닫은 뒤 마지막 화면의 판 — 결정 헤더 바로 아래, 맨 위(motion.md 「저장하고 닫기」 kb-rise). */
.rv-closed { margin: .9rem 0 0; padding: .75rem 1rem; border: var(--border-width) solid var(--border);
             background: var(--bg-elevated); font-size: 13.5px; line-height: 1.6;
             animation: kb-rise var(--t-move) var(--ease-out) 1 both; }
.rv-closed b { font-weight: 700; }
/* 문서 전체 판정 판 — 살아 있는 항목이 모두 승인이고 문서가 아직일 때(초록 + 「문서 전체 승인」), 문서가 이미
   승인됐을 때(상태 판). 그 밖에는 렌더러가 판을 안 그린다. 초록 바탕은 두 테마에서 같은 값이라 글도 잉크로
   고정한다(`.dh-next` 와 같은 짝). 섬은 한 번 튀어 오른다(motion.md 「문서 전체 승인이 섬」 ease-snap). */
.rv-allok { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin: .9rem 0 0;
            padding: .85rem 1rem; border: 3px solid var(--border); background: var(--accent-2);
            color: var(--ink); box-shadow: var(--offset-lg);
            animation: kb-rise var(--t-move) var(--ease-snap) 1 both; }
.rv-allok-text { flex: 1 1 24rem; min-width: 0; }
.rv-allok h3 { margin: 0; font-size: 17px; line-height: 1.35; color: var(--ink); }
.rv-allok p { margin: .2rem 0 0; font-size: 13.5px; line-height: 1.55; color: var(--ink); }
/* 세션에 보낼 문장 — 허브 「판정 처리」 단추가 보내는 원문 그대로. 따로 한 줄이라 그대로 골라 옮긴다. */
.rv-allok .rv-allok-say { margin-top: .4rem; font-size: 14.5px; font-weight: 700; overflow-wrap: anywhere; }
.rv-allok-act { display: flex; align-items: center; gap: .5rem; }
.rv-allok .rv-btn { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.rv-allok .rv-btn:hover { background: var(--ink-hover); }

/* 「무엇을 바꿨고 무엇으로 확인했나」 — 칸 셋(검증 기준 n줄 · 실행 결과 첨부 n줄 + 마지막 줄 원문 · 바뀐 크기)이
   접힘의 여는 줄 안에 있다. 칸을 누르면 펼친다(스크립트 없이). 칸 안 수는 형식만 센 것이고, 원문은 펼침
   안에 있다. 전역 접기 모양(가라앉은 바탕 · 모노 · 테)은 여기서 끈다 — 여는 줄이 단추가 아니라 칸 셋이다. */
/* 부제 끝 링크로 도착하면 붙은 결정 헤더 밑에 절 머리가 숨지 않게 띄운다(항목 앵커와 같은 토큰). */
.ev { margin: 2.2rem 0 0; scroll-margin-top: calc(var(--dh-h) + .6rem); }
.ev > h2 { margin: 0 0 .6rem; padding: .75rem 0 0; font-size: 20px; line-height: 1.3;
           border-bottom: 0; border-top: 3px solid var(--border); }
details.ev-fold { margin: 0; }
.ev-fold > summary { display: block; padding: 0; background: none; border: 0;
                     font-family: var(--font-sans); font-size: 14px; font-weight: 400; }
.ev-fold > summary::before, .ev-fold[open] > summary::before { content: none; }
.evid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
.evid-cell { display: flex; flex-direction: column; gap: .2rem; min-width: 0; padding: .6rem .75rem;
             border: 1.5px solid var(--line-soft); background: var(--bg-elevated); }
.ev-fold > summary:hover .evid-cell { border-color: var(--border); }
.evid-l { font-size: 12px; font-weight: 700; line-height: 1.4; color: var(--fg-muted); }
.evid-big { font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.evid-sub { font-size: 12.5px; line-height: 1.5; color: var(--fg-muted); }
/* 마지막 줄 원문 — 칸 안에서는 세 줄까지, 넘치면 말줄임(전문은 펼침 안 「실행 결과」). */
.evid-last { font-size: 12.5px; line-height: 1.5; color: var(--fg-muted); overflow-wrap: anywhere;
             display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ev-more { display: flex; flex-wrap: wrap; align-items: center; gap: .2rem .6rem; min-height: 40px;
           margin-top: .6rem; padding: 0 .75rem; border-top: 1.5px solid var(--line-soft);
           font-size: 14px; font-weight: 600; }
.ev-more::before { content: "\25B8"; font-size: 11px; color: var(--fg-subtle); }
.ev-fold[open] .ev-more::before { content: "\25BE"; }
.ev-tog::after { content: "펼치기"; }
.ev-fold[open] .ev-tog::after { content: "접기"; }
.ev-meta { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--fg-subtle); }
.ev-fold > summary:hover .ev-more { background: var(--bg-sunken); }
.ev-body { padding: .2rem 0 .4rem; }
.ev-part h3 { margin: 1.1rem 0 .4rem; font-size: 15px; }
.ev-n { margin-left: .4rem; font-size: 12.5px; font-weight: 500; color: var(--fg-subtle); }
/* 실행 결과는 제 상자 안에서 가로로 민다 — 문서 폭을 밀지 않는다(375 넘침 0). */
.ev-run { margin: 0; max-width: 100%; font-size: 12px; line-height: 1.6; white-space: pre; overflow-x: auto; }

@media (max-width: 40rem) {
  h1 { font-size: 30px; } h2 { font-size: 24px; }
  body { padding: 1.5rem .75rem 3rem; }

  /* ─── 40rem 이하 — 375px 에서 실제로 판정할 수 있는가 ──────────────────────
   * **sticky 를 끈다.** 결정 헤더는 이 폭에서 세로로 쌓여 150px 안팎이고(수렴 · 레일 · 「다음
   * 미해결」 세 줄), 그 밑에 항목 머리줄(긴 주제 · 머리 인용)이 또 180px 안팎으로 붙는다 — 둘을 붙여
   * 두면 812px 뷰포트의 40% 가 고정되어 판정할 것이 절반 남짓만 남는다(KAN-019.19 375×812 실측 149px ·
   * 184px, KAN-021 S14. 옛 헤더는 400px 을 넘었다). `--dh-h` 를 0 으로 덮으면 `top` 과
   * `scroll-margin-top` 이 함께 따라온다 — 토큰 하나로 묶어 둔 값이 여기서 값을 한다. */
  :root { --dh-h: 0rem; }
  .dh { grid-template-columns: minmax(0, 1fr); gap: .6rem; position: static; }
  .dh-sub { white-space: normal; }
  /* 「다음 미해결」만 손가락 폭으로 늘린다 — 헤더 상자 안에서(`box-sizing` 은 위 규칙). */
  .dh-act { justify-items: stretch; }
  .dh-next { display: grid; place-items: center; min-height: 44px; text-align: center;
             width: 100%; }
  .jd-head { position: static; }

  /* 레일 칸은 「n · 상태」 글이 들어가는 폭으로 줄바꿈한다. */
  .rail-c { flex-basis: 4.75rem; height: 32px; line-height: 28px; }

  /* 윗줄 — 경로는 「‹ <레포> 보드」 하나로 줄인다(시안 `Review375`). 카드 이름은 바로 아래 제목이 같은 말이고,
     「검토」는 부제 첫 낱말이 말한다 — 지우는 것이 아니라 이 폭에서만 접는다. 그러면 경로 · 모드가 한 줄,
     쓰는 사람 · 「이 화면 쓰는 법」이 다음 한 줄이다. 「이 화면 쓰는 법」은 겹쳐 열지 않고 그 자리에서 아래로
     펼친다 — 오른쪽에 붙여 겹치면 줄이 바뀐 단추 밑에서 화면 왼쪽 밖으로 나간다. */
  .crumbs > :not(:first-child) { display: none; }
  .crumbs > :first-child::before { content: "\2039\00a0"; }
  .crumbs a { display: inline-flex; align-items: center; min-height: 44px; }
  .rv-top .howto > summary, .rv-btn { min-height: 44px; }
  .howto[open] { flex: 1 1 100%; }
  .howto-body { position: static; width: auto; margin-top: .4rem; }
  .rv-title h1 { font-size: 22px; }
  /* 「⋯」 메뉴(KAN-023 S1) — 경로 · 모드 · 「⋯」 한 줄. 쓰는 사람 · 「이 화면 쓰는 법」 · 계획 리포트는 메뉴 안이고, 긴 제목과
     부제 뒤쪽(칸 · 문서 상태 · 근거 앵커)은 이 폭에서만 접는다. 부제는 「검토 요청 · 날짜 · 항목 n」 한 줄이다. */
  .rv-more-b { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px;
               border: var(--border-width) solid var(--border); background: var(--bg-elevated);
               font-size: 18px; font-weight: 700; line-height: 1; cursor: pointer; }
  .rv-more-t:checked + .rv-more-b { background: var(--bg-sunken); }
  .rv-more-t:focus-visible + .rv-more-b { outline: 2px solid var(--focus); outline-offset: 2px; }
  .rv-more { display: none; }
  .rv-more-t:checked ~ .rv-more { display: flex; flex-direction: column; align-items: flex-start; gap: .4rem;
                                  flex: 1 1 100%; padding: .2rem 0 .1rem; }
  .rv-plan-m { display: inline-flex; }
  .rv-title > .rv-btn, .rv-long, .rv-sub-rest, .crumb-proj { display: none; }

  /* **이름 칸이 사라지고 띠 이름이 머리글로 올라간다**(시안 `Review375`). 76px 을 유지하면 본문 열이
     눌려 `pre` 와 상자가 저마다 가로 스크롤을 하나씩 더 만든다 — §5-7 이 막으려는 것이 바로 그
     상태다. 이름은 위로 올라가고, 띠 색은 이름 앞 12×5px 막대가 진다(사라지지 않는다). */
  .jd-band { grid-template-columns: minmax(0, 1fr); }
  .jd-g { display: flex; align-items: center; gap: 6px; padding: .6rem .75rem 0; border-right: 0; }
  .jd-g::before { content: ""; flex: none; width: 12px; height: 5px; background: var(--bandc, transparent); }
  .jd-body { padding: .4rem .75rem .65rem; }
  .jd-band-bg > summary { grid-template-columns: auto minmax(0, 1fr); }
  .jd-band-bg > summary .jd-g { padding-bottom: .6rem; }
  .jd-sum { padding: .35rem .75rem .35rem .25rem; }
  .jd-band-bg > .jd-body { padding: 0 .75rem .7rem; }
  /* 「원문 자리 n곳」 접힘도 누를 자리다 — 44px(KAN-021 S14). 글 줄 높이는 그대로 두고 여는 줄만 키운다. */
  .jd-srcs > summary { display: inline-flex; align-items: center; min-height: 44px; }
  /* 갈래 상자는 한 열로 쌓는다 — 정적 문서라 스크립트 없이 CSS 한 줄로(시안 `Review375`). 상자 안
     이름|값 두 열은 그대로 둔다 — 값이 한 줄 아래로 내려가면 갈래 하나가 화면 절반을 먹는다. */
  .opts { grid-template-columns: minmax(0, 1fr); }
  .opt-t { font-size: 13.5px; }
  /* 헤더줄·접힘 줄도 두 열로 접는다 — 번호|주제 / 상태|개수 / 인용 / 펴기. */
  /* 375 머리(KAN-023 S2, 시안 `Review375`) — 번호 · 칩 · (꼬리표) · 오른쪽 「의견 n」이 한 줄, 그 아래 제목, 그 아래 인용. */
  .jd-head, .jd-fold > summary { grid-template-columns: auto auto auto minmax(0, 1fr) auto; row-gap: .3rem; }
  .jd-head > .jd-num, .jd-fold > summary > .jd-num { grid-row: 1; }
  .jd-head > .tag, .jd-fold > summary > .tag { grid-column: 2; grid-row: 1; }
  .jd-head > .jd-ctag, .jd-fold > summary > .jd-ctag { grid-column: 3; grid-row: 1; }
  .jd-head > .meta, .jd-fold > summary > .meta { grid-column: 5; grid-row: 1; justify-self: end; }
  .jd-head > .jd-title, .jd-fold > summary > .jd-title { grid-column: 1 / -1; grid-row: 2; }
  .jd-head > .jd-quote { grid-column: 1 / -1; grid-row: 3; }
  .jd-fold > summary > .jd-tog { grid-column: 1 / -1; grid-row: 3; justify-self: start; }
  .jd-ns-old > summary { min-height: 44px; }

  /* 근거 칸 셋은 한 열로 쌓고(시안 `Review375` 규칙), 판 안의 글과 단추도 세로로. */
  .evid { grid-template-columns: minmax(0, 1fr); }
  .ev-meta { margin-left: 0; }
  /* 펼침 안의 접힘(커밋 · 롤백 태그 · 기술 정보 · 문서 판정 이력)도 여는 줄이 44px 이다. */
  .ev-body > details > summary { padding-top: .6rem; padding-bottom: .6rem; }
  .rv-allok { flex-direction: column; align-items: stretch; }
  .rv-allok-text { flex-basis: auto; }
  .rv-allok .rv-btn { min-height: 44px; justify-content: center; }
}

/* ─── 움직임 — 세 화면이 함께 쓰는 키프레임 ─────────────────────────────────
 * 화면 배치에 묶인 것(서랍이 들어옴 · 결과판이 내려옴)은 그 화면의 CSS 가 진다. 시간과
 * 곡선은 위 움직임 토큰으로만 준다. 되풀이하는 움직임은 없다 — 모두 한 번.
 *
 *   kb-trace     「방금 바뀜」 바탕이 한 번 잦아듦(첫 색 `--changed-wash`)
 *   kb-land      위 6px 에서 내려앉음(새 카드 · 유령)
 *   kb-arrive    잉크 링 5px 이 퍼졌다 사라짐(「다음 미해결」로 도착)
 *   kb-snapback  오른쪽 28px 에서 제자리로(완료로 옮기기 거부)
 *   kb-rise      아래 10px 에서 올라오며 나타남(트레이 · 판 · 375 시트)
 *   kb-count     숫자가 위에서 새 값으로(수렴 · 칸 숫자) */
@keyframes kb-trace { 0% { background-color: var(--changed-wash); } 100% { background-color: var(--bg-elevated); } }
@keyframes kb-land { 0% { transform: translateY(-6px); } 100% { transform: none; } }
@keyframes kb-arrive { 0% { box-shadow: 0 0 0 0 var(--fg), var(--offset-lg); } 30% { box-shadow: 0 0 0 5px var(--fg); } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes kb-snapback { 0% { transform: translateX(28px); } 100% { transform: none; } }
@keyframes kb-rise { 0% { transform: translateY(10px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes kb-count { 0% { transform: translateY(-40%); opacity: 0; } 100% { transform: none; opacity: 1; } }

/* 움직임 줄이기 — **이 파일 한 곳에만 둔다.** 보드(BOARD_STYLE.css)와 검토(REVIEW_CSS)가 이
 * 파일을 먼저 싣고 그 위에 얹으므로 여기 하나로 세 화면이 다 꺼진다. `!important` 라 뒤에
 * 오는 규칙의 전환도 이긴다. Web Animations API(`el.animate`)는 CSS 로 안 꺼지므로 스크립트가
 * matchMedia 로 따로 막는다. 움직임 대신 남는 표시(바뀐 것의 테 · 「방금 바뀜」 꼬리표 ·
 * 저장 전 점선)는 그대로 남는다. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto !important; }
}

/* manage-kanban 보드 뷰 — REPORT_STYLE.css 위에 얹는다(토큰은 그쪽이 정의한다).
 *
 * 리포트는 읽는 문서라 62rem 한 단이면 되지만, 보드는 5칸을 나란히 놓는 화면이다(40rem 아래는
 * 칸 탭으로 한 칸씩). 그래서 여기서 하는 일은 셋뿐이다 — 폭을 풀고, 칸/카드 레이아웃을 얹고,
 * 겹치는 층(상세 서랍 · 저장 전 트레이 · 충돌 판)을 만든다. 관계는 선을 긋지 않고 테와 낱말
 * 꼬리표로 말한다. 색·테두리·그림자 모티프는 한 글자도 새로 정의하지 않는다.
 */

body { padding: 0; overflow-x: hidden; background: var(--bg); color: var(--fg); }
* { box-sizing: border-box; }
/* 이 화면은 읽는 문서가 아니라 조작하는 도구다 — 키보드로 짚은 자리가 보여야 한다.
   잉크 3px(`--focus`) — 골드 바탕(「내 차례」 칩 · 트레이 머리) 위에서도 보인다. */
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
/* 숫자가 세로로 줄 서는 자리(진행률·카드 수·대기 건수)는 폭이 흔들리면 안 된다. */
.n, .chip, .meta, .tray ol { font-variant-numeric: tabular-nums; }
/* 움직임 줄이기 규칙은 REPORT_STYLE.css 한 곳이 진다 — 이 파일은 그 위에 얹힌다. */
button { font-family: inherit; font-size: 14px; color: var(--fg); cursor: pointer;
         background: var(--bg-elevated); border: var(--border-width) solid var(--border);
         border-radius: 0; padding: .3rem .7rem; }
/* 골드는 「사람 차례」(내 차례 칩 · 진행 중 칸 띠) 하나만 말한다 — 누를 자리의 호버 · 눌림은
   잉크와 가라앉은 바탕으로 낸다(시안 2.1-4). */
button:hover { background: var(--bg-sunken); color: var(--fg); }
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
button:disabled { opacity: .45; cursor: not-allowed; }
/* 누를 자리 셋 — 기본(테 두른 단추) · 주 단추(잉크 바탕 — 「저장 · n건」처럼 그 자리의 마지막 한 수) ·
   조용한 단추(테 없음 — 「모두 취소」 · 「결과 접기」). 줄 안의 「취소」는 밑줄 글 단추(`.link`). */
button.primary { background: var(--fg); color: var(--bg); }
button.primary:hover { background: var(--fg-muted); color: var(--bg); }
button.quiet { border-color: transparent; background: transparent; }
button.quiet:hover { background: var(--bg-sunken); }
button.link { border: 0; background: none; padding: 0 2px; font-size: 12.5px; }
button.link:hover { background: none; color: var(--fg-muted); }
button[hidden], [hidden] { display: none !important; }
input, select, textarea {
  font-family: inherit; font-size: 14px; color: var(--fg); background: var(--bg-elevated);
  border: var(--border-width) solid var(--border); border-radius: 0; padding: .3rem .5rem;
  width: 100%; }
textarea { font-size: 14px; line-height: 1.6; resize: vertical; }

/* ─── 머리 ─────────────────────────────────────────────────────────────── */
/* 레포 이름 · 「카드 n · 언제 다시 그림」 · 보기 탭 · 찾기 · 모드. 모노 대문자 메타 줄은 없앴다 —
   본문 글꼴 12~13px(시안 2.4-3). 범례 줄도 없다: 카드 겉에서 기호를 뺐으니 풀어 줄 것이 없다. */
.head { position: sticky; top: 0; z-index: 40; background: var(--bg);
        border-bottom: var(--border-width) solid var(--border);
        padding: 12px 16px; display: flex; gap: 10px 14px; align-items: center;
        flex-wrap: wrap; }
.head h1 { font-size: 20px; line-height: 1.25; margin: 0; letter-spacing: -.01em;
           border: 0; padding: 0; }
.hd-meta { margin: 0; font-size: 12.5px; color: var(--fg-subtle);
           font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.spacer { flex: 1 1 auto; }
/* 머리의 보기 탭 · 「+ 카드」 · 테마는 한 묶음(`.hd-menu`)에 들어 있다 — 넓은 화면에서는 묶음이 없는 듯
   (`display: contents`) 제자리에 서고, 40rem 아래에서는 「보드 ▾」 메뉴 판이 된다. 차례는 `order` 로 잡는다:
   이름 · 메타 · 탭 → 찾기 · 모드 → + 카드 · 테마. 찾기 단추 · 메뉴 단추 · 짧은 모드 글은 40rem 아래에만. */
.hd-menu { display: contents; }
.head > .search, .head > .spacer, .head > .mode { order: 1; }
#t-add, #t-theme { order: 2; }
.only-narrow, .mode-short, .hd-menu-meta { display: none; }
.tabs { display: flex; border: var(--border-width) solid var(--border); }
.tabs button { border: 0; background: transparent; padding: 0 12px; min-height: 30px;
               font-size: 13px; font-weight: 600; }
.tabs button + button { border-left: var(--border-width) solid var(--border); }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.search { display: flex; align-items: center; gap: 6px; height: 34px; width: 220px;
          padding: 0 10px; border: var(--border-width) solid var(--border);
          background: var(--bg-elevated); }
.search svg { flex: none; color: var(--fg-subtle); }
.search input { border: 0; background: transparent; padding: 0; min-width: 0; outline: none; }
/* 입력칸 자신의 테를 지웠으니 포커스는 감싼 상자가 진다 — 3px 잉크(`--focus`). */
.search:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; }
/* 모드 — 점 + 글(`.mode` · `.mode-dot` · `.mode.file`)은 REPORT_STYLE.css 가 진다. 검토 화면 윗줄이 같은
   모양 · 같은 말을 써서 한 곳으로 모았다(KAN-021 S9). 이 파일은 그 뒤에 실린다. */

/* ─── 지금 볼 것 — 첫 화면 질문의 답 ───────────────────────────────────────
   내 차례 · 진행 중 · 막힘. 저장된 값(DATA)만 읽는다 — 저장 전 편집은 이 띠를 바꾸지 않는다.
   막힌 카드가 0장이어도 「막힌 카드 없음」 한 줄은 남긴다(「0건이면 안 그림」의 예외 — 첫 화면
   질문의 답이다, 시안 README 1절 가정 5). 서랍을 열어도 이 띠는 그대로다. */
/* 줄을 안 바꾼다 — 칸이 좁으면 칸 안에서 글이 감긴다(KAN-023 S5, 정할 것 4 · 시안 `BoardDrawer1024`). 줄을 바꾸면
   1024 에서 띠가 두 줄이 되어 판이 그만큼 내려갔다. 40rem 아래는 아래 규칙이 세로로 쌓는다. */
.waiting { display: flex; align-items: stretch;
           border-bottom: var(--border-width) solid var(--border); background: var(--bg-elevated); }
.waiting > * { margin: 0; }
.w-lead { padding: 10px 16px; font-weight: 700; font-size: 13px; display: flex;
          align-items: center; border-right: 1.5px solid var(--line-soft); white-space: nowrap; }
.w-item { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; padding: 8px 16px;
          border-right: 1.5px solid var(--line-soft); min-width: 0; font-size: 13px; }
.w-item > span { min-width: 0; overflow-wrap: anywhere; }
.w-tag { font-weight: 700; }
.w-none { padding: 8px 16px; display: flex; align-items: center; font-size: 13px;
          color: var(--fg-muted); }
/* 카드 이름은 서랍을 여는 단추다. 굵은 글로 보이고 밑줄은 짚었을 때만. */
.w-name { border: 0; background: none; padding: 0; font: inherit; font-size: inherit;
          font-weight: 700; color: var(--fg); text-align: left; }
.w-name:hover { background: none; text-decoration: underline; text-underline-offset: 3px; }
.link { color: var(--fg); font-weight: 600; text-decoration: underline;
        text-underline-offset: 3px; text-decoration-thickness: 1.5px; white-space: nowrap; }

/* 칸 이름표 — 칸은 「자리」라 칩이 아니라 왼쪽 네모 + 이름이다. 네모 색은 그 칸의 `--colc`. */
.colmark { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
           color: var(--fg-muted); white-space: nowrap; }
.colmark::before { content: ""; width: 10px; height: 10px; border: 1.5px solid var(--border);
                   background: var(--colc, var(--bg-sunken)); }

/* ─── 보드 ─────────────────────────────────────────────────────────────── */
/* 다섯 칸이 1280px 안에 다 든다 — 백로그 · 완료는 한 줄 카드라 좁게(.82fr). `minmax(0, …)` 라야
   긴 낱말이 칸을 밀어 화면 밖으로 내보내지 않는다(grid 자식의 min-width:auto). */
.stage { position: relative; padding: 12px 16px 8rem; }
.cols { display: grid; gap: 12px; align-items: stretch;
        grid-template-columns: minmax(0, .82fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, .82fr); }
.col { display: flex; flex-direction: column; min-width: 0; }
/* 칸 머리는 칠한 머리가 아니라 칸 색 6px 띠 + 이름 + 수. 할 일은 칸 색이 카드 바탕과 같아
   띠가 안 보이므로 2px 잉크선이다(띠 6 + 위 여백 8 = 선 2 + 위 여백 12 — 머리 높이가 같다). */
.col-head { display: flex; align-items: baseline; gap: 8px; padding: 8px 0;
            border-top: 6px solid var(--colc, var(--bg-sunken)); }
.col[data-col="todo"] .col-head { border-top: var(--border-width) solid var(--border); padding-top: 12px; }
.col-head b { font-size: 14px; }
.col-head .n { font-size: 13px; color: var(--fg-subtle); }
.col-head .cnote { margin-left: auto; font-size: 12px; color: var(--fg-subtle); white-space: nowrap; }
.col-body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px;
            padding: 4px 4px 1rem 0; min-height: 5rem; }
.col[data-col="backlog"] .col-body, .col[data-col="done"] .col-body { gap: 5px; }
/* 칸 위에 올림 — 어디에 놓이는가(motion.md 보드 표). 테와 바탕이 t-quick 으로 들어선다. */
.col.drop { outline: 2.5px dashed var(--fg); outline-offset: 4px;
            background: color-mix(in srgb, var(--colc, var(--bg-sunken)) 22%, transparent);
            animation: kb-drop-on var(--t-quick) var(--ease-out) 1 backwards; }
/* 백로그는 「누구의 하위인가」로 묶는다. */
.grp { margin: 0; padding: 6px 0 0; display: flex; gap: 6px; align-items: baseline;
       font-size: 12px; font-weight: 700; color: var(--fg-muted); }
.grp .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp .n { flex: none; color: var(--fg-subtle); font-weight: 500; }
.more { border-color: transparent; background: transparent; text-align: left; font-size: 13px;
        font-weight: 600; padding: 4px 8px; }
/* 칸 탭 · 카드 밑 단추 줄(「검토 리포트」 · 「칸 옮기기 ▾」)은 40rem 아래에만 선다(맨 아래 미디어 쿼리). */
.ctabs, .k-acts { display: none; }

/* 카드 표면은 **훑는 자리다** — 무엇을(짧은 제목) 왜(목적 한 줄) 두 줄과 상태 한 줄만 두고,
   나머지는 전부 상세 서랍으로 내린다. 진행 · 검토 상태 · 「내 차례」 · 하위 수는 모두 상태 줄
   안이고, 부모가 다른 칸이면 제목 위에 「상위 이름 ›」가 붙는다. id · 관계 기호 · 겹침은 겉에
   없다(서랍 몫). 같은 문장이 SKILL.md 5.8 · board.py 머리 설명에 있다 — 한 자리만 고치지 않는다.
   그림자는 짚었을 때만 — 그림자는 「지금 조작하는 자리」라는 뜻이다. */
.kcard { position: relative; background: var(--bg-elevated);
         border: var(--border-width) solid var(--border); padding: 10px 11px;
         display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0;
         transition: box-shadow var(--t-quick) var(--ease-out), border-color var(--t-quick) var(--ease-out),
                     opacity var(--t-quick) var(--ease-out); }
.kcard:hover { box-shadow: var(--offset); }
.kcard > * { margin: 0; min-width: 0; }
.kcard .crumb { font-size: 12px; color: var(--fg-subtle); white-space: nowrap; overflow: hidden;
                text-overflow: ellipsis; }
.kcard .what { font-size: 15px; line-height: 1.35; font-weight: 700; letter-spacing: -.005em;
               overflow-wrap: anywhere;
               display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
               overflow: hidden; }
.kcard .why { font-size: 13px; line-height: 1.45; color: var(--fg-muted); overflow-wrap: anywhere;
              display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
              overflow: hidden; }
.kcard .status { display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
                 font-size: 12.5px; color: var(--fg-muted); padding-top: 6px;
                 border-top: 1.5px solid var(--line-soft); }
.kcard .status > span { min-width: 0; overflow-wrap: anywhere; }
.kcard .status .cur { color: var(--fg); max-width: 100%; white-space: nowrap; overflow: hidden;
                      text-overflow: ellipsis; overflow-wrap: normal; }
/* 한 줄 카드(백로그 · 완료) — 제목 한 줄(+ 완료는 날짜 · 검토 수). 칸막이 색 테는 장식이고
   자리는 글자가 알린다(`--line-soft` 는 누를 자리의 유일한 경계가 아니다 — 시안 7절). */
.kcard.line { border: 1.5px solid var(--line-soft); padding: 6px 8px; gap: 1px; }
.kcard.line:hover { border-color: var(--border); box-shadow: none; }
.kcard.line .what { font-size: 13px; font-weight: 600; -webkit-line-clamp: 1; }
.kcard .lmeta { display: flex; gap: 6px; font-size: 11.5px; color: var(--fg-subtle);
                white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
/* 같은 칸의 하위 — 부모 밑 들여쓴 묶음 + 왼쪽 잉크선. */
.kids { margin-left: 14px; padding-left: 10px; border-left: var(--border-width) solid var(--border);
        display: flex; flex-direction: column; gap: 6px; }
.kids > p { margin: 0; }
.kids-label { font-size: 12px; color: var(--fg-subtle); }
.kcard.mini { padding: 7px 9px; gap: 3px; border-width: 1.5px; }
.kcard.mini .what { font-size: 13.5px; }
/* 고른 카드 = 잉크 3px 테 + 그림자. 테 두께는 안쪽 그림자로 더해 자리가 밀리지 않는다. */
.kcard.sel { border-color: var(--border); box-shadow: inset 0 0 0 1px var(--border), var(--offset-lg); }
.kcard.line.sel, .kcard.mini.sel { box-shadow: inset 0 0 0 1.5px var(--border), var(--offset-lg); }
.kcard.rel { outline: var(--border-width) solid var(--fg); outline-offset: 3px; }
/* 고른 카드와 이어진 카드 — 흐림 · 관계선 대신 테 + 낱말 꼬리표(시안 2.1-6). 참조는 점선 테다(낱말이 함께 말한다).
   꼬리표는 오른쪽 위 — 저장 전 꼬리표(왼쪽 위)와 겹치지 않고, 카드 사이 틈에 걸쳐 판을 밀지 않는다. */
.kcard.rel-ref { outline-style: dashed; }
.rtag { position: absolute; top: -9px; right: 8px; z-index: 2; display: inline-flex; align-items: center;
        height: 18px; padding: 0 6px; border: 1.5px solid var(--border); background: var(--bg-elevated);
        color: var(--fg); font-size: 11px; font-weight: 600; line-height: 1; white-space: nowrap; }
/* 카드를 잡음 — 잡혔다. 원래 자리가 흐려지고 그림자가 선다(t-press). */
.kcard.dragging { opacity: .4; box-shadow: var(--offset-lg); transition-duration: var(--t-press); }
/* 카드 위에 올림 — 이 카드의 하위가 된다. 칸 테는 켜지지 않는다(motion.md 보드 표). */
.kcard.drop-parent { outline: 2.5px dashed var(--fg); outline-offset: 3px;
                     animation: kb-outline-in var(--t-quick) var(--ease-out) 1 backwards; }
.kcard.drop-parent::after { content: "놓으면 이 카드의 하위로"; position: absolute; top: -11px; right: 6px;
  z-index: 3; display: inline-flex; align-items: center; height: 20px; padding: 0 6px;
  border: 1.5px dashed var(--pending-line); background: var(--bg); color: var(--fg-muted);
  font-size: 11.5px; font-weight: 500; white-space: nowrap; }

/* ─── 저장 전 덧칠 — 정본 위에 얹는다(시안 2.1-10 · BoardPending · BoardOps) ──────────
   저장 전에는 카드 칸 · 상태 줄 · 칩이 그대로다. 자리를 바꾸는 op(옮기기 · 하위로 넣기 · 보관)는
   원래 자리에 점선 테 + 꼬리표, 글만 고쳤으면 그 칸만 점선 테(`.fp`) + 꼬리표. 점선 = 저장 전. */
.kcard.pending, .kcard.line.pending { border-style: dashed; border-color: var(--pending-line); }
.kcard.tagged { margin-top: 8px; }
.kcard.archiving > :not(.ptag) { opacity: .75; }
.ptag { position: absolute; top: -11px; left: 10px; z-index: 2; display: inline-flex; align-items: center;
        height: 20px; max-width: calc(100% - 20px); padding: 0 6px; overflow: hidden;
        border: 1.5px dashed var(--pending-line); background: var(--bg); color: var(--fg-muted);
        font-size: 11.5px; font-weight: 500; line-height: 1; white-space: nowrap; text-overflow: ellipsis; }
.kcard.line .ptag { left: auto; right: 6px; height: 18px; font-size: 11px; }
/* 한 줄 카드는 안쪽 위 여백이 6px 라 꼬리표(위로 11px 걸침)가 제목을 덮는다 — 꼬리표가 붙으면 띄운다.
   같은 칸 하위 묶음 안의 작은 카드(위 여백 7px)도 같다. */
.kcard.line.tagged { margin-top: 10px; padding-top: 11px; }
.kcard.mini.tagged { padding-top: 12px; }
.kcard .fp { border: 1.5px dashed var(--pending-line); padding: 1px 6px; margin: 0 -7px; }
/* 유령 — 저장하면 설 자리. 새 카드(아직 안 쓰인 `.kcard.ghost`)와 옮겨 올 카드(`.ghost-card`). */
.kcard.ghost, .ghost-card { border: 2px dashed var(--fg); background: transparent; color: var(--fg-muted);
                            box-shadow: none; }
.kcard.ghost:hover { box-shadow: none; }
.ghost-card { position: relative; margin-top: 8px; padding: 13px 9px 7px; cursor: pointer; }
.ghost-card .what { font-size: 13.5px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.ghost-row { margin: 0 0 0 16px; border: 1.5px dashed var(--fg); color: var(--fg-muted); padding: 6px 8px;
             font-size: 13px; font-weight: 600; cursor: pointer; overflow-wrap: anywhere; }
/* 저장이 거부된 카드 — 빨간 테 + 카드 안 알림 줄(사유 원문). 다크에서도 읽히는 `--danger-fg`. */
.kcard.rejected { border-color: var(--danger-fg); border-style: solid; }
.kcard .notice { font-size: 12.5px; border-top: 1.5px solid var(--danger-fg); padding-top: 6px;
                 color: var(--fg); overflow-wrap: anywhere; }
.kcard .notice b { color: var(--danger-fg); }

/* ─── 방금 바뀜 — 저장된 새 데이터를 그린 뒤에만(KAN-021 S7 · motion.md 원칙 2 · 시안 Board p-saved) ──────
   파란 테(`--changed-line`) + 꼬리표 「방금 바뀜 · 검토 → 완료」가 이 탭의 세션 동안 남는다. 저장 전 덧칠이
   붙은 카드에는 그리지 않는다(둘을 섞지 않는다 — 스크립트가 고른다). 꼬리표 바탕 `--changed` 는 두 테마에서
   같은 밝은 값이라 글자는 늘 잉크다(README 7절 「방금 바뀜」 칩 9.81:1). 바탕이 한 번 잦아드는 것은 아래
   `fx-trace`(첫 색 `--changed-wash`) — 움직임 줄이기면 테와 꼬리표만 남는다. */
.kcard.changed { border-color: var(--changed-line); box-shadow: inset 0 0 0 1.5px var(--changed-line); }
.kcard.changed:hover { box-shadow: inset 0 0 0 1.5px var(--changed-line), var(--offset); }
.kcard.line.changed:hover { box-shadow: inset 0 0 0 1.5px var(--changed-line); }
.kcard.changed.sel { border-color: var(--border); box-shadow: inset 0 0 0 1px var(--border), var(--offset-lg); }
.ctag { position: absolute; top: -11px; left: 10px; z-index: 2; display: inline-flex; align-items: center;
        height: 20px; max-width: calc(100% - 20px); padding: 0 6px; overflow: hidden;
        border: 1.5px solid var(--changed-line); background: var(--changed); color: var(--ink);
        font-size: 11.5px; font-weight: 600; line-height: 1; white-space: nowrap; text-overflow: ellipsis; }
.kcard.line .ctag { left: auto; right: 6px; height: 18px; font-size: 11px; }
/* 칸 머리 「방금 보관 n」 — 이 세션에 저장해 빠진 카드 수(카드는 이미 보드에 없다). */
.col-head .gone { display: inline-flex; align-items: center; height: 18px; padding: 0 6px;
                  border: 1.5px solid var(--changed-line); background: var(--changed); color: var(--ink);
                  font-size: 11px; font-weight: 600; line-height: 1; white-space: nowrap; }

/* ─── 움직임(KAN-021 S7 · motion.md 보드 표) ──────────────────────────────────────
   `fx-*` 는 스크립트가 그 사건이 **처음 그려질 때 한 번만** 붙인다 — 이 화면은 sync 마다 카드를 통째로
   다시 그리므로 규칙에 박으면 그릴 때마다 되풀이된다(원칙 2). 채움은 `backwards` — 끝나면 요소 제 모양으로
   돌아간다. 시간 · 곡선은 토큰만. 움직임 줄이기는 REPORT_STYLE.css 한 곳이 모두 끈다(이 파일엔 없다). */
/* 놓음 → 저장 전 · 카드 추가 → 저장 전 — 유령 · 유령 줄 · 새 카드가 위 6px 에서 내려앉는다. */
.fx-land { animation: kb-land var(--t-move) var(--ease-snap) 1 backwards; }
/* 저장 → 다시 그림 — 바뀐 카드 바탕이 한 번 잦아든다. 자리를 옮긴 카드는 옮긴 뒤(FLIP 이 t-move). */
.fx-trace { animation: kb-trace var(--t-trace) var(--ease-out) 1 backwards; }
.fx-trace-late { animation: kb-trace var(--t-trace) var(--ease-out) var(--t-move) 1 backwards; }
.fx-new { animation: kb-land var(--t-move) var(--ease-snap) 1 backwards, kb-trace var(--t-trace) var(--ease-out) 1 backwards; }
/* 완료로 옮기기 거부 — 완료 쪽 28px 에서 제자리로(360ms 는 motion.md 의 값, 토큰 없음). */
.kcard.rejected.fx-snap { animation: kb-snapback 360ms var(--ease-snap) 1 backwards; }
/* 관계 표시 — 테 · 꼬리표가 나타난다(선은 버렸다). */
.kcard.fx-rel { animation: kb-outline-in var(--t-quick) var(--ease-out) 1 backwards; }
.kcard.fx-rel .rtag { animation: kb-fade-in var(--t-quick) var(--ease-out) 1 backwards; }
/* 보관 → 저장 전 — 글이 .75 로 흐려진다. */
.kcard.archiving.fx-dim > :not(.ptag) { animation: kb-dim-in var(--t-press) var(--ease-out) 1 backwards; }
/* 칸 머리 숫자가 새 값으로(저장으로 수가 바뀐 칸만). */
.col-head .n.fx-count { display: inline-block; animation: kb-count var(--t-count) var(--ease-move) 1 backwards; }
/* 빠지는 카드의 사본 — 보관돼 빠진 카드 · 찾기로 걸러진 카드가 그 자리에서 접히며 흐려진다(스크립트가
   옛 자리에 띄우고 접은 뒤 지운다). 판 위 떠 있는 층이라 배치를 밀지 않는다. */
.fx-layer { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 30; pointer-events: none; }
.fx-layer > .kcard { position: absolute; margin: 0; transform-origin: top; pointer-events: none; }
@keyframes kb-drop-on { 0% { outline-color: transparent; background-color: transparent; } }
@keyframes kb-outline-in { 0% { outline-color: transparent; } }
@keyframes kb-fade-in { 0% { opacity: 0; } }
@keyframes kb-dim-in { 0% { opacity: 1; } }

/* 칩 — 서랍 요청서 절 머리(서식 · 저자 · 미반영 · 승인 대기)와 「내 차례」 · 관계 낱말 라벨. */
.chip { border: 1px solid var(--border); padding: 0 .3rem; white-space: nowrap; }
.chip.warn { background: var(--warn); color: var(--ink); }
/* 「내 차례」 — 골드가 말하는 단 하나. 글자는 늘 잉크(골드는 두 테마에서 같은 값). */
.chip.you { display: inline-flex; align-items: center; height: 22px; padding: 0 7px;
            border: 1.5px solid var(--border); background: var(--you); color: var(--ink);
            font-family: var(--font-sans); font-size: 12px; font-weight: 600; line-height: 1; }
/* 진행 — 「n단계 중 m」 + 칸 막대. 칸이 스물을 넘으면 칸이 안 읽혀 이어진 막대로 그린다. */
.prog { display: inline-flex; align-items: center; gap: 8px; flex: 1 1 150px; min-width: 0;
        font-size: 12px; color: var(--fg-muted); white-space: nowrap; }
.seg { display: flex; gap: 2px; flex: 1 1 auto; min-width: 40px; max-width: 140px; }
.seg i { flex: 1 1 0; height: 8px; border: 1.5px solid var(--border); background: transparent; }
.seg i.on { background: var(--fg); }
.seg i.now { background: repeating-linear-gradient(45deg, var(--accent) 0 3px, transparent 3px 6px); }
.seg.cont { height: 8px; border: 1.5px solid var(--border); }
.seg.cont i { flex: none; height: 100%; border: 0; background: var(--fg); }

.addbtn { border-style: dashed; width: 100%; text-align: left; color: var(--fg-subtle); }
/* 칸 맨 아래 「+ 카드 추가」 폼 — 제목 · 요청서 틀(시안 BoardOps ①). */
.addform { border: var(--border-width) solid var(--border); background: var(--bg-elevated); padding: 10px;
           display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }
.addform label { display: flex; flex-direction: column; gap: 3px; font-weight: 700; color: var(--fg-muted); }
.addform input, .addform select { font-size: 13px; font-weight: 400; min-height: 32px; }
.addform .addnote { margin: 0; font-size: 12px; font-weight: 400; color: var(--fg-subtle); line-height: 1.5; }
.row2 { display: flex; flex-wrap: wrap; gap: 8px; }

/* ─── 계층 탭 ──────────────────────────────────────────────────────────── */
/* 구조는 그대로(KAN-021 S6 — 토큰 · 칸 색만 맞춤). 겹선은 흐린 글자색, 노드 바탕은 칸 색(TINT),
   노드 테는 잉크(`--border`), 노드 글자는 ON_TINT 가 고른 두 갈래다. */
.pane { display: none; }
.pane.on { display: block; }
.frame { border: var(--border-width) solid var(--border); background: var(--bg-elevated);
         padding: 1rem; overflow-x: auto; box-shadow: var(--offset); }
.frame svg { display: block; }
.frame text { font-family: var(--font-sans); fill: var(--fg); }
.frame .n-box { stroke: var(--border); stroke-width: 2; cursor: pointer; }
/* 백로그 노드는 흐린 테 — 다크에서 백로그(`--bg-sunken`) · 할 일(`--bg-elevated`) 바탕이 둘 다 어두워 바탕만으로는
   안 갈린다. 칸 색 역할은 그대로 두고 테로 가른다(KAN-021 S8). 칸 이름은 노드 둘째 줄 글이 늘 말한다. */
.frame .n-box.n-quiet { stroke: var(--fg-subtle); stroke-width: 1.5; }
.frame .edge { fill: none; stroke: var(--fg-subtle); stroke-width: 2; }
.frame .lbl { font-size: 12px; }
.frame .lbl.mono { font-family: var(--font-mono); font-size: 11px; fill: var(--fg-subtle); }
/* 칸 색(TINT) 위에 얹히는 글자는 **항상 잉크색이다.** `fill="var(--ink)"` 를 속성으로
   줘도 `.frame text { fill: var(--fg) }` 라는 CSS 규칙이 표현 속성을 이겨서 무시된다 —
   실측(다크): 노드 글자가 전부 #FAF2DD 로 계산돼 #FFFCF2 카드색 위에서 안 읽혔다.
   그래서 규칙으로 못 박고, `.lbl.mono` 보다 뒤에 둬 동점을 이긴다. */
.frame .lbl.on-tint { fill: var(--ink); }
/* 백로그 · 할 일 칸 색은 바탕 토큰이라 테마를 따라 뒤집힌다 — 그 위 글자도 본문색으로 따라간다
   (`ON_TINT`). 잉크로 박으면 다크에서 어두운 칸 위 어두운 글자가 된다. */
.frame .lbl.on-plain { fill: var(--fg); }

/* ─── 관계 탭(KAN-021 S6 · 시안 2.1-8 · BoardRelations · BoardRelations375) ─────────────
   왼쪽 넓은 단은 루트와 그 아래 카드, 오른쪽 400px 단은 참조 · 기다림 · 경로 겹침이다. 60rem 아래는
   한 단으로 쌓고, 40rem 아래는 루트 줄이 「이름 · 수」 줄 아래 막대로 갈린다(BoardRelations375).
   화살표 · 꺾쇠는 글자 기호가 아니라 테두리로 그린다. 막대 칸 위 글자는 칸 색을 따라 두 갈래다
   (`ON_TINT` — 밝은 칸 위는 잉크, 바탕 칸 위는 본문색). grid · flex 자식은 모두 `min-width: 0` 이라
   긴 이름이 화면 밖으로 밀지 않고 줄을 바꾼다. */
.rt { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; align-items: start;
      padding-top: 6px; }
.rt section { min-width: 0; }
.rt > *, .rt-side > * { margin: 0; }
.rt-side { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.rt-h { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; margin: 0 0 8px; padding: 0;
        border: 0; font-size: 15px; line-height: 1.35; letter-spacing: 0; }
.rt-h .n { font-size: 13px; font-weight: 500; color: var(--fg-subtle); font-variant-numeric: tabular-nums; }
.rt-lead { margin: 0 0 10px; font-size: 13px; line-height: 1.55; color: var(--fg-muted); }
.rt-none { margin: 0; padding: 10px 12px; font-size: 13.5px; line-height: 1.55; color: var(--fg-muted);
           border: 1.5px dashed var(--line-soft); }
/* 이름 단추 — 굵게 보이고 밑줄은 짚었을 때만(「지금 볼 것」 이름과 같은 꼴). */
.rt-go { border: 0; background: none; padding: 0; font: inherit; color: var(--fg); text-align: left;
         overflow-wrap: anywhere; min-width: 0; }
.rt-go.b { font-weight: 700; }
.rt-go:hover { background: none; text-decoration: underline; text-underline-offset: 3px; }
/* 루트 한 줄 = 펼침 꺾쇠 · 이름 + 칸 이름표 · 칸 막대 · 장 수. REPORT_STYLE 의 접기 모양(가라앉은 바탕 ·
   모노 글자 · 글자 꺾쇠)을 이 자리에서 벗긴다. */
.rt-list { border-top: var(--border-width) solid var(--border); }
.rt .rt-root { margin: 0; }
.rt .rt-root > summary { list-style: none; display: grid; grid-template-areas: "chev name bar n";
                         grid-template-columns: 10px minmax(0, 300px) minmax(0, 1fr) 64px; gap: 14px;
                         align-items: center; padding: 9px 10px; background: none; border: 0;
                         border-bottom: 1.5px solid var(--line-soft); font-family: var(--font-sans);
                         font-size: 13.5px; font-weight: 400; color: var(--fg); }
.rt .rt-root > summary::-webkit-details-marker { display: none; }
.rt .rt-root > summary::before, .rt .rt-root[open] > summary::before {
  content: ""; grid-area: chev; width: 7px; height: 7px; border-right: 2px solid var(--fg);
  border-bottom: 2px solid var(--fg); transform: rotate(-45deg); }
.rt .rt-root[open] > summary::before { transform: rotate(45deg); }
.rt .rt-root > summary:hover { background: var(--bg-sunken); }
/* 넓은 화면은 이름 한 줄(넘치면 말줄임 — 짚으면 제목 전체), 40rem 아래는 두 줄까지 줄을 바꾼다. */
.rt-name { grid-area: name; display: flex; align-items: center; gap: 2px 8px; min-width: 0; }
.rt-name b { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt-name .colmark { flex: none; }
/* 「열기」 — 그 루트 카드의 서랍으로. 이름 줄을 누르는 것은 접고 펴기라 길을 따로 둔다(KAN-021 S8). */
.rt-open { flex: none; padding: 0 8px; min-height: 24px; font-size: 12px; font-weight: 600; }
.rt-n { grid-area: n; text-align: right; font-size: 13px; color: var(--fg-subtle); font-variant-numeric: tabular-nums; }
/* 칸 막대 — 칸 한 조각이 그 칸에 놓인 하위 수만큼 늘어난다. 조각이 좁으면 칸 이름을 접고 수만 둔다. */
.rt-bar { grid-area: bar; display: flex; height: 22px; min-width: 0; border: var(--border-width) solid var(--border); }
.rt-bar i { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden;
            white-space: nowrap; font-style: normal; font-size: 11.5px; font-weight: 700;
            font-variant-numeric: tabular-nums; background: var(--colc); container-type: inline-size;
            border-right: 1.5px solid var(--border); }
.rt-bar i:last-child { border-right: 0; }
.rt-bar i.on-tint { color: var(--ink); }
.rt-bar i.on-plain { color: var(--fg); }
.rt-sl { margin-right: .3em; }
@container (max-width: 64px) { .rt-sl { display: none; } }
/* 펼친 줄기 — 지금 살아 있는 하위만. 깊이(`--d`)마다 22px 들여 쓰고 왼쪽 꺾인 선으로 잇는다. */
.rt-sub { padding: 6px 10px 10px; background: var(--bg-elevated); border-bottom: 1.5px solid var(--line-soft); }
.rt-sub > * { margin: 0; }
.rt-cap { padding: 2px 0 4px; font-size: 12px; color: var(--fg-subtle); }
.rt-line { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px;
           align-items: center; padding: 4px 0 4px calc(18px + var(--d, 0) * 22px); font-size: 13px; line-height: 1.4; }
.rt-line::before { content: ""; position: absolute; left: calc(4px + var(--d, 0) * 22px); top: 0; bottom: 50%;
                   width: 10px; border-left: 2px solid var(--border); border-bottom: 2px solid var(--border); }
.rt-ln { min-width: 0; overflow-wrap: anywhere; }
.rt-sub-n { font-size: 12px; color: var(--fg-subtle); }
.rt-ln .chip.you { margin-left: 4px; }
.rt-leaf-btn { margin-top: 8px; font-size: 13px; }
.rt-leaf { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column;
           border-top: 1.5px solid var(--line-soft); }
.rt-leaf li { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; margin: 0;
              padding: 6px 10px; font-size: 13px; border-bottom: 1.5px solid var(--line-soft); }
.rt-leaf .colmark { flex: none; }
/* 참조 — 이름 단 상자 → 상자. 화살표는 점선 + 테두리 세모, 그 위에 「부름」. */
.rt-ref { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr); align-items: center;
          margin: 0 0 10px; }
.rt-box { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; text-align: left;
          padding: 6px 9px; font-size: 13px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.rt-box .rt-bn { min-width: 0; max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2;
                 -webkit-box-orient: vertical; overflow: hidden; }
.rt-box small { font-size: 11.5px; font-weight: 500; color: var(--fg-subtle); }
.rt-arr { position: relative; height: 0; margin: 0 6px 0 4px; border-top: 2px dashed var(--fg); }
.rt-arr::after { content: ""; position: absolute; right: -4px; top: -6px; border-left: 8px solid var(--fg);
                 border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.rt-arr span { position: absolute; top: -19px; left: -6px; right: -6px; text-align: center; font-size: 11px;
               color: var(--fg-subtle); }
/* 기다림 · 경로 겹침 — 점선 상자 하나에 굵은 한 줄 + 풀이. 지금 막는 직렬 · 중재 전 겹침은 잉크 테. */
.rt-wait, .rt-ov { display: flex; flex-direction: column; gap: 4px; margin: 0 0 8px; padding: 10px 12px;
                   border: 1.5px dashed var(--line-soft); font-size: 13.5px; line-height: 1.55; min-width: 0; }
.rt-wait.on { border: var(--border-width) solid var(--border); }
.rt-wait > *, .rt-ov > * { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.rt-st { font-size: 12.5px; color: var(--fg-muted); }
.rt-why { font-size: 12.5px; color: var(--fg-subtle); }
.rt-ob { font-weight: 700; }
.rt-om { font-size: 12.5px; color: var(--fg-muted); }
.rt-names { font-size: 12.5px; color: var(--fg-subtle); }
.rt-names .rt-go { font-weight: 400; color: var(--fg-subtle); }
.rt-pair { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; padding: 4px 0;
           border-top: 1.5px solid var(--line-soft); }
.rt-pair .rt-st { flex-basis: 100%; }
.rt-pair.open .rt-st { color: var(--fg); font-weight: 600; }
.rt-note { margin: 4px 0 0; font-size: 12px; line-height: 1.55; color: var(--fg-subtle); }
@media (max-width: 60rem) {
  .rt { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .rt-roots, .rt-side > section { padding: 14px 0; border-bottom: var(--border-width) solid var(--border); }
  .rt-side { gap: 0; }
  .rt-side > section:last-child { border-bottom: 0; }
}
@media (max-width: 40rem) {
  .rt .rt-root > summary { grid-template-areas: "chev name n" ". bar bar"; grid-template-columns: 10px minmax(0, 1fr) auto;
                           gap: 6px 8px; padding: 10px 0; }
  .rt-name { flex-wrap: wrap; }
  .rt-name b { white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2;
               -webkit-box-orient: vertical; }
  .rt-bar { height: 24px; }
  .rt-sub { padding: 6px 8px 4px; border: 1.5px solid var(--line-soft); margin-bottom: 6px; }
  .rt-ref { grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr); }
  .rt-box { font-size: 12.5px; padding: 6px 8px; }
  .rt .rt-root > summary, .rt-leaf-btn { min-height: 44px; }
}

/* ─── 상세 서랍(KAN-021 S5 · 시안 2.1-6 · 2.1-7 · BoardDrawer · BoardDrawer375) ─────────────
   폭 496px, 오른쪽에 붙는다. 1100px 이상에서 열리면 판의 백로그 · 완료가 52px 띠로 접히고 판은 서랍
   왼쪽으로 비켜 선다(아래 「서랍이 열린 판」). 「지금 볼 것」 띠는 그대로다. 머리는 골드를 쓰지 않는다 —
   골드는 「내 차례」 칩 · 진행 중 칸 띠만 말한다(시안 2.1-4). 서랍의 자리는 왼쪽 잉크 테 + 그림자다.
   열기는 `translateX(24px→0)` + 투명→불투명(t-move · ease-out), 닫기는 반대로 열림의 0.75배(180ms) ease-in
   (motion.md 보드 표). 닫힌 서랍은 `visibility: hidden` 이라 키보드 차례 · 누름에서도 빠진다.
   서랍의 위 끝은 머리 · 「지금 볼 것」 띠의 아래다(`--drawer-top` — 스크립트가 잰다, KAN-021 S8). 맨 위부터
   덮으면 머리 단추와 띠 오른쪽이 가려져 「서랍을 열어도 지금 볼 것은 남는다」(맞춤 라운드 2 답 6)가 깨진다. */
.drawer { position: fixed; top: var(--drawer-top, 0px); right: 0; bottom: 0; width: min(496px, 100vw);
          background: var(--bg-elevated); border-left: 3px solid var(--border); z-index: 60;
          transform: translateX(24px); opacity: 0; visibility: hidden; pointer-events: none;
          transition: transform calc(var(--t-move) * .75) var(--ease-in), opacity calc(var(--t-move) * .75) var(--ease-in),
                      visibility 0s linear calc(var(--t-move) * .75);
          display: flex; flex-direction: column; font-size: 14px; line-height: 1.55;
          overflow-wrap: anywhere; }
.drawer.on { transform: none; opacity: 1; visibility: visible; pointer-events: auto; box-shadow: -5px 0 0 var(--border);
             transition: transform var(--t-move) var(--ease-out), opacity var(--t-move) var(--ease-out), visibility 0s; }
/* 긴 낱말(영문 id · 경로 · 띄어쓰기 없는 단계 이름)이 칸을 밀어내지 않게 — KAN-020. 원인은 grid · flex
   자식의 min-width:auto 다. 특이도 0(:where)이라 진행 막대의 최소 폭 같은 자리 규칙은 그대로 이긴다. */
:where(.drawer *) { min-width: 0; }
.drawer h2, .drawer h3, .drawer p, .drawer dl, .drawer dd, .drawer ul { margin: 0; }
/* 40rem 아래 시트 윗줄 「‹ 보드 · 카드 상세」 — 넓은 화면엔 없다(BoardDrawer375). */
.d-sheet { display: none; }
.drawer-head { padding: 14px 18px 12px; border-bottom: var(--border-width) solid var(--border);
               display: flex; flex-direction: column; gap: 6px; }
.d-top { display: flex; align-items: center; gap: 8px; }
.d-sub { font-size: 12px; color: var(--fg-subtle); }
.d-x { padding: 4px 6px; display: inline-flex; align-items: center; }
.drawer-head h2 { border: 0; padding: 0; font-size: 21px; line-height: 1.3; letter-spacing: -.01em; }
.d-long { font-size: 13px; color: var(--fg-muted); line-height: 1.5; }
.d-prog { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
.d-links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px; }
.d-reports { display: contents; }
/* 리포트는 다른 화면으로 가는 길이라 링크다 — 모양만 단추(테 두른 단추 · 내 차례면 잉크 바탕). */
a.btn { display: inline-flex; align-items: center; min-height: 30px; padding: .2rem .7rem;
        border: var(--border-width) solid var(--border); background: var(--bg-elevated); color: var(--fg);
        font-size: 13px; font-weight: 600; text-decoration: none; }
a.btn:hover { background: var(--bg-sunken); color: var(--fg); }
a.btn.primary { background: var(--fg); color: var(--bg); }
a.btn.primary:hover { background: var(--fg-muted); color: var(--bg); }
.d-links button { font-size: 13px; min-height: 30px; }
.drawer-head .fp { border: 1.5px dashed var(--pending-line); padding: 1px 6px; margin: 0 -7px; }
.drawer-body { flex: 1 1 auto; overflow-y: auto; padding: 0 0 4rem; }
.d-sec { padding: 14px 18px; border-bottom: 1.5px solid var(--line-soft); display: flex;
